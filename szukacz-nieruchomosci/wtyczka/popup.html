<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#15181d;--muted:#5d6572;--line:#e1e4ea;--accent:#1f6f5f;--soft:#e3f1ed;--ok:#1f9d6b;--near:#2f7fd1;--weak:#c47f12;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1f26;--ink:#e8ebf0;--muted:#9aa3b0;--line:#2a313b;--accent:#4fb39a;--soft:#163129}}
*{box-sizing:border-box}
body{width:400px;margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{padding:12px;display:grid;gap:10px}
h1{font-size:15px;margin:0;display:flex;align-items:center;gap:8px}
h1 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:inherit;font:12px ui-monospace,monospace;padding:7px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--card);color:inherit;border-radius:8px;padding:7px 11px;cursor:pointer;font:inherit;font-weight:500}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted);font-size:12px}
.prof{font-size:13px;line-height:1.5}
.prof b{font-weight:600}
label.sw{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.res{display:grid;gap:6px;max-height:360px;overflow:auto}
.it{border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:8px;padding:7px 9px;cursor:pointer;background:var(--card)}
.it:hover{border-color:var(--accent)}
.it.ok{border-left-color:var(--ok)}.it.near{border-left-color:var(--near)}.it.weak{border-left-color:var(--weak)}.it.bad{border-left-color:var(--bad);opacity:.75}
.it .h{display:flex;gap:8px;align-items:baseline}
.it .pct{font-weight:700}
.it .why{font-size:12px;color:var(--muted)}
.it .sn{font-size:12px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it a{font-size:12px;color:var(--accent)}
.stat{display:flex;gap:10px;font-size:12px;color:var(--muted)}
.stat b{color:var(--ink)}
.hidden{display:none}
.err{color:var(--bad);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Szukacz nieruchomości <span id="ver" style="font:600 11px ui-monospace,monospace;color:var(--muted)"></span> <small id="host"></small></h1>

  <div class="card" id="profCard">
    <div class="prof" id="prof">Brak profilu. Skopiuj go w aplikacji przyciskiem „Kopiuj profil do wtyczki” i wklej poniżej.</div>
    <div class="row" style="margin-top:6px">
      <button class="btn" id="togglePaste">Wklej / zmień profil</button>
      <button class="btn" id="clearProfile">Usuń profil</button>
    </div>
    <div id="pasteBox" class="hidden" style="margin-top:8px">
      <textarea id="paste" placeholder='{"_app":"szukacz-nieruchomosci", ...}'></textarea>
      <div class="row" style="margin-top:6px"><button class="btn primary" id="saveProfile">Zapisz profil</button><span class="err" id="pasteErr"></span></div>
    </div>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:8px">
      <button class="btn primary" id="openScanner" style="width:100%">Skaner grup: szukaj grup i przeglądaj posty z X dni</button>
    </div>
    <div class="row">
      <button class="btn" id="scan">Skanuj tę stronę</button>
      <button class="btn" id="clear">Zdejmij oznaczenia</button>
    </div>
    <div class="row" style="margin-top:8px;gap:14px">
      <label class="sw"><input type="checkbox" id="dim">przyciemnij odrzucone</label>
      <label class="sw" id="autoWrap"><input type="checkbox" id="auto">skanuj sam na Facebooku</label>
    </div>
    <div class="stat" id="stat" style="margin-top:8px"></div>
    <div class="err" id="err"></div>
  </div>

  <div class="res" id="res"></div>

  <div class="card">
    <div class="row">
      <button class="btn" id="addSrc">Dodaj tę stronę do źródeł</button>
      <button class="btn" id="copySrc">Kopiuj listę źródeł</button>
      <span class="muted" id="srcCnt"></span>
    </div>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
