<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1f2e">
<title>Audyt nieruchomości — asystent zakupu</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#0f1218; --panel:#161b26; --panel2:#1d2432; --line:#2a3243;
  --tx:#e8ecf4; --tx2:#94a3b8; --tx3:#64748b;
  --red:#ef4444; --redbg:#2a1618; --yellow:#f59e0b; --yellowbg:#2a2110; --green:#22c55e; --greenbg:#122619;
  --blue:#3b82f6; --bluebg:#132133;
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3,h4{margin:0;font-weight:650;line-height:1.25}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;font-size:16px}

/* ---------- layout ---------- */
.wrap{max-width:860px;margin:0 auto;padding:0 14px 130px}
header{position:sticky;top:0;z-index:400;background:rgba(15,18,24,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hd{max-width:860px;margin:0 auto;padding:11px 14px;display:flex;align-items:center;gap:10px}
.hd h1{font-size:16px;flex:1;letter-spacing:-.2px}
.hd .sub{font-size:11px;color:var(--tx3);font-weight:400;display:block;margin-top:1px}
.iconbtn{background:var(--panel2);color:var(--tx2);border-radius:8px;padding:7px 10px;font-size:12px;font-weight:600}
.iconbtn:active{background:var(--line)}
.iconbtn.danger{color:#fca5a5}
.iconbtn.danger:active{background:var(--redbg)}

/* ---------- tabs ---------- */
nav.tabs{position:sticky;top:53px;z-index:390;background:rgba(15,18,24,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tabsin{display:flex;gap:5px;padding:9px 14px;max-width:860px;margin:0 auto;width:max-content;min-width:100%}
.tab{background:transparent;color:var(--tx3);padding:6px 11px;border-radius:99px;font-size:13px;
  font-weight:600;white-space:nowrap;border:1px solid transparent;display:flex;align-items:center;gap:6px}
.tab.on{background:var(--panel2);color:var(--tx);border-color:var(--line)}
.tab .dot{width:7px;height:7px;border-radius:99px;flex:none}
.dot.red{background:var(--red)}.dot.yellow{background:var(--yellow)}
.dot.green{background:var(--green)}.dot.none{background:var(--tx3);opacity:.35}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:15px;margin:13px 0}
.card.tight{padding:13px}
.card h2{font-size:15px;margin-bottom:3px;letter-spacing:-.2px}
.card h3{font-size:13px;color:var(--tx2);margin:16px 0 8px;text-transform:uppercase;
  letter-spacing:.6px;font-weight:700}
.card h3:first-child{margin-top:0}
.lead{color:var(--tx2);font-size:13px;margin:0 0 12px}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
  padding:3px 8px;border-radius:99px;letter-spacing:.3px;text-transform:uppercase}
.b-auto{background:var(--bluebg);color:#7dabf8}
.b-semi{background:#2a2110;color:#fbbf24}
.b-man{background:#241a2e;color:#c084fc}
.b-field{background:#0e2a26;color:#5eead4}

/* ---------- forms ---------- */
label.f{display:block;margin:11px 0}
label.f > span{display:block;font-size:13px;color:var(--tx2);margin-bottom:5px;font-weight:500}
input[type=text],input[type=number],input[type=url],select,textarea{
  width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--tx);
  padding:10px 12px;border-radius:9px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
textarea{min-height:70px;resize:vertical;line-height:1.45}
.row{display:flex;gap:9px;flex-wrap:wrap}
.row > *{flex:1;min-width:130px}

.btn{background:var(--blue);color:#fff;padding:11px 16px;border-radius:9px;font-weight:650;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}
.btn:active{opacity:.8}
.btn.sec{background:var(--panel2);color:var(--tx);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:8px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}

/* ---------- choice chips ---------- */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--tx2);
  padding:8px 13px;border-radius:9px;font-size:13.5px;font-weight:550}
.chip.on{border-color:var(--blue);background:var(--bluebg);color:#c7dcfb}
.chip.on.r{border-color:var(--red);background:var(--redbg);color:#fca5a5}
.chip.on.y{border-color:var(--yellow);background:var(--yellowbg);color:#fcd34d}
.chip.on.g{border-color:var(--green);background:var(--greenbg);color:#86efac}

/* ---------- question block ---------- */
.q{border-top:1px solid var(--line);padding:14px 0}
.q:first-of-type{border-top:none;padding-top:4px}
.q .qt{font-size:14.5px;font-weight:600;margin-bottom:2px;display:flex;gap:8px;align-items:flex-start}
.q .qt .n{color:var(--tx3);font-weight:700;font-size:12px;padding-top:3px;flex:none;min-width:26px}
.q .qw{font-size:12.5px;color:var(--tx3);margin:3px 0 0 34px;line-height:1.45}
.q .qbody{margin-left:34px;margin-top:9px}
.help{background:var(--panel2);border-left:2px solid var(--blue);border-radius:0 8px 8px 0;
  padding:11px 13px;margin-top:9px;font-size:13px;color:var(--tx2);line-height:1.55}
.help b{color:var(--tx);font-weight:650}
.help ol,.help ul{margin:7px 0 0;padding-left:18px}
.help li{margin:4px 0}
.help a{color:#7dabf8}
details.hlp summary{font-size:12.5px;color:#7dabf8;cursor:pointer;font-weight:600;
  list-style:none;padding:5px 0;user-select:none}
details.hlp summary::-webkit-details-marker{display:none}
details.hlp summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
details.hlp[open] summary::before{content:"▾ "}

/* ---------- flag inline ---------- */
.fl{margin-top:9px;padding:10px 12px;border-radius:9px;font-size:13px;display:flex;gap:9px;align-items:flex-start}
.fl .ico{font-size:14px;line-height:1.35;flex:none}
.fl.red{background:var(--redbg);border:1px solid #4a2226;color:#fecaca}
.fl.yellow{background:var(--yellowbg);border:1px solid #4a3a15;color:#fde68a}
.fl.green{background:var(--greenbg);border:1px solid #1d4429;color:#bbf7d0}
.fl b{display:block;margin-bottom:2px}
.fl .cost{margin-top:5px;font-size:12px;opacity:.85;font-weight:600}

/* ---------- result table ---------- */
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;margin-top:4px}
.kv dt{color:var(--tx3)}
.kv dd{margin:0;font-weight:600;word-break:break-word}

/* ---------- map ---------- */
#map{height:230px;border-radius:10px;margin-top:11px;border:1px solid var(--line);background:var(--panel2)}
.leaflet-container{background:#0d1117}

/* ---------- summary bar ---------- */
.bar{position:fixed;bottom:0;left:0;right:0;z-index:500;background:rgba(22,27,38,.97);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.barin{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:11px}
.cnt{display:flex;gap:8px;flex:1;flex-wrap:wrap}
.cbox{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;
  padding:5px 9px;border-radius:8px;background:var(--panel2)}
.cbox.r{color:#fca5a5}.cbox.y{color:#fcd34d}.cbox.g{color:#86efac}
.cbox small{font-weight:500;color:var(--tx3);font-size:11px}
.verdict{font-size:12px;color:var(--tx3);margin-top:5px;max-width:860px;margin-left:auto;margin-right:auto}
.verdict b{color:var(--tx2)}

.drawer{position:fixed;inset:0;z-index:600;background:rgba(8,11,16,.72);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;padding:64px 14px 20px;overflow-y:auto}
.drawer .dwin{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;
  width:100%;max-width:620px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.dhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.dhead b{flex:1;font-size:15px}
.drawer textarea{min-height:190px;margin-bottom:10px}
.iconbtn.hi{background:var(--bluebg);color:#93c5fd}

/* ---------- prompt dla wtyczki ---------- */
.pcard{border-color:#1e3a5f;background:linear-gradient(180deg,#111a26,var(--panel))}
.pcard h3{color:#7dabf8}
.pbox{background:#0d1520;border:1px solid #1e3a5f;border-radius:9px;padding:11px 12px;margin-top:9px}
.pbox .ph{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.pbox .ph b{flex:1;font-size:12px;color:#7dabf8;text-transform:uppercase;letter-spacing:.5px}
.pbox pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11.5px;line-height:1.5;color:#a9c4e4;max-height:190px;overflow-y:auto}
.pbox .hint{font-size:11.5px;color:var(--tx3);margin-top:8px;line-height:1.45}
.mbox{border-left:2px solid #c084fc}

/* ---------- toolbar modulu ---------- */
.toolbar{position:sticky;top:100px;z-index:300;background:rgba(29,36,50,.97);
  backdrop-filter:blur(10px);border-color:#33405a;padding:9px 12px}
.idrow{display:flex;align-items:center;gap:9px;flex-wrap:nowrap}
.idrow .lbl{font-size:10.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;
  font-weight:700;flex:none}
.idrow .idv{font-size:13px;color:#7dd3fc;font-weight:600;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idrow .btn{flex:none;padding:5px 10px;font-size:12px}
.chiplinks{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.chiplinks::-webkit-scrollbar{display:none}
.chiplinks a{flex:none;background:var(--panel);border:1px solid var(--line);color:var(--tx2);
  padding:5px 10px;border-radius:7px;font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap}
.chiplinks a:active{background:var(--line);color:var(--tx)}
@media (max-width:520px){.toolbar{top:96px}}

/* ---------- misc ---------- */
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.25);
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.msg{padding:10px 12px;border-radius:9px;font-size:13px;margin-top:10px}
.msg.err{background:var(--redbg);color:#fca5a5;border:1px solid #4a2226}
.msg.ok{background:var(--greenbg);color:#bbf7d0;border:1px solid #1d4429}
.msg.info{background:var(--bluebg);color:#bfdbfe;border:1px solid #1e3a5f}
.hidden{display:none !important}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.copyable{background:var(--panel2);border:1px solid var(--line);padding:9px 11px;border-radius:8px;
  display:flex;align-items:center;gap:9px;margin-top:7px}
.copyable code{flex:1;overflow-x:auto;white-space:nowrap;color:#7dd3fc}
.pill{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--panel2);color:var(--tx3);font-weight:600}
.linklist{display:flex;flex-direction:column;gap:7px;margin-top:9px}
.linkitem{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:11px 12px;text-decoration:none;color:var(--tx)}
.linkitem:active{background:var(--line)}
.linkitem .t{flex:1;font-size:13.5px;font-weight:600}
.linkitem .d{font-size:11.5px;color:var(--tx3);font-weight:400;display:block;margin-top:1px}
.linkitem .arr{color:var(--tx3);font-size:15px}
.poi{display:flex;align-items:baseline;gap:9px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.poi:last-child{border-bottom:none}
.poi .dist{font-weight:700;min-width:62px;font-size:12.5px}
.poi .nm{flex:1}
.poi .tg{font-size:11px;color:var(--tx3)}
.report{background:#fff;color:#111;padding:26px;border-radius:10px;font-size:13.5px;line-height:1.6}
.report h1{font-size:19px;margin-bottom:3px;color:#111}
.report h2{font-size:14px;margin:20px 0 7px;color:#111;border-bottom:1px solid #ddd;padding-bottom:4px}
.report .sub{color:#666;font-size:12px}
.report table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}
.report th,.report td{text-align:left;padding:6px 8px;border-bottom:1px solid #e5e5e5;vertical-align:top}
.report th{background:#f6f6f6;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#555}
.report .rr{color:#b91c1c;font-weight:700}
.report .ry{color:#b45309;font-weight:700}
.report .rg{color:#15803d;font-weight:700}
.report blockquote{background:#f7f7f7;border-left:3px solid #999;margin:10px 0;padding:11px 14px;font-size:13px}
@media print{body{background:#fff}.wrap{padding:0;max-width:none}
  header,nav.tabs,.bar,.noprint{display:none !important}
  .report{padding:0;border-radius:0}}
@media (max-width:520px){.hd h1{font-size:15px}.card{padding:13px}}
</style>
</head>
<body>

<header>
  <div class="hd">
    <div style="flex:1">
      <h1 id="hdTitle">Audyt nieruchomości</h1>
      <span class="sub" id="hdSub"></span>
    </div>
    <button class="iconbtn" onclick="saveFile()">Zapisz</button>
    <button class="iconbtn" onclick="document.getElementById('loadF').click()">Otwórz</button>
    <button class="iconbtn hi" onclick="togglePaste()">Wklej wyniki</button>
    <button class="iconbtn danger" onclick="resetAll()">Nowy</button>
    <input type="file" id="loadF" accept=".json" class="hidden" onchange="loadFile(event)">
    <input type="file" id="fieldF" accept=".txt,.csv" class="hidden" onchange="importField(event)">
  </div>
</header>

<nav class="tabs"><div class="tabsin" id="tabs"></div></nav>

<div class="drawer hidden" id="pasteDrawer">
  <div class="dwin">
    <div class="dhead">
      <b>Wklej wyniki</b>
      <button class="iconbtn" onclick="togglePaste(false)">Zamknij</button>
    </div>
    <p class="lead" style="margin:0 0 10px">Jedno miejsce na wszystko: odpowiedzi wtyczki, treść strony z Notion
      albo wypełnioną notatkę z telefonu. Rozpoznam, z której sekcji pochodzą, i dopiszę je do audytu —
      to, co już wypełnione, zostaje nietknięte.</p>
    <textarea id="gText" placeholder="Wklej tutaj treść. Może pochodzić z jednej sekcji albo z kilku naraz."></textarea>
    <button class="btn wide" onclick="importGlobal()">Wczytaj odpowiedzi</button>
    <div id="pasteMsg"></div>
  </div>
</div>

<div class="wrap" id="view"></div>

<div class="bar">
  <div class="barin">
    <div class="cnt">
      <div class="cbox r"><span id="cR">0</span> <small>czerwone</small></div>
      <div class="cbox y"><span id="cY">0</span> <small>żółte</small></div>
      <div class="cbox g"><span id="cG">0</span> <small>OK</small></div>
      <div class="cbox" style="color:#93c5fd"><span id="cCost">0 zł</span> <small>do negocjacji</small></div>
    </div>
    <button class="btn sm" onclick="go('raport')">Raport</button>
  </div>
  <div class="verdict" id="verdict"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ============================================================
   AUDYT NIERUCHOMOŚCI — asystent zakupu domu z działką
   ============================================================ */

/* ---------- STATE ---------- */
const S = {
  meta:{adres:'',otodom:'',cena:'',powDom:'',powDzialka:'',rok:'',opis:''},
  parcel:null,          // {id, woj, powiat, gmina, obreb, nr, area, lat, lon}
  a:{},                 // odpowiedzi: {checkId: value}
  n:{},                 // notatki: {checkId: text}
  poi:null,             // wynik Overpass
  rcn:{},
  ts:new Date().toISOString()
};
let TAB='start';

function save(){ try{localStorage.setItem('audyt_v1',JSON.stringify(S))}catch(e){} }
function load(){ try{const d=localStorage.getItem('audyt_v1'); if(d)Object.assign(S,JSON.parse(d))}catch(e){} }
/* ponowne kliknięcie zaznaczonej opcji ją odznacza — bez tego
   przypadkowy klik zostawał w audycie jako potwierdzona odpowiedź */
function set(k,v){ if(S.a[k]===v)delete S.a[k]; else S.a[k]=v; save(); render(); }
function note(k,v){ S.n[k]=v; save(); paintBar(); }

/* ============================================================
   TOŻSAMOŚĆ APLIKACJI
   ============================================================ */
const APP={name:'Audyt Nieruchomości', ver:'1.7', data:'sierpień 2026',
  prawo:'stan prawny: sierpień 2026'};

/* ============================================================
   PROMPTY DLA WTYCZKI CLAUDE W CHROME
   Każdy prompt niesie kontekst nieruchomości, zadanie i wymuszony
   format odpowiedzi — taki, który aplikacja rozpozna przy imporcie.
   ============================================================ */
/* Fakty już ustalone w audycie — trafiają do promptu, żeby wtyczka
   nie szukała po omacku tego, co masz w ręku, i mogła od razu użyć
   numeru księgi, przeznaczenia w planie czy ceny ofertowej. */
function knownFacts(c){
  const p=S.parcel||{}, a=S.a, m=S.meta, F=[];
  const lab=(id)=>{const ch=allChecks().find(x=>x.id===id); if(!ch||!ch.opts)return a[id];
    const o=ch.opts.find(x=>x[0]===a[id]); return o?o[1]:a[id];};
  const has=id=>a[id]&&a[id]!=='?';

  if(p.id)F.push('Identyfikator działki: '+p.id);
  if(p.region)F.push('Obręb: '+p.region);
  if(p.commune)F.push('Gmina: '+p.commune+(p.county?', '+p.county:''));
  if(p.area)F.push('Powierzchnia z geometrii: '+fmt(p.area)+' m²');
  else if(m.powDzialka)F.push('Powierzchnia działki wg ogłoszenia: '+m.powDzialka+' m²');
  if(p.lat)F.push('Współrzędne: '+p.lat.toFixed(5)+', '+p.lon.toFixed(5));

  /* numer księgi przydaje się nie tylko w module Księga — pozwala
     zweryfikować powierzchnię, właściciela i obciążenia przy innych pytaniach */
  if(has('kw_nr'))F.push('Numer księgi wieczystej: '+a.kw_nr);

  if(has('p_mpzp'))F.push('Plan miejscowy: '+lab('p_mpzp')
    +(has('p_przezn')&&a.p_przezn!=='nd'?', przeznaczenie '+lab('p_przezn'):''));
  if(has('g_uzytek'))F.push('Użytek gruntowy: '+lab('g_uzytek'));
  if(has('kw_forma'))F.push('Forma własności: '+lab('kw_forma'));
  if(m.rok)F.push('Rok budowy: '+m.rok);
  if(m.powDom)F.push('Powierzchnia domu: '+m.powDom+' m²');
  if(m.cena)F.push('Cena ofertowa: '+fmt(m.cena)+' zł'
    +(m.powDom?' ('+fmt(m.cena/m.powDom)+' zł/m² pow. domu)':''));
  if(m.otodom)F.push('Ogłoszenie: '+m.otodom);
  return F;
}

function promptFor(c){
  const opts=c.opts?c.opts.filter(o=>o[0]!=='?'):[];
  const F=knownFacts(c);
  const cur=S.a[c.id]&&S.a[c.id]!=='?';
  const curLab=cur&&c.opts?((c.opts.find(o=>o[0]===S.a[c.id])||[])[1]||S.a[c.id]):S.a[c.id];
  return `[${APP.name} v${APP.ver}]
Nieruchomość: ${S.meta.adres||'(adres nie podany)'}

CO JUŻ USTALONE
${F.length?F.map(x=>'- '+x).join('\n'):'- brak danych, zacznij od wyszukania nieruchomości'}
${cur?'\nW audycie zapisano już odpowiedź: „'+curLab+'”. Zweryfikuj ją i popraw, jeśli źródła mówią co innego.':''}

TRYB PRACY
- Wykonaj wszystkie kroki jednym ciągiem. Nie zatrzymuj się między nimi po potwierdzenie.
- Nie przedstawiaj planu do akceptacji — plan masz poniżej, po prostu go zrealizuj.

function parseNotion(t){
  const acc={n:0,notes:0,skipped:0};
  let cur=null;
  t.split(/\r?\n/).forEach(l=>{
    /* nagłówek pytania: kod w apostrofach na końcu */
    const mId=l.match(/`([a-z_0-9]+)`\s*$/i);
    if(mId&&/^#{1,6}\s|^\*\*|^[A-ZĄĆĘŁŃÓŚŹŻ]/.test(l.replace(/^#+\s*/,''))){cur=mId[1];return;}
    if(!cur)return;
    /* zaznaczona opcja: - [x] kod — opis  (Notion używa też ✓ przy kopiowaniu) */
    const mOpt=l.match(/^\s*[-*]?\s*\[\s*[xX✓]\s*\]\s*([^\s—–-]+)\s*[—–-]/);
    if(mOpt){ if(applyAnswer(cur,mOpt[1],acc))acc.n++; return; }
    const mFree=l.match(/^\s*[-*]?\s*\[[^\]]*\]\s*odpowiedz:\s*(.+)$/i);
    if(mFree){ if(applyAnswer(cur,mFree[1],acc))acc.n++; return; }
    const mN=l.match(/^\s*>?\s*notatka:\s*(.*)$/i);
    if(mN&&mN[1].trim()){S.n[cur]=mN[1].trim();acc.notes++;}
  });
  return acc;
}

function importField(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const txt=String(r.result).replace(/^﻿/,'');
    const res = /^\s*"?ID"?\s*[;,]/i.test(txt) ? parseCsv(txt) : parseTxt(txt);
    e.target.value='';
    if(!res.n){alert('Nie znalazłem żadnych odpowiedzi w tym pliku.\n\nSprawdź, czy zaznaczyłeś odpowiedzi znakiem x w nawiasie, albo czy w arkuszu wypełniona jest kolumna "Odpowiedz".');return;}
    save();render();
    alert('Wczytano '+res.n+' '+(res.n===1?'odpowiedź':'odpowiedzi')
      +(res.notes?' i '+res.notes+' notatek':'')
      +(res.skipped?'\n\nPominięto '+res.skipped+' nierozpoznanych wartości.':''));
  };
  r.readAsText(f,'utf-8');
}
function applyAnswer(id,val,acc){
  const c=allChecks().find(x=>x.id===id); if(!c)return false;
  val=String(val).trim(); if(!val)return false;
  if(c.opts){
    let hit=c.opts.find(o=>o[0].toLowerCase()===val.toLowerCase());
    if(!hit)hit=c.opts.find(o=>o[1].toLowerCase()===val.toLowerCase());
    if(!hit){acc.skipped++;return false;}
    S.a[id]=hit[0];
  } else S.a[id]=val;
  return true;
}
function parseTxt(t){
  const acc={n:0,notes:0,skipped:0};
  const lines=t.split(/\r?\n/); let cur=null;
  lines.forEach(l=>{
    const mId=l.match(/^\s*\[([a-z_0-9]+)\]/i);
    if(mId){cur=mId[1];return;}
    if(!cur)return;
    const mOpt=l.match(/^\s*\(\s*[xX]\s*\)\s*([^\s=]+)\s*=/);
    if(mOpt){ if(applyAnswer(cur,mOpt[1],acc))acc.n++; return; }
    const mFree=l.match(/^\s*odpowiedz:\s*(.+)$/i);
    if(mFree){ if(applyAnswer(cur,mFree[1],acc))acc.n++; return; }
    const mN=l.match(/^\s*(?:#\s*)?notatka:\s*(.*)$/i);
    if(mN&&mN[1].trim()){S.n[cur]=mN[1].trim();acc.notes++;}
  });
  return acc;
}
function splitCsvLine(l,sep){
  const out=[];let cur='',q=false;
  for(let i=0;i<l.length;i++){const ch=l[i];
    if(q){ if(ch==='"'){ if(l[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"')q=true;
    else if(ch===sep){out.push(cur);cur='';}
    else cur+=ch;}
  out.push(cur);return out;
}
function parseCsv(t){
  const acc={n:0,notes:0,skipped:0};
  const first=t.split(/\r?\n/)[0];
  const sep=(first.split(';').length>=first.split(',').length)?';':',';
  const rows=[];let buf='',q=false;
  t.split(/\r?\n/).forEach(l=>{
    const quotes=(l.match(/"/g)||[]).length;
    if(q){buf+='\n'+l; if(quotes%2)q=false; if(!q){rows.push(buf);buf='';}}
    else if(quotes%2){q=true;buf=l;}
    else if(l.trim())rows.push(l);
  });
  rows.slice(1).forEach(l=>{
    const c=splitCsvLine(l,sep).map(x=>x.trim());
    if(!c[0])return;
    if(c[3]&&applyAnswer(c[0],c[3],acc))acc.n++;
    if(c[5]){const ch=allChecks().find(x=>x.id===c[0]); if(ch){S.n[c[0]]=c[5];acc.notes++;}}
  });
  return acc;
}

const Y=(t,w,cmin,cmax,arg)=>({lv:'yellow',t,w,cmin:cmin||0,cmax:cmax||0,arg});

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>new Intl.NumberFormat('pl-PL').format(Math.round(n));
const zl=n=>fmt(n)+' zł';
function dist(a,b,c,d){const R=6371000,t=Math.PI/180,x=(c-a)*t,y=(d-b)*t,
  h=Math.sin(x/2)**2+Math.cos(a*t)*Math.cos(c*t)*Math.sin(y/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));}
const allChecks=()=>M.flatMap(m=>m.checks.map(c=>({...c,mid:m.id})));
function nTask(mid){const m=M.find(x=>x.id===mid);return m?m.checks.filter(c=>c.task).length:0;}

function flagsAll(){
  const out=[];
  M.forEach(m=>m.checks.forEach(c=>{
    if(!c.flag)return;
    const v=S.a[c.id]; if(v==null||v===''||v==='?')return;
    const f=c.flag(v); if(f)out.push({...f,mid:m.id,mname:m.name,cid:c.id,q:c.q});
  }));
  if(S.poi&&S.poi.list)S.poi.list.forEach(p=>{
    if(p.lv==='red'||p.lv==='yellow')out.push({lv:p.lv,t:p.n+' w odległości '+p.dtxt,w:p.w,cmin:0,cmax:0,
      arg:p.n+' w odległości '+p.dtxt+' od nieruchomości.',mid:'m8',mname:'Sąsiedztwo',cid:'poi_'+p.k});
  });
  return out;
}
function modFlagLevel(mid){
  const f=flagsAll().filter(x=>x.mid===mid);
  if(f.some(x=>x.lv==='red'))return'red';
  if(f.some(x=>x.lv==='yellow'))return'yellow';
  if(f.length)return'green';
  return'none';
}
function paintBar(){
  const f=flagsAll();
  const r=f.filter(x=>x.lv==='red').length, y=f.filter(x=>x.lv==='yellow').length, g=f.filter(x=>x.lv==='green').length;
  const cmin=f.reduce((s,x)=>s+(x.cmin||0),0), cmax=f.reduce((s,x)=>s+(x.cmax||0),0);
  $('#cR').textContent=r; $('#cY').textContent=y; $('#cG').textContent=g;
  $('#cCost').textContent = cmin? fmt(cmin)+'+ zł' : (cmax? 'do '+fmt(cmax)+' zł' : '0 zł');
  const done=allChecks().filter(c=>c.type!=='info'&&S.a[c.id]!=null&&S.a[c.id]!==''&&S.a[c.id]!=='?').length;
  const tot=allChecks().filter(c=>c.type!=='info').length;
  let v;

  else if(r>0) v='<b>Wstrzymaj się.</b> '+r+' '+(r===1?'wada blokująca':'wady blokujące')+' do wyjaśnienia przed umową przedwstępną. Sprawdzono '+done+'/'+tot+'.';

  else v='<b>Bez poważnych zastrzeżeń.</b> Sprawdzono '+done+'/'+tot+' punktów.';
  $('#verdict').innerHTML=v;
}

5. Jeśli pole jest puste, sprawdź to samo w geoportalu krajowym mapy.geoportal.gov.pl (warstwa Ewidencja gruntów i budynków → Użytki gruntowe). Puste pole w obu serwisach jest częstą sytuacją i wtedy po prostu to napisz.`,
  manual:`<b>Telefon do wydziału geodezji starostwa powiatowego.</b> Podajesz identyfikator działki i pytasz o oznaczenie użytku oraz klasę. Odpowiedź dostajesz od ręki, bez opłat i bez wykazywania interesu prawnego, bo to dane przedmiotowe.
   <br><br><b>Wypis z rejestru gruntów</b> — dokument urzędowy, kilkadziesiąt złotych, wydawany zwykle w kilka dni. Wniosek składasz w starostwie (wydział geodezji) osobiście, pocztą albo przez ePUAP. Wypis z danymi właściciela wymaga wykazania interesu prawnego, ale wypis bez tych danych, z samym użytkiem i powierzchnią, dostanie każdy.
   <br><br><b>Najprościej:</b> poproś sprzedającego. On jako właściciel zamówi pełny wypis bez żadnych przeszkód.`,
  flag:v=>{
    if(v==='Ls')return R('Działka to las (Ls)','Zabudowa wymaga wyłączenia z produkcji leśnej. Zgoda Ministra Środowiska, procedura długa i często odmowna. Jeśli stoi tam dom, prawdopodobnie jest samowolą albo użytek jest nieaktualny.',0,0,'Grunt leśny w ewidencji — bez zmiany klasyfikacji nieruchomość ma ograniczoną przydatność budowlaną.');
    if(v==='Lz')return Y('Grunty zadrzewione i zakrzewione (Lz)','Oznaczenie mylone z lasem, ale to nie to samo — Lz nie podlega ustawie o lasach, więc nie ma procedury odlesienia. Nie znaczy to jednak, że można budować bez przeszkód: jeśli plan miejscowy albo WZ nie dopuszczają zabudowy, zapis i tak blokuje. Sprawdź w Banku Danych o Lasach, czy teren nie jest tam ujęty jako las.',0,0,'Grunt zadrzewiony wymagający zmiany klasyfikacji przed zabudową.');
    if(v==='W')return R('Działka sklasyfikowana jako wody','Grunt pod wodami. Zabudowa praktycznie wykluczona, obrót ograniczony.',0,0,null);
    if(v==='dr')return R('Działka sklasyfikowana jako droga','Użytek „dr" oznacza grunt drogowy. Nie postawisz tam budynku bez zmiany klasyfikacji.',0,0,null);
    if(v==='R')return Y('Grunty orne (R)','Jeśli nie ma MPZP dopuszczającego zabudowę, budowa wymaga odrolnienia. Sprawdź sekcję „Plan".',0,0,'Grunt orny wymagający procedury wyłączenia z produkcji rolnej.');
    if(v==='Ps')return Y('Użytek zielony (Ps/Ł)','Podobnie jak grunty orne: bez zapisu w planie potrzebna zmiana przeznaczenia.',0,0,null);
    if(v==='Br')return G('Zabudowa zagrodowa (Br)','Typowe dla siedlisk. Zwykle bez przeszkód, ale sprawdź czy nie ma ograniczeń dla nierolników.');
    if(v==='B'||v==='Bi')return G('Teren zabudowany','Najlepszy możliwy zapis. Nie wymaga odrolnienia.');
    if(v==='N')return Y('Nieużytek (N)','Zwykle grunt słaby lub podmokły. Sprawdź geologię poniżej.',0,0,null);
    return null;},
  help:`<b>Krok po kroku w Geoportalu krajowym:</b>
   <ol><li>Otwórz Geoportal (link w pasku wyżej), wejdź w <b>Wyszukiwania → Wyszukiwanie działek</b> i wklej identyfikator.</li>
   <li>W panelu warstw włącz <b>Ewidencja gruntów i budynków</b>, a w niej <b>Użytki gruntowe</b>.</li>
   <li>Kliknij narzędziem „i" (informacja) w działkę.</li></ol>
   <b>Jeśli w okienku widzisz same nagłówki bez wartości</b> — to nie awaria. Geoportal krajowy pośredniczy w dostępie
   do baz powiatowych, a wiele powiatów nie udostępnia przez tę usługę atrybutów opisowych, tylko geometrię i identyfikator.
   Wtedy zostaje geoportal powiatowy, telefon do wydziału geodezji albo wypis z rejestru gruntów.
   <br><br><b>Skrót dla niecierpliwych:</b> jeśli na działce stoi legalny dom z pozwoleniem na budowę, użytek jest niemal
   na pewno budowlany (B lub Bi). Klasa i użytek mają realne znaczenie tylko wtedy, gdy planujesz coś postawić
   na niezabudowanej części działki.
   <br><br><b>Sygnał ostrzegawczy:</b> jeśli dom stoi, a użytek to R albo Ls, zapytaj sprzedającego wprost,
   dlaczego ewidencja nie została zaktualizowana.`},

 {id:'g_klasa', src:'raport', mode:'semi', q:'Jaka klasa bonitacyjna gruntu?',
  why:'Klasy I–III są chronione. Zmiana przeznaczenia wymaga zgody Ministra Rolnictwa.',
  type:'select', opts:[['brak','Nie dotyczy (teren zabudowany)'],['I-III','I, II, III (IIIa/IIIb)'],['IV','IV (IVa/IVb)'],['V-VI','V, VI'],['?','Nie sprawdzone']],
  task:`Ustal klasę bonitacyjną gruntu (cyfra rzymska przy literze użytku, np. RIIIa, ŁIV).
1. Otwórz geoportal powiatowy dla tego powiatu, a jeśli nie odpowiada, geoportal krajowy mapy.geoportal.gov.pl.
2. W geoportalu krajowym włącz warstwę Ewidencja gruntów i budynków → Kontury klasyfikacyjne.
3. Kliknij w działkę i odczytaj oznaczenie.
4. Jeśli na działce występuje kilka konturów o różnych klasach, wypisz wszystkie w notatce i wybierz kod odpowiadający najwyższej (najbardziej chronionej) klasie.`,
  manual:`<b>Ta sama droga co przy użytku gruntowym</b> — telefon do wydziału geodezji starostwa albo wypis z rejestru gruntów. Klasa i użytek są w tym samym dokumencie, więc pytaj o jedno i drugie za jednym razem.
   <br><br><b>Przy zabudowanej działce w mieście</b> klasa zwykle nie ma zastosowania, bo grunt figuruje jako teren zabudowany. Jeśli budynek stoi legalnie, wyłączenie z produkcji rolnej nastąpiło dawno temu.`,
  flag:v=>{
    if(v==='I-III')return Y('Grunt klasy chronionej I–III','Zmiana przeznaczenia w planie wymaga zgody Ministra Rolnictwa i Rozwoju Wsi. Dla osoby prywatnej to procedura długa i często bezskuteczna. Decyzja starosty o wyłączeniu z produkcji bywa wymagana zawsze, ale przy domu jednorodzinnym na własne cele mieszkaniowe do 500 m² nie płacisz należności ani opłat rocznych. Powyżej 500 m² koszty idą w dziesiątki tysięcy.',0,35000,'Grunt klasy chronionej I–III: ryzyko i koszt procedury wyłączenia z produkcji rolnej po stronie kupującego.');
    if(v==='IV')return Y('Grunt klasy IV','Ochrona słabsza niż przy I–III, ale decyzja o wyłączeniu z produkcji nadal bywa wymagana, zwłaszcza dla gruntów pochodzenia organicznego.',0,8000,null);
    if(v==='V-VI')return G('Klasa V–VI','Grunty słabe, najłatwiejsze do przekształcenia. Zwykle bez zgody ministra.');
    if(v==='brak')return G('Teren zabudowany','Klasa bonitacyjna nie ma zastosowania.');
    return null;},
  help:`Klasa to cyfra rzymska doklejona do litery użytku: <span class="mono">RIIIa</span> to grunt orny klasy IIIa.
   Widnieje w tym samym miejscu co użytek — jeśli tam było pusto, tu też będzie.
   <br><br><b>Rozróżnienie, które często się myli:</b>
   <ul><li><b>Zmiana przeznaczenia</b> w planie miejscowym — dla klas I–III wymaga zgody Ministra Rolnictwa. Robi to gmina, nie ty.
     Jeśli działka ma już MPZP z przeznaczeniem budowlanym, ten etap jest za tobą.</li>
   <li><b>Wyłączenie z produkcji rolnej</b> — decyzja starosty, którą uzyskujesz ty przed pozwoleniem na budowę.</li></ul>`},

 {id:'g_geo', src:'raport', mode:'field', q:'Jaki grunt jest pod spodem?',
  why:'Torfy i namuły oznaczają wymianę gruntu albo palowanie. Przy istniejącym domu — ryzyko osiadania.',
  type:'select', opts:[['pl','pl / ps — piaski'],['gl','gl — glina'],['ip','ip — ił'],['T','T — TORFY'],['Nm','Nm — namuły'],['z','z — grunty organiczne'],['?','Nie sprawdzone']],
  flag:v=>{
    if(v==='T')return R('Torfy pod działką','Grunt organiczny, nienośny i ściśliwy. Przy nowej budowie: wymiana gruntu lub pale. Przy istniejącym domu sprawdź fundamenty pod kątem pęknięć i osiadania — to może być wada ukryta warta więcej niż cała negocjacja.',40000,150000,'Podłoże torfowe wymaga wzmocnienia posadowienia lub generuje ryzyko osiadania istniejącego budynku.');
    if(v==='z')return R('Użytki zielone na gruntach organicznych','To samo ryzyko co przy torfach: podłoże ściśliwe i nienośne. Wymaga badań geotechnicznych, a przy istniejącym budynku sprawdzenia, czy fundamenty nie osiadły.',40000,150000,'Podłoże organiczne wymagające wzmocnienia posadowienia.');
    if(v==='Nm')return Y('Namuły (Nm)','Grunt organiczny, słabonośny. Zwykle podnosi koszt posadowienia i wymaga badań geotechnicznych.',20000,70000,'Grunt słabonośny — konieczne badania geotechniczne i prawdopodobne wzmocnienie posadowienia.');
    if(v==='ip')return Y('Iły','Grunt spoisty i pęczniejący przy nawilgoceniu. Praktycznie nie przepuszcza wody, więc rozsączanie deszczówki i drenaż rozsączający oczyszczalni nie zadziałają. Przy zmianach wilgotności potrafi powodować ruchy fundamentów.',10000,40000,'Podłoże ilaste utrudniające odprowadzenie wód i obciążające posadowienie.');
    if(v==='gl')return Y('Grunty gliniaste','Nośne, ale słabo przepuszczalne. Utrudniają odprowadzenie wody deszczowej i wykluczają zwykłe rozsączanie. Sprawdź, czy nie zbiera się woda przy budynku.',5000,20000,null);
    if(v==='pl')return G('Piaski i żwiry','Najlepsze podłoże budowlane: nośne i przepuszczalne.');
    return null;},
  help:`<b>Dwie drogi sprawdzenia:</b>
   <ol><li><b>W Geoportalu:</b> panel warstw → <b>Mapy tematyczne</b> → <b>Mapa glebowo-rolnicza</b>.
     Oznaczenia: <span class="mono">pl</span> piasek luźny i <span class="mono">ps</span> piasek słabogliniasty są bezpieczne,
     <span class="mono">gl</span> glina i <span class="mono">ip</span> ił bywają kłopotliwe, a <span class="mono">T</span> torfy,
     <span class="mono">Nm</span> namuły i <span class="mono">z</span> grunty organiczne to sygnał alarmowy.
     Warstwa jest dostępna nie wszędzie.</li>
   <li><b>W terenie, za darmo:</b> rozejrzyj się. Wierzby, olchy, trzcina, sitowie i turzyce oznaczają wysoki poziom wody
     i grunt organiczny. Sprawdź, czy w rowie obok stoi woda w lipcu.</li></ol>
   <b>Test na miejscu:</b> jeśli sprzedający pozwoli, wbij pręt zbrojeniowy 1,5 m w kilku miejscach. Jeśli wchodzi bez oporu — masz odpowiedź.
   <br><br><b>Przy domu istniejącym</b> obejrzyj cokół i ściany w piwnicy: pęknięcia ukośne w narożnikach to klasyczny objaw nierównomiernego osiadania.`},

 {id:'g_woda', src:'raport', mode:'field', q:'Czy teren ma zagłębienia bezodpływowe lub ślady stojącej wody?',
  why:'Woda, która nie ma gdzie odpłynąć, wraca do piwnicy.',
  type:'yn', opts:YN,
  flag:v=>v==='tak'?Y('Zagłębienie bezodpływowe / stojąca woda','Konieczne rozwiązanie odwodnienia: drenaż opaskowy, studnia chłonna albo niwelacja terenu. Przy istniejącym domu z piwnicą sprawdź izolację przeciwwilgociową.',8000,40000,'Teren wymaga systemu odwodnienia — brak naturalnego spływu wód opadowych.'):(v==='nie'?G('Teren bez zastoisk wody','Naturalny spływ wód działa.'):null),
  help:`<b>W Geoportalu:</b> panel warstw → <b>Rzeźba terenu</b> → włącz <b>Hipsometrię</b> i <b>Cieniowanie</b>.
   Zagłębienia bezodpływowe widać jako ciemniejsze plamy bez odpływu.
   <br><br><b>W terenie:</b> szukaj śladów po wodzie — poziomej linii zabrudzenia na cokole, mchu u podstawy ścian,
   zapachu wilgoci w piwnicy, rdzy na dolnych zawiasach bramy garażowej.
   <br><br><b>Najlepszy moment na oględziny:</b> dzień po dużym deszczu albo wczesną wiosną. Jeśli oglądasz w suchym lipcu,
   zapytaj sąsiada, jak tu jest w marcu.`},

 {id:'g_ksztalt', src:'wlasne', mode:'field', q:'Jaki jest kształt działki i ile z niej realnie da się wykorzystać?',
  why:'Powierzchnia z ewidencji to nie to samo co powierzchnia użyteczna.',
  type:'select', opts:[['dobry','Regularny, dobrze wykorzystany'],['waski','Wąski pas'],['nieregularny','Nieregularny / trudny'],['?','Nie oceniono']],
  flag:v=>{
    if(v==='waski')return Y('Działka wąska','Przy szerokości poniżej 16–18 m odległości od granic (4 m przy ścianie z oknami, 3 m bez okien) zjadają większość szerokości. Rozbudowa wszerz i wolnostojący garaż bywają wykluczone. Policz, co realnie zostaje.',0,0,'Wąski kształt działki ogranicza możliwości rozbudowy i zagospodarowania.');
    if(v==='nieregularny')return Y('Nieregularny kształt','Trójkąty, ostre narożniki i wcięcia obniżają powierzchnię użyteczną. Sprawdź, gdzie realnie zmieści się to, co planujesz.',0,0,null);
    if(v==='dobry')return G('Kształt regularny','');
    return null;},
  help:`<b>Policz szybko:</b> od szerokości działki odejmij 4 m z jednej strony i 3 m z drugiej — tyle zostaje na zabudowę wszerz.
   Przy 13 m szerokości to 6 m, czyli wąski dom albo nic więcej.
   <br><br><b>W terenie zwróć uwagę na:</b> martwe narożniki, pas wzdłuż ogrodzenia zajęty przez sieci,
   miejsce na zawrócenie samochodem, faktyczną przestrzeń między domem a granicą.
   <br><br><b>Na mapie:</b> obwód i pole z geoportalu pozwalają oszacować proporcje. Dla prostokąta o polu P i obwodzie O
   boki wychodzą z równania a+b=O/2 oraz a·b=P.`},

 {id:'g_slonce', src:'wlasne', mode:'field', q:'Jak działka i dom są ustawione względem stron świata?',
  why:'Ekspozycja decyduje o świetle w domu i o tym, czy ogród będzie użyteczny.',
  type:'select', opts:[['dobra','Ogród i salon na południe / zachód'],['srednia','Mieszana'],['zla','Ogród i okna głównie na północ'],['?','Nie sprawdzono']],
  flag:v=>{
    if(v==='zla')return Y('Niekorzystna ekspozycja','Ogród od północy jest zacieniony przez dom przez większą część dnia, a pomieszczenia od północy wymagają więcej światła sztucznego. Trudno to zmienić bez przebudowy.',0,0,'Niekorzystna ekspozycja względem stron świata.');
    if(v==='dobra')return G('Dobra ekspozycja','Ogród i pomieszczenia dzienne nasłonecznione.');
    return null;},
  help:`<b>Jak sprawdzić w 30 sekund:</b> włącz kompas w telefonie stojąc tyłem do frontu domu. Sprawdź, gdzie wypada ogród i okna salonu.
   <br><br><b>Co jest korzystne:</b> ogród i pomieszczenia dzienne na południe lub zachód, sypialnie na wschód,
   pomieszczenia gospodarcze i garaż na północ.
   <br><br><b>Sprawdź też zacienienie:</b> wysokie drzewa i budynki od południa potrafią odciąć słońce zimą, gdy jest najniżej.`},

 {id:'g_historia', src:'raport', mode:'semi', q:'Co było na tym terenie 10–20 lat temu?',
  why:'Wyrównany, ładny teren bywa zasypanym stawem, wyrobiskiem albo dzikim wysypiskiem.',
  type:'select', opts:[['bezzmian','Bez zmian — zawsze wyglądał tak samo'],['zabudowa','Wcześniejsza zabudowa'],
    ['woda','Był tam staw / rozlewisko'],['wyrobisko','Wyrobisko, żwirownia, wysypisko'],['?','Nie sprawdzone']],
  flag:v=>{
    if(v==='wyrobisko')return R('Teren nasypowy po wyrobisku lub wysypisku','Grunt nasypowy jest niejednorodny i nieprzewidywalny, a przy dawnym wysypisku dochodzi ryzyko skażenia i wydzielania gazów. Posadowienie wymaga badań geotechnicznych i zwykle wzmocnienia.',50000,200000,'Teren nasypowy po dawnym wyrobisku lub składowisku — nieprzewidywalne warunki posadowienia.');
    if(v==='woda')return R('Zasypany zbiornik wodny','Pod nasypem zostaje warstwa osadów organicznych, która osiada latami. To klasyczna przyczyna pękania budynków kilka lat po budowie. Zleć badania geotechniczne przed decyzją.',40000,180000,'Teren po zasypanym zbiorniku wodnym — ryzyko osiadania i osadów organicznych w podłożu.');
    if(v==='zabudowa')return Y('Wcześniejsza zabudowa','Mogły zostać stare fundamenty, szamba, zasypane piwnice albo gruz. Nie zawsze problem, ale warto wiedzieć przed kopaniem.',5000,30000,null);
    if(v==='bezzmian')return G('Teren bez ingerencji','Zdjęcia archiwalne nie pokazują zmian ukształtowania.');
    return null;},
  help:`<b>To jeden z najtańszych i najskuteczniejszych trików w całym audycie.</b> Zajmuje pięć minut i potrafi wykryć wadę,
   której nie widać w żadnym rejestrze.
   <ol><li>Otwórz <b>Google Earth</b> (link w pasku wyżej), znajdź adres.</li>
   <li>Włącz <b>zdjęcia historyczne</b> (ikona zegara na górnym pasku).</li>
   <li>Przewijaj suwakiem wstecz, aż dojdziesz do najstarszego dostępnego zdjęcia, zwykle 15–20 lat.</li>
   <li>Obserwuj, co się zmienia: ciemna plama wody, wykop, hałda, ślady po maszynach, nagłe wyrównanie terenu.</li></ol>
   <b>Drugie źródło:</b> Geoportal ma archiwalne ortofotomapy.
   <br><br><b>Jeśli coś znajdziesz</b>, nie rezygnuj od razu — poproś o badania geotechniczne. Przy istniejącym domu
   sprawdź, czy nie ma pęknięć i czy posadzki są poziome.`},

 {id:'g_spadek', src:'raport', mode:'field', q:'Jakie jest nachylenie działki?',
  why:'Spadek powyżej 10% podnosi koszt zagospodarowania i może wymagać murów oporowych.',
  type:'select', opts:[['plaska','Płaska lub delikatny spadek'],['sredni','Wyraźny spadek (ok. 5–10%)'],['duzy','Stromy (powyżej 10%)'],['?','Nie oceniono']],
  flag:v=>{
    if(v==='duzy')return Y('Działka stroma','Mury oporowe, schody terenowe, utrudniony wjazd zimą. Przy istniejącym domu sprawdź stan skarp i murów oporowych.',20000,90000,'Ukształtowanie terenu wymaga zabezpieczenia skarp i podnosi koszt zagospodarowania.');
    if(v==='sredni')return Y('Umiarkowany spadek','Do opanowania, ale podnosi koszt tarasowania i odwodnienia.',5000,25000,null);
    if(v==='plaska')return G('Teren płaski','Najniższy koszt zagospodarowania.');
    return null;},
  help:`Geoportal → warstwa <b>Rzeźba terenu</b>, narzędzie <b>profil terenu</b>: przeciągnij linię przez działkę,
   dostaniesz wykres wysokości.
   <br><br>Licz prosto: różnica wysokości 2 m na 20 m długości to 10% spadku.`}
]},

/* ---------------- M2 KSIĘGA WIECZYSTA ---------------- */
{id:'m2', name:'Księga', icon:'2', title:'Księga wieczysta',
 lead:'Najważniejszy dokument w całej transakcji. Bez przeczytania wszystkich czterech działów nie podpisuj niczego, nawet umowy przedwstępnej.',
 checks:[

 {id:'kw_nr', src:'wlasne', mode:'man', q:'Numer księgi wieczystej', type:'text', ph:'np. PO1P/00123456/7',
  why:'Sprzedający ma obowiązek go podać. Odmowa to sama w sobie czerwona flaga.',
  task:`Pomóż odczytać księgę wieczystą tej nieruchomości.
1. Otwórz przegladarka-ekw.ms.gov.pl
2. Poproś użytkownika o wpisanie numeru księgi i przepisanie kodu captcha — tego kroku nie możesz wykonać za niego.
3. Po otwarciu księgi przejdź kolejno przez działy: I-O, I-Sp, II, III, IV.
4. Dla każdego działu wypisz treść wpisów oraz wszystkie wzmianki widoczne u góry działu.
5. Zwróć zwięzłe podsumowanie: obszar z działu I-O, służebności z I-Sp, właściciele i podstawa nabycia z II, obciążenia z III, hipoteki z IV.`,
  manual:`<b>Przeglądarka ksiąg wieczystych wymaga captcha</b>, więc żaden automat nie odczyta księgi samodzielnie. Numer wpisujesz i captcha przepisujesz ręcznie, dopiero potem można poprosić o pomoc w interpretacji treści.
   <br><br><b>Jeśli sprzedający nie chce podać numeru:</b> możesz go ustalić w wydziale ksiąg wieczystych sądu rejonowego właściwego dla położenia nieruchomości, wykazując interes prawny. W praktyce odmowa podania numeru jest sygnałem sama w sobie.
   <br><br><b>Odpis zwykły</b> kosztuje 30 zł, <b>odpis zupełny</b> 60 zł. Zamawiasz przez ekw.ms.gov.pl albo w Centralnej Informacji Ksiąg Wieczystych. Zupełny pokazuje też wpisy wykreślone, czyli całą historię nieruchomości — przy poważnej transakcji warto.
   <br><br><b>Akta księgi wieczystej</b> przegląda się w sądzie. Tam sprawdzisz, czego dotyczy wzmianka.`,
  help:`<b>Jak odczytać księgę krok po kroku:</b>
   <ol><li>Wejdź na <a href="https://przegladarka-ekw.ms.gov.pl/" target="_blank">przegladarka-ekw.ms.gov.pl</a>.</li>
   <li>Wpisz numer w formacie <span class="mono">KOD/NUMER/CYFRA</span> i przepisz captcha.</li>
   <li>Wybierz <b>„Przeglądanie aktualnej treści KW"</b>.</li>
   <li>Przejrzyj kolejno wszystkie działy: I-O, I-Sp, II, III, IV. Zrób zrzut ekranu każdego.</li></ol>
   <b>Nie ma publicznego API</b> do ksiąg wieczystych — to jedyna część audytu, którą musisz wykonać ręcznie. Zajmie ci 5 minut.`},

 {id:'kw_wzmianka', src:'wlasne', mode:'man', q:'Czy w którymkolwiek dziale widnieje wzmianka?',
  why:'Wzmianka oznacza, że złożono wniosek, który nie został jeszcze rozpoznany. Treść księgi jest wtedy nieaktualna.',
  type:'yn', opts:YN,
  flag:v=>v==='tak'?R('Wzmianka w księdze — dane nieaktualne','Ktoś złożył wniosek o wpis, który czeka na rozpoznanie. To może być cokolwiek: nowa hipoteka, zajęcie komornicze, roszczenie. Rękojmia wiary publicznej ksiąg wieczystych nie chroni cię w zakresie objętym wzmianką. Ustal w sądzie, czego dotyczy, zanim pójdziesz dalej.',0,0,'Nieujawniony stan prawny — wzmianka w księdze wymaga wyjaśnienia przed transakcją.'):(v==='nie'?G('Brak wzmianek','Treść księgi jest aktualna na moment odczytu.'):null),
  help:`Wzmianki wyświetlają się <b>u góry każdego działu</b>, w rubryce „Wzmianki w księdze wieczystej". Łatwo je przeoczyć, bo są nad właściwą treścią.
   <br><br><b>Co zrobić, jeśli jest:</b> idź do wydziału ksiąg wieczystych sądu rejonowego i poproś o wgląd w akta księgi. Dowiesz się, jaki wniosek wpłynął.
   <br><br><b>Uwaga:</b> notariusz i tak to sprawdzi przed aktem. Lepiej, żebyś wiedział wcześniej niż w kancelarii.`},

 {id:'kw_powierzchnia', src:'wlasne', mode:'man', q:'Czy powierzchnia w dziale I-O zgadza się z ewidencją?',
  why:'Rozbieżność oznacza, że któryś rejestr jest nieaktualny — albo doszło do podziału, którego nie ujawniono.',
  type:'yn', opts:YN,
  flag:v=>v==='nie'?Y('Rozbieżność powierzchni KW vs EGiB','Zwykle wynika z nieujawnionego podziału albo ze starego pomiaru. Do wyjaśnienia przed aktem: wnioskuj o sprostowanie albo o aktualny wypis i wyrys z ewidencji. Notariusz może odmówić sporządzenia aktu przy dużej rozbieżności.',500,3000,'Niezgodność powierzchni między księgą wieczystą a ewidencją gruntów wymaga sprostowania.'):(v==='tak'?G('Powierzchnie zgodne',''):null),
  help:`Dział <b>I-O „Oznaczenie nieruchomości"</b>, pole <b>Obszar</b>. Porównaj z powierzchnią z ewidencji (widać ją w sekcji Start).
   <br><br>Drobne różnice rzędu kilku metrów przy dużych działkach są normalne. Różnica powyżej 5% to sygnał do wyjaśnienia.`},

 {id:'kw_isp', src:'wlasne', mode:'man', q:'Czy w dziale I-Sp wpisano służebność drogi (przechodu i przejazdu)?',
  why:'Jeśli działka nie graniczy z drogą publiczną, to jedyny wpis, który gwarantuje ci legalny dojazd.',
  type:'select', opts:[['jest','Jest wpisana służebność'],['niepotrzeba','Działka graniczy z drogą publiczną'],['brak','Brak wpisu, a dojazd przez cudzy grunt'],['?','Nie sprawdzone']],
  flag:v=>{
    if(v==='brak')return R('Brak prawnie zabezpieczonego dojazdu','Dojeżdżasz przez cudzą działkę bez wpisanej służebności. Sąsiad może w każdej chwili zamknąć przejazd, a ustanowienie służebności drogi koniecznej to postępowanie sądowe trwające nawet kilka lat, z wynagrodzeniem dla właściciela. Bez dostępu do drogi publicznej nie dostaniesz pozwolenia na budowę ani rozbudowę.',15000,60000,'Brak prawnie zabezpieczonego dostępu do drogi publicznej — konieczne postępowanie o ustanowienie służebności.');
    if(v==='jest')return G('Służebność drogi wpisana','Dojazd zabezpieczony wpisem w księdze. Sprawdź jeszcze jej treść: czy obejmuje przejazd, czy tylko przechód.');
    if(v==='niepotrzeba')return G('Bezpośredni dostęp do drogi publicznej','Sytuacja najlepsza z możliwych.');
    return null;},
  help:`Dział <b>I-Sp „Spis praw związanych z własnością"</b>. Szukasz frazy: <i>„służebność gruntowa polegająca na prawie przechodu i przejazdu przez działkę nr…"</i>.
   <br><br><b>Uwaga na pułapkę:</b> „prawo przechodu" bez „przejazdu" oznacza, że możesz przejść pieszo, ale nie masz prawa wjechać samochodem. Przeczytaj dokładną treść wpisu, nie sam nagłówek.
   <br><br><b>Druga pułapka:</b> umowa użyczenia albo ustna zgoda sąsiada nie jest służebnością. Wiąże tylko obecnego właściciela i wygasa przy sprzedaży jego działki.`},

 {id:'kw_przesyl', src:'wlasne', mode:'man', q:'Czy w dziale III wpisano służebność przesyłu?',
  why:'Rura albo linia przez działkę tworzy strefę, w której nie wolno budować.',
  type:'yn', opts:YN,
  flag:v=>v==='tak'?Y('Służebność przesyłu','Przez działkę biegnie infrastruktura (gaz, prąd, woda, kanalizacja, ciepłownictwo). Wokół niej obowiązuje strefa kontrolowana z zakazem zabudowy i nasadzeń. Ustal na mapie, którędy dokładnie przebiega i ile użytecznej powierzchni realnie ci zostaje. Gestor sieci ma prawo wejść na teren w celu konserwacji.',0,0,'Służebność przesyłu ogranicza użyteczną powierzchnię działki i możliwości zabudowy.'):(v==='nie'?G('Brak służebności przesyłu',''):null),
  help:`Dział <b>III „Prawa, roszczenia i ograniczenia"</b>. Wpis brzmi zwykle: <i>„służebność przesyłu na rzecz [nazwa spółki]"</i>.
   <br><br><b>Kluczowe pytanie nie brzmi „czy jest", tylko „którędy biegnie".</b> Służebność wzdłuż granicy jest do przyjęcia.
   Ta sama służebność przez środek działki może wyciąć ci najlepsze miejsce pod rozbudowę czy garaż.
   <br><br>Poproś sprzedającego o mapę zasadniczą z naniesionym uzbrojeniem albo zamów ją w powiatowym ośrodku dokumentacji geodezyjnej.`},

 {id:'kw_dozywocie', src:'wlasne', mode:'man', q:'Czy w dziale III jest służebność osobista, dożywocie lub prawo zamieszkiwania?',
  why:'To najgorsze obciążenie przy kupnie domu. Kupujesz nieruchomość z lokatorem, którego nie usuniesz.',
  type:'yn', opts:YN,
  flag:v=>v==='tak'?R('Służebność osobista / dożywocie','Uprawniony ma prawo mieszkać w budynku dożywotnio i to prawo wiąże także ciebie jako nowego właściciela. Eksmisja jest praktycznie niemożliwa. Wykreślenie wymaga zgody uprawnionego, zwykle za wynagrodzeniem, albo jego śmierci. Nie kupuj, dopóki wpis nie zostanie wykreślony przed aktem albo w akcie.',0,0,'Nieruchomość obciążona prawem dożywotniego zamieszkiwania osoby trzeciej.'):(v==='nie'?G('Brak obciążeń osobistych',''):null),
  help:`Szukaj w dziale III fraz: <i>„służebność osobista mieszkania"</i>, <i>„dożywocie"</i>, <i>„prawo dożywotniego i bezpłatnego użytkowania"</i>.
   <br><br><b>Jak to rozwiązać, jeśli chcesz kupić mimo wszystko:</b> uprawniony musi stawić się u notariusza i zrzec się prawa.
   Ustal to na etapie umowy przedwstępnej jako warunek zawieszający, nigdy „załatwimy po akcie".`},

 {id:'kw_inne3', src:'wlasne', mode:'man', q:'Czy w dziale III są inne wpisy (roszczenia, zajęcie, zakaz zbywania, prawo pierwokupu)?',
  why:'Zajęcie komornicze albo roszczenie o przeniesienie własności potrafi zablokować transakcję.',
  type:'yn', opts:YN,
  flag:v=>v==='tak'?R('Inne obciążenia w dziale III','Roszczenie osoby trzeciej, zajęcie w egzekucji, ostrzeżenie o niezgodności stanu prawnego albo umowne prawo pierwokupu. Każde z nich wymaga osobnej analizy prawnej przed transakcją. Skonsultuj z prawnikiem, nie z pośrednikiem.',0,0,'Obciążenia w dziale III wymagające wyjaśnienia prawnego.'):(v==='nie'?G('Dział III czysty',''):null),
  help:`Częste wpisy warte uwagi:
   <ul><li><b>Roszczenie o przeniesienie własności</b> — ktoś ma umowę przedwstępną na tę nieruchomość.</li>
   <li><b>Ostrzeżenie o niezgodności</b> — księga nie odzwierciedla rzeczywistego stanu prawnego.</li>
   <li><b>Zajęcie w postępowaniu egzekucyjnym</b> — komornik. Sprzedaż wymaga jego zgody albo spłaty.</li>
   <li><b>Prawo pierwokupu</b> — gmina, KOWR albo osoba prywatna ma pierwszeństwo zakupu.</li></ul>`},

 {id:'kw_zameldowani', src:'wlasne', mode:'man', q:'Czy ktoś jest zameldowany w nieruchomości?',
  why:'Meldunek nie daje prawa do lokalu, ale wymeldowanie opornej osoby to postępowanie administracyjne.',
  type:'select', opts:[['nikt','Nikt'],['sprzedajacy','Sprzedający i rodzina'],['obce','Osoby trzecie'],['?','Nie pytano']],
  flag:v=>{
    if(v==='obce')return R('Zameldowane osoby trzecie','Meldunek sam w sobie nie daje prawa do lokalu, ale wymeldowanie osoby, która nie chce się wymeldować, wymaga postępowania administracyjnego i trwa. Gorzej, jeśli osoba faktycznie tam mieszka — wtedy dochodzi kwestia eksmisji i prawa do lokalu socjalnego. Żądaj wymeldowania wszystkich przed aktem.',0,0,'Osoby trzecie zameldowane w nieruchomości.');
    if(v==='sprzedajacy')return Y('Zameldowany sprzedający','Standard. Wpisz do umowy termin wymeldowania i karę umowną za zwłokę.',0,0,null);
    if(v==='nikt')return G('Nikt nie jest zameldowany','');
    return null;},
  help:`<b>Zapytaj wprost</b> i poproś o zaświadczenie z urzędu gminy o osobach zameldowanych — sprzedający może je uzyskać dla swojej nieruchomości.
   <br><br><b>W umowie przedwstępnej zapisz:</b> zobowiązanie do wymeldowania wszystkich osób do dnia wydania nieruchomości,
   wydanie wolnej od osób i rzeczy oraz karę umowną za każdy dzień zwłoki.
   <br><br><b>Sprawdź też, czy ktoś faktycznie mieszka</b> — to ważniejsze niż meldunek.`},

 {id:'kw_hipoteka', src:'wlasne', mode:'man', q:'Czy w dziale IV wpisana jest hipoteka?',
  why:'Hipoteka nie znika ze sprzedażą. Przechodzi na nieruchomość, nie na dłużnika.',
  type:'yn', opts:YN,
  flag:v=>v==='tak'?Y('Hipoteka w dziale IV','Sama w sobie nie blokuje transakcji — to standard przy kredytowanych domach. Wymaga jednak prawidłowej procedury: przed aktem sprzedający musi przedstawić zaświadczenie z banku o aktualnym saldzie i promesę wykreślenia. W akcie zapisujecie spłatę bezpośrednią: część ceny idzie prosto na rachunek techniczny banku, reszta do sprzedającego. Nigdy nie płać całości sprzedającemu licząc, że sam spłaci kredyt.',0,0,null):(v==='nie'?G('Brak hipoteki','Dział IV wolny od wpisów.'):null),
  help:`<b>Procedura bezpiecznej transakcji z hipoteką:</b>
   <ol><li>Sprzedający występuje do banku o <b>zaświadczenie o wysokości zadłużenia</b> i <b>promesę zwolnienia hipoteki</b> (ważne zwykle 30 dni).</li>
   <li>W akcie notarialnym zapisujecie podział ceny: kwota spłaty na rachunek techniczny banku, reszta na konto sprzedającego.</li>
   <li>Po spłacie bank wydaje <b>kwit mazalny</b> (zgodę na wykreślenie).</li>
   <li>Składasz wniosek o wykreślenie hipoteki do sądu wieczystoksięgowego.</li></ol>
   <b>Sprawdź też kwotę:</b> jeśli hipoteka przewyższa cenę sprzedaży, transakcja się nie domknie bez dopłaty sprzedającego.`},

 {id:'kw_forma', src:'wlasne', mode:'man', q:'Co dokładnie jest przedmiotem sprzedaży?',
  why:'Dom w zabudowie bliźniaczej albo z dwoma mieszkaniami to zwykle lokal z udziałem w gruncie, a nie cała nieruchomość.',
  type:'select', opts:[['calosc','Cała nieruchomość gruntowa z budynkiem'],['lokal','Wyodrębniony lokal z udziałem w gruncie'],
    ['udzial','Udział we współwłasności'],['wieczyste','Użytkowanie wieczyste gruntu'],['?','Nie sprawdzone']],
  flag:v=>{
    if(v==='lokal')return Y('Odrębna własność lokalu z udziałem w nieruchomości wspólnej','Nie kupujesz działki, tylko lokal i ułamkowy udział w gruncie oraz częściach wspólnych budynku. Przy dwóch lokalach powstaje mała wspólnota zarządzana według przepisów o współwłasności: czynności przekraczające zwykły zarząd, czyli docieplenie, wymiana dachu, przebudowa czy zabudowa działki, wymagają zgody drugiego właściciela. Bez tej zgody zostaje wniosek do sądu. Sprawdź też, czy istnieje umowa o podziale do korzystania i czy jest ujawniona w księdze.',0,0,'Przedmiotem nabycia jest lokal z udziałem w nieruchomości wspólnej — ograniczona swoboda dysponowania budynkiem i działką.');
    if(v==='udzial')return R('Sprzedaż udziału we współwłasności','Kupujesz ułamek, nie konkretną część nieruchomości. Bez umowy o podziale do korzystania każdy współwłaściciel ma prawo do całości. Wyjście ze współwłasności wymaga zgody pozostałych albo postępowania sądowego o zniesienie współwłasności, które trwa i kosztuje. Banki niechętnie kredytują takie transakcje.',0,0,'Nabycie udziału we współwłasności bez wydzielonej części do wyłącznego korzystania.');
    if(v==='wieczyste')return Y('Użytkowanie wieczyste gruntu','Grunt pozostaje własnością Skarbu Państwa albo gminy, a ty masz prawo terminowe z opłatą roczną. Sprawdź datę wygaśnięcia, wysokość opłaty i cel określony w umowie. Sprawdź też, czy przysługuje ci prawo przekształcenia we własność.',0,0,'Grunt w użytkowaniu wieczystym — opłaty roczne i termin wygaśnięcia prawa.');
    if(v==='calosc')return G('Pełna własność nieruchomości gruntowej','Najprostsza i najbardziej swobodna forma.');
    return null;},
  help:`<b>Gdzie to zobaczysz:</b> w <b>dziale I-O</b> księgi. Jeśli w rubryce rodzaj nieruchomości widnieje
   <i>„lokal stanowiący odrębną nieruchomość"</i>, kupujesz lokal, nie działkę. Księga lokalu odsyła wtedy do
   <b>księgi nieruchomości wspólnej</b> — przeczytaj obie.
   <br><br><b>Sygnały, że tak może być, nawet jeśli oferta mówi „dom":</b> budynek z dwoma wejściami, dwa liczniki,
   zabudowa bliźniacza, dom po podziale między rodzeństwo, mieszkanie na piętrze i na parterze.
   <br><br><b>O co zapytać przy takiej formie:</b>
   <ul><li>Jaka jest wielkość twojego udziału w nieruchomości wspólnej.</li>
   <li>Czy jest <b>umowa o podziale do korzystania</b> (quoad usum) i czy ujawniono ją w księdze.</li>
   <li>Jak dotąd dzielono koszty remontów części wspólnych i czy są zaległości.</li>
   <li>Jak układa się współpraca z drugim właścicielem — przy małej wspólnocie to ważniejsze niż większość zapisów.</li></ul>`},

 {id:'kw_quoad', src:'wlasne', mode:'man', q:'Czy jest umowa o podziale nieruchomości do korzystania (quoad usum)?',
  why:'Bez niej każdy współwłaściciel ma formalnie prawo do całej działki, także do twojego ogrodu.',
  type:'select', opts:[['wpisana','Jest i ujawniona w księdze'],['ustna','Jest, ale nieformalna'],
    ['brak','Nie ma'],['nd','Nie dotyczy — pełna własność']],
  flag:v=>{
    if(v==='brak')return Y('Brak podziału do korzystania','Formalnie każdy współwłaściciel może korzystać z całej nieruchomości, w granicach nienaruszających praw pozostałych. W praktyce zwykle panuje ustalony porządek, ale przy konflikcie albo zmianie właściciela obok nie masz się na co powołać. Warto zawrzeć taką umowę i ujawnić ją w księdze — wtedy wiąże także kolejnych nabywców.',1000,5000,'Brak umowy o podziale nieruchomości do korzystania.');
    if(v==='ustna')return Y('Nieformalny podział do korzystania','Ustalenia między obecnymi właścicielami nie wiążą kolejnego nabywcy sąsiedniego lokalu. Rozważ sformalizowanie u notariusza i wpis do księgi.',1000,4000,null);
    if(v==='wpisana')return G('Podział do korzystania ujawniony w księdze','Wiąże także przyszłych nabywców. Sytuacja uporządkowana.');
    if(v==='nd')return G('Pełna własność','Podział do korzystania nie ma zastosowania.');
    return null;},
  help:`<b>Czym to jest:</b> umowa między współwłaścicielami określająca, kto z której części nieruchomości korzysta
   na wyłączność — który ogród, które miejsce postojowe, który fragment strychu czy piwnicy.
   <br><br><b>Dlaczego wpis do księgi ma znaczenie:</b> umowa ujawniona w księdze wiąże również kolejnych nabywców.
   Bez wpisu obowiązuje tylko strony, które ją zawarły.
   <br><br><b>Gdzie szukać:</b> dział I-Sp albo III księgi nieruchomości wspólnej.`},

 {id:'kw_wlasciciel', src:'wlasne', mode:'man', q:'Czy właściciel z działu II zgadza się z osobą, która sprzedaje?',
  why:'Podstawowa weryfikacja, którą łatwo pominąć przy sympatycznym sprzedającym.',
  type:'select', opts:[['zgadza','Zgadza się w pełni'],['wspol','Współwłasność — kilka osób'],['spadek','Spadkobiercy / nieuregulowane'],['pelnomocnik','Sprzedaje pełnomocnik'],['?','Nie sprawdzone']],
  flag:v=>{
    if(v==='spadek')return R('Nieuregulowany stan spadkowy','Dopóki nie ma prawomocnego postanowienia o stwierdzeniu nabycia spadku albo aktu poświadczenia dziedziczenia oraz ujawnienia spadkobierców w księdze, nie ma kogo kupić. Dodatkowo potrzebne będzie zaświadczenie z urzędu skarbowego o uregulowaniu podatku od spadku.',0,0,'Nieuregulowany stan prawny po spadkobiercach.');
    if(v==='wspol')return Y('Współwłasność','Do sprzedaży całości potrzebna zgoda i obecność wszystkich współwłaścicieli u notariusza. Uważaj zwłaszcza na małżeństwa: przy wspólności majątkowej wymagana jest zgoda obojga, nawet gdy w księdze wpisana jest jedna osoba.',0,0,null);
    if(v==='pelnomocnik')return Y('Sprzedaż przez pełnomocnika','Sprawdź pełnomocnictwo: musi być w formie aktu notarialnego, obejmować wprost zbycie tej nieruchomości i być aktualne. Zweryfikuj, czy mocodawca żyje — pełnomocnictwo wygasa z chwilą śmierci.',0,0,null);
    if(v==='zgadza')return G('Właściciel zweryfikowany','');
    return null;},
  help:`Dział <b>II „Własność"</b>. Porównaj imię, nazwisko i PESEL z dowodem osobistym sprzedającego.
   <br><br><b>Sprawdź też podstawę nabycia</b> (widoczna w dziale II): jeśli sprzedający nabył nieruchomość
   <b>w drodze darowizny lub spadku w ciągu ostatnich 5 lat</b>, zapytaj o zaświadczenie z urzędu skarbowego
   o uregulowaniu podatku. Bez niego notariusz nie sporządzi aktu.`}
]},

/* ---------------- M3 PLAN I ZABUDOWA ---------------- */
{id:'m3', name:'Plan', icon:'3', title:'Plan miejscowy, WZ i możliwości zabudowy',
 lead:'Stan prawny mocno się zmienił w 2026 roku. Jeśli planujesz rozbudowę, przeczytaj to uważnie.',
 checks:[

 {id:'p_alert', src:'wlasne', mode:'info', type:'info', q:'Co się zmieniło w 2026 roku — przeczytaj to najpierw',
  help:`<b>Trzy daty, które musisz znać:</b>
   <ul><li><b>31 sierpnia 2026</b> — ostateczny termin uchwalenia planów ogólnych przez gminy (przesunięty nowelizacją
     z 30 kwietnia 2026 z pierwotnego 30 czerwca). Do tego dnia obowiązują stare studia uwarunkowań.</li>
   <li><b>1 września 2026</b> — od tego dnia decyzja WZ musi być zgodna z planem ogólnym i może być wydana wyłącznie
     w <b>obszarze uzupełnienia zabudowy</b>. Wniosek złożony do 31 sierpnia jest rozpatrywany na starych zasadach
     (liczy się data wpływu do urzędu).</li>
   <li><b>1 stycznia 2027</b> — planowany koniec wnioskowania o WZ bez tytułu prawnego. Według projektu przyjętego przez
     Radę Ministrów 14 kwietnia 2026 wniosek złoży wyłącznie osoba z prawem do dysponowania nieruchomością na cele budowlane,
     składając oświadczenie pod rygorem odpowiedzialności karnej. Wnioski złożone do końca 2026 mają być rozpatrywane
     na dotychczasowych zasadach. <b>To projekt, nie obowiązujące jeszcze prawo</b> — sprawdź etap procesu legislacyjnego
     przed decyzją.</li></ul>
   <b>Co to znaczy praktycznie:</b> jeśli kupujesz dom i planujesz rozbudowę albo drugi budynek, a działka nie ma MPZP,
   złóż wniosek o WZ jak najszybciej. Po 1 stycznia 2027 nie zrobisz tego przed zakupem w ogóle.
   <br><br><b>Ważność decyzji WZ:</b> te, które stały się prawomocne do 31 grudnia 2025, są bezterminowe.
   Wydane od 1 stycznia 2026 tracą ważność po 5 latach od uprawomocnienia.`},

 {id:'p_mpzp', src:'raport', mode:'semi', q:'Czy działka jest objęta miejscowym planem zagospodarowania (MPZP)?',
  why:'Plan miejscowy jest prawem miejscowym. Rozstrzyga, co i jak możesz budować, bez uznaniowości urzędnika.',
  type:'select', opts:[['tak','Tak, jest MPZP'],['nie','Nie ma planu'],['?','Nie sprawdzone']],
  task:`Ustal, czy działka jest objęta miejscowym planem zagospodarowania przestrzennego.
1. Wyszukaj portal mapowy gminy: w Google wpisz "[nazwa gminy] mpzp mapa" albo "[nazwa gminy] geoportal plan miejscowy".
2. Znajdź działkę i sprawdź, czy leży w granicach uchwalonego planu.
3. Jeśli portalu gminnego nie ma, sprawdź w geoportalu krajowym warstwę planów miejscowych oraz w BIP gminy zakładkę planowanie przestrzenne.
4. Zanotuj numer i datę uchwały, jeśli są podane.`,
  manual:`<b>Telefon do wydziału architektury albo planowania przestrzennego urzędu gminy.</b> Podajesz numer działki i pytasz wprost, czy jest objęta planem miejscowym. To pytanie, na które odpowiadają w minutę.
   <br><br><b>Wypis i wyrys z planu miejscowego</b> — dokument urzędowy, kilkadziesiąt złotych, kilka do kilkunastu dni. Wniosek w urzędzie gminy, osobiście, pocztą albo przez ePUAP. Warto go zamówić, gdy transakcja robi się poważna, bo podgląd na mapie nie ma mocy dowodowej.
   <br><br><b>Zaświadczenie o przeznaczeniu w planie</b> to inny, tańszy dokument, wystarczający, gdy chcesz tylko potwierdzić przeznaczenie.`,
  flag:v=>v==='nie'?Y('Brak planu miejscowego','Wszystko zależy od decyzji o warunkach zabudowy, a te po 1 września 2026 wymagają planu ogólnego gminy i położenia w obszarze uzupełnienia zabudowy. Jeśli gmina nie uchwali planu ogólnego w terminie, wydawanie nowych WZ się zablokuje.',0,0,'Brak planu miejscowego — możliwości zabudowy zależne od uznaniowej decyzji WZ i stanu prac gminy nad planem ogólnym.'):(v==='tak'?G('Działka objęta MPZP','Najbardziej przewidywalna sytuacja.'):null),
  help:`<b>Gdzie sprawdzić:</b>
   <ol><li>Portal mapowy gminy (najszybciej: wyszukaj „<i>[nazwa gminy] mpzp mapa</i>").</li>
   <li>Geoportal Krajowy — warstwa planów miejscowych.</li>
   <li>BIP gminy → planowanie przestrzenne → uchwały.</li>
   <li>Telefonicznie: wydział architektury urzędu gminy. Podaj numer działki, powiedzą w minutę.</li></ol>
   <b>Zamów wypis i wyrys z MPZP</b> jeśli transakcja robi się poważna. To dokument urzędowy, w przeciwieństwie do podglądu na mapie.`},

 {id:'p_przezn', src:'raport', mode:'semi', q:'Jakie przeznaczenie ma działka w planie?',
  type:'select', opts:[['MN','MN — zabudowa mieszkaniowa jednorodzinna'],['MNU','MN/U — mieszkaniowo-usługowa'],['MW','MW — wielorodzinna'],['RM','RM — zabudowa zagrodowa'],['R','R — tereny rolne'],['ZL','ZL — lasy'],['inne','Inne / mieszane'],['nd','Nie dotyczy — brak MPZP']],
  task:`Ustal symbol przeznaczenia terenu dla tej działki w planie miejscowym (np. MN, MN/U, RM, R, ZL).
1. Otwórz portal mapowy gminy (wyszukaj "[nazwa gminy] mpzp mapa").
2. Znajdź działkę i odczytaj symbol jednostki planistycznej z rysunku planu.
3. Jeśli portal udostępnia tekst uchwały, otwórz go i znajdź rozdział dotyczący tego symbolu.
4. W notatce podaj pełny symbol razem z numerem, na przykład 12MN, oraz numer uchwały.`,
  manual:`<b>Wypis i wyrys z MPZP</b> w urzędzie gminy — zawiera i rysunek, i pełny tekst ustaleń dla twojego terenu.
   <br><br><b>Telefonicznie:</b> wydział architektury poda symbol od ręki, ale treść zapisów i tak musisz przeczytać sam. Poproś o link do uchwały w BIP albo o numer, po którym ją znajdziesz.`,
  flag:v=>{
    if(v==='R'||v==='ZL')return R('Przeznaczenie wyklucza zabudowę mieszkaniową','Plan przeznacza teren na cele rolne lub leśne. Jeśli stoi tam dom, sprawdź pilnie jego legalność — może pochodzić sprzed uchwalenia planu (wtedy jest legalny, ale rozbudowa będzie zablokowana) albo być samowolą.',0,0,'Przeznaczenie w planie miejscowym wyklucza zabudowę mieszkaniową i uniemożliwia rozbudowę.');
    if(v==='MN')return G('MN — zabudowa jednorodzinna','Docelowe przeznaczenie dla domu jednorodzinnego.');
    if(v==='MNU')return G('MN/U — mieszkaniowo-usługowa','Dobra elastyczność. Pamiętaj jednak, że sąsiad też może otworzyć usługi.');
    if(v==='RM')return Y('RM — zabudowa zagrodowa','Zabudowa zagrodowa bywa zarezerwowana dla osób prowadzących gospodarstwo rolne. Sprawdź w treści uchwały, czy plan dopuszcza też zwykłą zabudowę mieszkaniową.',0,0,null);
    if(v==='MW')return Y('MW — zabudowa wielorodzinna','Możesz mieć dom jednorodzinny w otoczeniu bloków. Sprawdź, co jeszcze może powstać obok.',0,0,null);
    return null;},
  help:`Symbol znajdziesz na rysunku planu. Legenda jest w uchwale:
   <br><br><span class="mono">MN</span> jednorodzinna &middot; <span class="mono">MW</span> wielorodzinna &middot; <span class="mono">U</span> usługi &middot;
   <span class="mono">UC</span> wielkopowierzchniowy handel &middot; <span class="mono">P</span> przemysł &middot; <span class="mono">RM</span> zagrodowa &middot;
   <span class="mono">R</span> rolne &middot; <span class="mono">ZL</span> lasy &middot; <span class="mono">ZP</span> zieleń urządzona &middot; <span class="mono">KD</span> drogi
   <br><br><b>Zawsze czytaj treść uchwały, nie tylko rysunek.</b> Tam są zapisy o wysokości, kącie dachu, kolorystyce
   i minimalnej powierzchni działki, które potrafią zablokować twoje plany.`},

 {id:'p_planogolny', src:'raport', mode:'semi', q:'Czy gmina uchwaliła plan ogólny?',
  why:'Po 31 sierpnia 2026 gmina bez planu ogólnego nie wyda nowej decyzji WZ.',
  type:'select', opts:[['uchwalony','Tak, uchwalony'],['projekt','W trakcie — jest projekt'],['brak','Nie ma i nie widać projektu'],['nd','Nie dotyczy — jest MPZP'],['?','Nie sprawdzone']],
  task:`Ustal, na jakim etapie jest plan ogólny gminy. To istotne, bo od 1 września 2026 decyzja o warunkach zabudowy może być wydana tylko w zgodzie z planem ogólnym i w obszarze uzupełnienia zabudowy.
1. Sprawdź BIP gminy: wyszukaj "BIP [nazwa gminy] plan ogólny" i poszukaj uchwały albo informacji o wyłożeniu projektu.
2. Sprawdź Geoportal Krajowy — ma warstwę monitoringu prac nad planami ogólnymi.
3. Jeśli plan jest uchwalony albo jest projekt, sprawdź, czy działka leży w obszarze uzupełnienia zabudowy.
4. Podaj datę uchwały albo etap procedury.`,
  manual:`<b>Telefon do wydziału planowania przestrzennego gminy.</b> Zadaj dwa pytania wprost: czy gmina uchwaliła plan ogólny i czy działka [numer] leży w obszarze uzupełnienia zabudowy. Drugie pytanie jest ważniejsze od pierwszego.
   <br><br><b>Termin ustawowy dla gmin to 31 sierpnia 2026.</b> Jeśli gmina nie zdąży, po tej dacie nie wyda nowych decyzji WZ do czasu uchwalenia planu.
   <br><br><b>W BIP gminy</b> szukaj obwieszczeń o wyłożeniu projektu planu ogólnego do publicznego wglądu — to etap poprzedzający uchwalenie.`,
  flag:v=>{
    if(v==='brak')return R('Gmina bez planu ogólnego przy zbliżającym się terminie','Termin uchwalenia mija 31 sierpnia 2026. Jeśli gmina nie zdąży, po tej dacie nie wyda nowych decyzji WZ, dopóki planu nie uchwali. Dla działki bez MPZP oznacza to zamrożenie możliwości inwestycyjnych na nieokreślony czas.',0,0,'Gmina nie uchwaliła planu ogólnego — ryzyko zablokowania wydawania decyzji WZ.');
    if(v==='projekt')return Y('Plan ogólny w przygotowaniu','Sprawdź w projekcie, czy twoja działka trafia do <b>obszaru uzupełnienia zabudowy</b>. Jeśli nie, po wejściu planu w życie nie uzyskasz tam WZ. To informacja, której sprzedający raczej ci nie poda.',0,0,'Trwają prace nad planem ogólnym — przeznaczenie działki może się zmienić.');
    if(v==='uchwalony')return G('Plan ogólny uchwalony','Sprawdź jeszcze, w jakiej strefie planistycznej znalazła się działka.');
    if(v==='nd')return G('Jest MPZP','Plan miejscowy ma pierwszeństwo.');
    return null;},
  help:`<b>Gdzie sprawdzić postęp prac:</b> Geoportal Krajowy ma warstwę monitoringu prac nad planami ogólnymi.
   Można też zadzwonić do wydziału planowania gminy i zapytać wprost.
   <br><br><b>Dlaczego to teraz kluczowe:</b> obszar uzupełnienia zabudowy (OUZ) to jedyne miejsce, gdzie po 1 września 2026
   można wydać WZ poza planem miejscowym.`},

 {id:'p_wz', src:'wlasne', mode:'man', q:'Czy dla nieruchomości wydano decyzję o warunkach zabudowy?',
  type:'select', opts:[['przed2026','Prawomocna do 31.12.2025 — bezterminowa'],['wniosek2025','Wniosek przed 16.10.2025 — bezterminowa'],['po2026','Wniosek po 16.10.2025 — ważna 5 lat'],['brak','Nie ma decyzji WZ'],['nd','Nie dotyczy — jest MPZP']],
  flag:v=>{
    if(v==='przed2026')return G('Decyzja WZ bezterminowa','Decyzje prawomocne do końca 2025 roku nie wygasają. To realna wartość dodana nieruchomości.');
    if(v==='wniosek2025')return G('Decyzja WZ bezterminowa (liczy się data wniosku)','Druga przesłanka bezterminowości: wniosek złożony przed 16 października 2025 daje decyzję bez terminu ważności, nawet jeśli urząd wydał ją później, już w 2026 roku. Sprawdź datę wpływu wniosku, nie tylko datę decyzji.');
    if(v==='po2026')return Y('Decyzja WZ ważna 5 lat','Policz, ile czasu zostało od uprawomocnienia. Jeśli mniej niż 2 lata, a nie zaczniesz budowy szybko, decyzja przepadnie.',0,0,null);
    if(v==='brak')return Y('Brak decyzji WZ','Jeśli planujesz rozbudowę lub dodatkowy budynek, a nie ma MPZP, złóż wniosek jak najszybciej — zasady się zaostrzają.',0,0,null);
    return null;},
  help:`<b>Jak sprawdzić:</b> poproś sprzedającego o kopię decyzji. Jeśli twierdzi, że jej nie ma, możesz zapytać
   w wydziale architektury urzędu gminy o decyzje wydane dla tej działki.
   <br><br><b>Dwie przesłanki bezterminowości — wystarczy jedna:</b>
   <ul><li>decyzja stała się <b>prawomocna do 31 grudnia 2025</b>, niezależnie od daty wniosku;</li>
   <li><b>wniosek wpłynął przed 16 października 2025</b>, nawet jeśli decyzję wydano później, w 2026 roku.</li></ul>
   W pozostałych przypadkach decyzja jest ważna 5 lat od uprawomocnienia.
   <br><br><b>Na decyzji sprawdź trzy rzeczy:</b>
   <ol><li><b>Datę uprawomocnienia</b> i <b>datę wpływu wniosku</b> — to różne daty i każda może dać bezterminowość.</li>
   <li><b>Czy jest przenoszalna</b> — WZ można przenieść na nabywcę decyzją organu, za zgodą stron.</li>
   <li><b>Parametry</b> — powierzchnia zabudowy, wysokość, kąt dachu, linia zabudowy.</li></ol>
   <b>Uwaga:</b> WZ to nie pozwolenie na budowę. To dopiero pierwszy krok.`},

 {id:'p_linia', src:'wlasne', mode:'man', q:'Jaka linia zabudowy obowiązuje na działce?',
  why:'Różnica między nieprzekraczalną a obowiązującą decyduje, czy możesz cofnąć dom od ulicy.',
  type:'select', opts:[['nieprzekr','Nieprzekraczalna'],['obow','Obowiązująca'],['brak','Brak / nie dotyczy'],['?','Nie sprawdzone']],
  flag:v=>{
    if(v==='obow')return Y('Obowiązująca linia zabudowy','Ściana frontowa musi stanąć dokładnie na tej linii, bez możliwości przesunięcia. Jeśli linia biegnie kilka metrów od ruchliwej drogi, nie odsuniesz domu od hałasu. Przy rozbudowie sprawdź, czy nowa część też się w niej zmieści.',0,0,'Obowiązująca linia zabudowy ogranicza swobodę rozmieszczenia budynków na działce.');
    if(v==='nieprzekr')return G('Nieprzekraczalna linia zabudowy','Wariant elastyczny — możesz cofnąć budynek w głąb działki.');
    if(v==='brak')return G('Brak linii zabudowy','Bez tego ograniczenia.');
    return null;},
  help:`<b>Gdzie:</b> na rysunku planu miejscowego (linie z trójkącikami albo kreskowane) oraz w treści uchwały,
   która precyzuje typ linii i odległość. W decyzji WZ szukaj punktu o linii zabudowy.
   <br><br><b>Dwa typy, różnica jest zasadnicza:</b>
   <ul><li><b>Nieprzekraczalna</b> — nie wolno wyjść przed nią, ale można się cofnąć. Dobrze.</li>
   <li><b>Obowiązująca</b> — ściana frontowa musi stanąć dokładnie na niej. Bez wyboru.</li></ul>`},

 {id:'p_arch', src:'wlasne', mode:'man', q:'Czy plan narzuca formę architektoniczną budynku?',
  why:'Kąt dachu, jego kształt i kolorystyka bywają zapisane sztywno. To wyklucza część projektów.',
  type:'select', opts:[['brak','Bez istotnych ograniczeń'],['sredni','Ograniczenia do przyjęcia'],['ostre','Sztywne wymagania'],['?','Nie sprawdzone']],
  flag:v=>{
    if(v==='ostre')return Y('Sztywne wymagania architektoniczne','Plany często narzucają kąt nachylenia dachu (typowo 35–45 stopni), dach wielospadowy, kolorystykę pokrycia, a czasem materiał elewacji. Jeśli marzysz o płaskim dachu albo nowoczesnej bryle, sprawdź to przed zakupem projektu — to jeden z najczęstszych sposobów na wyrzucenie pieniędzy.',0,0,'Ograniczenia architektoniczne w planie zawężają możliwe formy zabudowy.');
    if(v==='sredni')return Y('Umiarkowane ograniczenia','Do przyjęcia, ale przeczytaj dokładnie przed zamówieniem projektu.',0,0,null);
    if(v==='brak')return G('Bez istotnych ograniczeń formy','');
    return null;},
  help:`<b>Gdzie szukać w uchwale MPZP:</b> znajdź rozdział dotyczący symbolu twojego terenu (np. <span class="mono">1MN</span>)
   i paragraf o zasadach kształtowania zabudowy.
   <br><br><b>W decyzji WZ:</b> punkt o warunkach ochrony i kształtowania ładu przestrzennego.
   <br><br><b>Typowe zapisy, które zaskakują:</b> kąt dachu 35–45 stopni (wyklucza dach płaski), dach wielospadowy w formie koperty,
   ceglasta kolorystyka pokrycia, zakaz sidingu, maksymalna liczba kondygnacji.`},

 {id:'p_wskazniki', src:'wlasne', mode:'man', q:'Czy przeliczyłeś wskaźniki: powierzchnię zabudowy i biologicznie czynną?',
  why:'Na małej działce wysoki wymóg PBC potrafi wykluczyć garaż albo taras.',
  type:'select', opts:[['ok','Tak, mieszczę się z zapasem'],['ciasno','Tak, ale jest ciasno'],['nie','Nie liczyłem'],['nd','Nie planuję zmian']],
  flag:v=>{
    if(v==='ciasno')return Y('Wskaźniki zabudowy na granicy','Zanim zamówisz projekt rozbudowy, przelicz to dokładnie z architektem. Do powierzchni biologicznie czynnej nie wlicza się kostki brukowej ani tarasu na płycie — a to właśnie one zwykle przechylają szalę.',0,0,null);
    if(v==='nie')return Y('Wskaźniki nieprzeliczone','Bez tego nie wiesz, czy zmieścisz garaż, taras czy dobudówkę. To pięć minut z kalkulatorem.',0,0,null);
    if(v==='ok')return G('Wskaźniki z zapasem','');
    if(v==='nd')return G('Bez planów rozbudowy','Wskaźniki nie ograniczają cię przy samym zakupie.');
    return null;},
  help:`<b>Dwie liczby z uchwały MPZP</b> (rozdział o twoim symbolu terenu):
   <ul><li><b>Maksymalna powierzchnia zabudowy</b> — jaki procent działki mogą zajmować budynki.</li>
   <li><b>Minimalna powierzchnia biologicznie czynna (PBC)</b> — ile musi zostać zielone. Typowo 30–60%, ale bywa 70%.</li></ul>
   <b>Przykład:</b> działka 800 m², PBC 60% to 480 m² musi zostać zielone. Zostaje 320 m² na dom, garaż, podjazd i taras.
   Przy domu 140 m² zabudowy masz jeszcze 180 m², czyli niedużo.
   <br><br><b>Co się liczy do PBC:</b> trawnik, rabaty, grunt rodzimy z roślinnością. <b>Co się nie liczy:</b>
   kostka brukowa, beton, taras na płycie, podjazd.`},

 {id:'p_konserw', src:'raport', mode:'semi', q:'Czy teren objęty jest ochroną konserwatorską lub strefą archeologiczną?',
  type:'yn', opts:YN,
  task:`Sprawdź, czy nieruchomość jest objęta ochroną konserwatorską lub leży w strefie ochrony archeologicznej.
1. Sprawdź w planie miejscowym — strefy ochrony konserwatorskiej są oznaczone na rysunku planu i opisane w uchwale.
2. Sprawdź geoportal wojewódzkiego konserwatora zabytków (wyszukaj "[nazwa województwa] wojewódzki konserwator zabytków geoportal zabytki").
3. Sprawdź gminną ewidencję zabytków w BIP gminy.
4. Rozróżnij w notatce: wpis do rejestru zabytków, ujęcie w gminnej ewidencji, strefa ochrony konserwatorskiej, strefa archeologiczna. To cztery różne reżimy.`,
  manual:`<b>Wojewódzki Urząd Ochrony Zabytków</b> — zadzwoń do delegatury właściwej dla powiatu i zapytaj, czy budynek lub teren figuruje w rejestrze albo ewidencji zabytków. Wskaż adres i numer działki.
   <br><br><b>Zaświadczenie o objęciu ochroną</b> możesz uzyskać pisemnie, wnioskiem do wojewódzkiego konserwatora. Bywa potrzebne przy kredycie.
   <br><br><b>W urzędzie gminy</b> pytaj o gminną ewidencję zabytków — jest prowadzona lokalnie i nie zawsze widoczna w geoportalach.`,
  flag:v=>v==='tak'?Y('Ochrona konserwatorska lub archeologiczna','Każda zmiana wymaga uzgodnienia z wojewódzkim konserwatorem zabytków. Przy strefie archeologicznej trzeba prowadzić nadzór archeologiczny podczas prac ziemnych, na własny koszt. Konserwator może narzucić materiały, kolorystykę i formę dachu.',10000,80000,'Ochrona konserwatorska podnosi koszt i czas realizacji prac oraz ogranicza swobodę zagospodarowania.'):(v==='nie'?G('Bez ochrony konserwatorskiej',''):null),
  help:`Sprawdź w MPZP (strefy ochrony konserwatorskiej są tam oznaczone) albo w geoportalu wojewódzkiego konserwatora zabytków.
   <br><br>Rozróżnij: <b>wpis do rejestru zabytków</b> (najostrzejszy reżim, ale też dostęp do dotacji) od <b>gminnej ewidencji zabytków</b>
   (łagodniejszy) i od <b>strefy ochrony archeologicznej</b> (dotyczy prac ziemnych).`}
]},

/* ---------------- M4 BUDYNEK ---------------- */
