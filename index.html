function exportTxt(){
  const p=S.parcel||{};
  let t=APP.name+' v'+APP.ver+' — lista do sprawdzenia\n';
  t+=(S.meta.adres||'(bez adresu)')+'\n';
  if(p.id)t+='Dzialka: '+p.id+'\n';
  t+='Data: '+new Date().toLocaleDateString('pl-PL')+'\n';
  t+='\nJAK WYPELNIC: wstaw x miedzy nawiasy przy wybranej odpowiedzi, np. (x).\n';
  t+='Notatke dopisz po slowie "notatka:". Nie zmieniaj kodow w [nawiasach kwadratowych].\n';
  t+='Po powrocie wczytaj ten plik w aplikacji.\n';
  let last='';
  fieldChecks().forEach(c=>{
    if(c.mname!==last){t+='\n\n===== '+secName(c.mname).toUpperCase()+' =====\n';last=c.mname;}
    t+='\n['+c.id+'] '+c.q+'\n';
    if(c.why)t+='   ('+String(c.why).replace(/<[^>]+>/g,'')+')\n';
    if(c.opts)c.opts.forEach(o=>{
      if(o[0]==='?')return;
      t+='   ('+(S.a[c.id]===o[0]?'x':' ')+') '+o[0]+' = '+o[1]+'\n';});
    else t+='   odpowiedz: '+(S.a[c.id]||'')+'\n';
    t+='   notatka: '+(S.n[c.id]||'')+'\n';
  });
  dl(baseName()+'-do-sprawdzenia.txt',t);
}
function exportCsv(){
  const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  let rows=[['ID','Sekcja','Pytanie','Odpowiedz','Dozwolone wartosci','Notatka']];
  fieldChecks().forEach(c=>{
    const opts=c.opts?c.opts.filter(o=>o[0]!=='?').map(o=>o[0]+' = '+o[1]).join(' | '):'tekst';
    rows.push([c.id,secName(c.mname),c.q,S.a[c.id]||'',opts,S.n[c.id]||'']);
  });
  const csv='﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n');
  dl(baseName()+'-do-sprawdzenia.csv',csv,'text/csv;charset=utf-8');
}
function notionMd(){
  const p=S.parcel||{};
  const strip=s=>String(s==null?'':s).replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
  let t='_'+APP.name+' v'+APP.ver+'_\n\n> **Lista do sprawdzenia samodzielnie.** '+fieldChecks().length
    +' punktów, których nie znajdziesz w płatnym raporcie o terenie.\n\n';
  if(S.meta.adres)t+='**Nieruchomość:** '+S.meta.adres+(p.id?'  ·  działka `'+p.id+'`':'')+'\n\n';
  t+='**Kolejność jest ustawiona pod spotkanie:** najpierw to, co widzisz i o co pytasz na miejscu, na końcu dokumenty.\n\n'
    +'**Jak wypełniać:** zaznacz jedno pole wyboru przy każdym pytaniu i dopisz uwagi po słowie „notatka”. '
    +'Kodów w apostrofach nie zmieniaj — po nich aplikacja rozpozna odpowiedzi przy imporcie.\n\n---\n\n';
  let last='';
  fieldChecks().forEach(c=>{
    if(c.mname!==last){t+='## '+secName(c.mname)+'\n\n';last=c.mname;}
    t+='### '+c.q+'  `'+c.id+'`\n';
    if(c.why)t+='_'+strip(c.why)+'_\n';
    if(c.opts)c.opts.filter(o=>o[0]!=='?').forEach(o=>{
      t+='- ['+(S.a[c.id]===o[0]?'x':' ')+'] '+o[0]+' — '+o[1]+'\n';});
    else t+='- [ ] odpowiedz: '+(S.a[c.id]||'')+'\n';
    t+='> notatka: '+(S.n[c.id]||'')+'\n\n';
  });
  return t;
}
function exportNotion(){
  const t=notionMd();
  navigator.clipboard.writeText(t).then(
    ()=>alert('Skopiowano do schowka.\n\nW Notion otwórz kartę nieruchomości, utwórz nową podstronę i wklej (Cmd+V).'),
    ()=>{dl(baseName()+'-notion.md',t);alert('Schowek niedostępny — pobrałem plik .md.');});
}

/* ============================================================
   RAPORT
   ============================================================ */
function viewReport(){
  const f=flagsAll();
  const red=f.filter(x=>x.lv==='red'), yel=f.filter(x=>x.lv==='yellow'), grn=f.filter(x=>x.lv==='green');
  const cmin=f.reduce((s,x)=>s+(x.cmin||0),0), cmax=f.reduce((s,x)=>s+(x.cmax||0),0);
  const cena=+S.meta.cena||0;
  const p=S.parcel||{};
  const done=allChecks().filter(c=>c.type!=='info'&&S.a[c.id]!=null&&S.a[c.id]!==''&&S.a[c.id]!=='?').length;
  const tot=allChecks().filter(c=>c.type!=='info').length;
  const d=new Date().toLocaleDateString('pl-PL',{day:'numeric',month:'long',year:'numeric'});

  const R_ALL=allChecks().filter(c=>c.src==='raport'&&c.type!=='info');
  const W_ALL=allChecks().filter(c=>c.src==='wlasne'&&c.type!=='info');
  const filled=c=>S.a[c.id]!=null&&S.a[c.id]!==''&&S.a[c.id]!=='?';
  const rDone=R_ALL.filter(filled).length, wDone=W_ALL.filter(filled).length;
  const fR=f.filter(x=>{const c=allChecks().find(y=>y.id===x.cid);return c&&c.src==='raport';});
  const fW=f.filter(x=>{const c=allChecks().find(y=>y.id===x.cid);return !c||c.src==='wlasne';});
  const kosztR=fR.reduce((s,x)=>s+(x.cmin||0),0), kosztW=fW.reduce((s,x)=>s+(x.cmin||0),0);

  let verdict,vcls;
  if(red.length){verdict='WSTRZYMAJ SIĘ — wady wymagające wyjaśnienia przed umową';vcls='rr';}
  else if(yel.length>3){verdict='MOŻNA KUPIĆ — po wynegocjowaniu ceny';vcls='ry';}
  else if(done<tot*0.4){verdict='AUDYT NIEKOMPLETNY — uzupełnij brakujące punkty';vcls='ry';}
  else {verdict='BEZ POWAŻNYCH ZASTRZEŻEŃ';vcls='rg';}

  const rows=arr=>arr.map(x=>`<tr><td>${esc(x.mname)}</td><td><b>${esc(x.t)}</b><br><span style="color:#555;font-size:12px">${esc(String(x.w).replace(/<[^>]+>/g,'')).slice(0,300)}</span></td>
    <td style="white-space:nowrap">${x.cmax?(x.cmin?fmt(x.cmin)+'–'+fmt(x.cmax):'do '+fmt(x.cmax))+' zł':'—'}</td></tr>`).join('');

  const CAP=0.15;
  const bazaObnizki = cmin || Math.round(cmax*0.4);
  const limit = cena? Math.round(cena*CAP) : 0;
  const obnizka = cena? Math.min(bazaObnizki,limit) : bazaObnizki;
  const przekroczony = cena && bazaObnizki>limit;
  const propon = cena? Math.max(0,Math.round((cena-obnizka)/1000)*1000) : 0;

  const ranked=f.filter(x=>x.arg).sort((a,b)=>
    (b.lv==='red'?1e9:0)+(b.cmax||0) - ((a.lv==='red'?1e9:0)+(a.cmax||0)));
  const args=ranked.slice(0,5).map(x=>x.arg);
  const pozostale=ranked.length-args.length;

  const letter=`Szanowni Państwo,

dziękuję za możliwość obejrzenia nieruchomości${S.meta.adres?' przy '+S.meta.adres:''}${p.id?' (działka nr '+p.id+')':''}.

Jestem zainteresowany zakupem, natomiast przed złożeniem wiążącej oferty przeprowadziłem szczegółową analizę stanu prawnego i technicznego. Wykazała ona okoliczności, które wpływają na wartość nieruchomości i wiążą się z nakładami po mojej stronie:

${args.length?args.map((a,i)=>(i+1)+'. '+a).join('\n'):'(uzupełnij po wypełnieniu audytu)'}${pozostale>0?'\n\nPoza powyższymi zidentyfikowałem jeszcze '+pozostale+' drobniejszych kwestii, które chętnie omówię przy spotkaniu.':''}

Szacowany koszt usunięcia samych wad wskazanych powyżej to co najmniej ${fmt(obnizka)} zł.

${cena&&propon?`W związku z powyższym proponuję cenę ${fmt(propon)} zł zamiast ${fmt(cena)} zł.`:'W związku z powyższym proponuję odpowiednią korektę ceny.'}

Jestem gotów sfinalizować transakcję szybko i bez zbędnych formalności. Jeśli powyższa propozycja jest do rozważenia, proponuję zawarcie umowy przedwstępnej z warunkami dotyczącymi ${red.length?'wyjaśnienia wskazanych kwestii prawnych oraz ':''}stanu technicznego budynku.

Pozostaję do dyspozycji.

Z poważaniem`;

  $('#view').innerHTML=`
  <div class="row noprint" style="margin:13px 0">
    <button class="btn" onclick="window.print()">Drukuj / zapisz PDF</button>
    <button class="btn sec" onclick="copyLetter()">Kopiuj pismo</button>
    <button class="btn sec" onclick="saveFile()">Zapisz audyt</button>
  </div>
  <div class="card tight noprint">
    <h3 style="margin-top:0">Lista do sprawdzenia na miejscu</h3>
    <p class="lead" style="margin-bottom:9px">${fieldChecks().length} punktów, których nie znajdziesz w płatnym raporcie.</p>
    <div class="row">
      <button class="btn sm sec" onclick="exportTxt()">Notatka (.txt)</button>
      <button class="btn sm sec" onclick="exportCsv()">Arkusz (.csv)</button>
      <button class="btn sm sec" onclick="exportNotion()">Kopiuj dla Notion</button>
      <button class="btn sm" onclick="togglePaste(true)">Wklej wyniki</button>
    </div>
  </div>

  <div class="report">
    <h1>Karta audytu nieruchomości</h1>
    <div class="sub">${esc(APP.name)} v${esc(APP.ver)} &middot; ${esc(S.meta.adres||'—')}${p.id?' &middot; działka '+esc(p.id):''} &middot; ${d}</div>

    <h2>Werdykt</h2>
    <p style="font-size:16px"><span class="${vcls}">${verdict}</span></p>
    <table>
      <tr><th>Wady blokujące</th><th>Wady do negocjacji</th><th>Punkty bez zastrzeżeń</th><th>Kompletność</th></tr>
      <tr><td class="rr">${red.length}</td><td class="ry">${yel.length}</td><td class="rg">${grn.length}</td>
      <td>${done}/${tot} (${Math.round(done/tot*100)}%)</td></tr>
    </table>

    <h2>Podział pracy: raport a twoje oględziny</h2>
    <p style="font-size:12.5px;color:#555">Płatny raport o terenie (rzędu 100–300 zł) odczytuje dane z rejestrów i map.
    Nie ma dostępu do księgi wieczystej ani do wnętrza budynku — to musisz sprawdzić sam albo zlecić inspektorowi.</p>
    <table>
      <tr><th>Zakres</th><th>Punktów</th><th>Sprawdzone</th><th>Znalezione wady</th><th>Koszty</th></tr>
      <tr><td><b>Zwykle w płatnym raporcie</b><br><span style="color:#666;font-size:11.5px">grunt, plan miejscowy, media, drogi, zagrożenia środowiskowe, ceny transakcyjne</span></td>
        <td>${R_ALL.length}</td><td>${rDone}</td>
        <td>${fR.filter(x=>x.lv==='red').length} czerw. / ${fR.filter(x=>x.lv==='yellow').length} żółt.</td>
        <td>${kosztR?fmt(kosztR)+' zł':'—'}</td></tr>
      <tr><td><b>Tylko twoje: dokumenty i oględziny</b><br><span style="color:#666;font-size:11.5px">księga wieczysta, stan i legalność budynku, wnętrze, rozmowy</span></td>
        <td>${W_ALL.length}</td><td>${wDone}</td>
        <td>${fW.filter(x=>x.lv==='red').length} czerw. / ${fW.filter(x=>x.lv==='yellow').length} żółt.</td>
        <td>${kosztW?fmt(kosztW)+' zł':'—'}</td></tr>
    </table>
    ${kosztW>kosztR?`<blockquote style="font-size:12.5px"><b>Zwróć uwagę:</b> wady wykryte poza zakresem płatnego raportu
      (${fmt(kosztW)} zł) przewyższają te z zakresu raportowego (${fmt(kosztR)} zł). To typowe przy zakupie domu.</blockquote>`:''}

    ${cena&&!cmax?`<p style="margin-top:12px">Cena ofertowa: <b>${fmt(cena)} zł</b>${S.meta.powDom?' &middot; '+fmt(cena/S.meta.powDom)+' zł/m² pow. domu':''}.
      Audyt nie wykazał dotąd wad wycenialnych.</p>`:''}
    ${cena&&cmax?`
    <h2>Wycena wad i propozycja ceny</h2>
    <table>
      <tr><th>Pozycja</th><th>Kwota</th><th>Komentarz</th></tr>
      <tr><td>Cena ofertowa</td><td><b>${fmt(cena)} zł</b></td><td>${S.meta.powDom?fmt(cena/S.meta.powDom)+' zł/m² pow. domu':''}</td></tr>
      <tr><td>Koszty w zasadzie pewne</td><td><b>${fmt(cmin)} zł</b></td><td>Dolna granica wycen — to argumentujesz w rozmowie</td></tr>
      <tr><td>Ryzyko maksymalne</td><td>${fmt(cmax)} zł</td><td>Gdyby każda wada okazała się najgorszym wariantem</td></tr>
      <tr><td><b>Proponowana cena</b></td><td class="rg"><b>${fmt(propon)} zł</b></td>
        <td>Obniżka o ${fmt(obnizka)} zł, czyli ${(obnizka/cena*100).toFixed(1)}%${przekroczony?' — ograniczona do 15% ceny':''}</td></tr>
    </table>
    ${przekroczony?`<blockquote><b>Uwaga.</b> Wyliczone koszty usunięcia wad (${fmt(bazaObnizki)} zł) przekraczają 15% ceny ofertowej.
      W takiej sytuacji negocjacja ceny zwykle nie ma sensu. Realne pytanie brzmi nie „ile utargować", tylko „czy w ogóle kupować".</blockquote>`:''}
    <p style="font-size:12px;color:#666">Metoda: podstawą obniżki jest dolna granica szacunków, nie suma najgorszych scenariuszy.</p>`:''}

    ${red.length?`<h2>Wady blokujące — wyjaśnij przed umową przedwstępną</h2>
      <table><tr><th>Sekcja</th><th>Ustalenie</th><th>Koszt</th></tr>${rows(red)}</table>`:''}

    ${yel.length?`<h2>Wady do wyceny — karta przetargowa</h2>
      <table><tr><th>Sekcja</th><th>Ustalenie</th><th>Koszt</th></tr>${rows(yel)}</table>`:''}

    ${grn.length?`<h2>Sprawdzone bez zastrzeżeń</h2>
      <p style="font-size:12.5px;color:#555">${grn.map(x=>esc(x.t)).join(' &middot; ')}</p>`:''}

    ${done<tot?`<h2>Do uzupełnienia</h2><p style="font-size:12.5px;color:#555">${
      allChecks().filter(c=>c.type!=='info'&&(S.a[c.id]==null||S.a[c.id]===''||S.a[c.id]==='?'))
      .map(c=>esc(c.q)).join(' &middot; ')}</p>`:''}

    ${Object.keys(S.n).filter(k=>S.n[k]).length?`<h2>Notatki z oględzin</h2>
      ${Object.keys(S.n).filter(k=>S.n[k]).map(k=>{
        const c=allChecks().find(x=>x.id===k);
        return `<p style="font-size:12.5px"><b>${esc(c?c.q:k)}</b><br>${esc(S.n[k])}</p>`;}).join('')}`:''}

    <h2>Propozycja pisma negocjacyjnego</h2>
    <blockquote id="letterBox" style="white-space:pre-wrap">${esc(letter)}</blockquote>

    <h2>Rekomendowane zapisy w umowie przedwstępnej</h2>
    <ul style="font-size:13px">
      <li>Warunek zawieszający: przedstawienie odpisu księgi wieczystej bez wzmianek na dzień zawarcia umowy przyrzeczonej.</li>
      ${red.some(x=>x.mid==='m2')?'<li>Warunek: wykreślenie obciążeń ujawnionych w dziale III przed zawarciem umowy przyrzeczonej.</li>':''}
      ${f.some(x=>x.cid==='kw_hipoteka'&&x.lv==='yellow')?'<li>Zapis o spłacie bezpośredniej: część ceny płatna na rachunek techniczny banku wskazany w promesie.</li>':''}
      ${red.some(x=>x.mid==='m4')||yel.some(x=>x.mid==='m4')?'<li>Oświadczenie sprzedającego o zgodności stanu faktycznego z dokumentacją budowlaną oraz o braku toczących się postępowań przed nadzorem budowlanym.</li>':''}
      <li>Prawo do przeprowadzenia inspekcji technicznej przez wskazanego przeze mnie rzeczoznawcę przed umową przyrzeczoną.</li>
      <li>Zobowiązanie do wydania nieruchomości wolnej od osób i rzeczy oraz do wymeldowania wszystkich osób.</li>
      <li>Zobowiązanie do przekazania: świadectwa energetycznego, dokumentacji budowlanej, protokołów przeglądów, gwarancji i instrukcji urządzeń.</li>
      <li>Kara umowna na wypadek odstąpienia od umowy przez sprzedającego oraz zadatek zamiast zaliczki.</li>
    </ul>

    <h2>Zastrzeżenie</h2>
    <p style="font-size:11.5px;color:#666">Zakres kontroli opracowano m.in. w oparciu o workbook „Samodzielny audyt działki"
    Marcina Jaremki (BezpiecznyGrunt.pl), rozszerzony o moduł stanu technicznego budynku i zaktualizowany o stan prawny z sierpnia 2026 r.
    Ten dokument jest narzędziem pomocniczym opartym na danych z rejestrów publicznych i na własnych obserwacjach.
    Nie zastępuje opinii prawnej, wyceny rzeczoznawcy majątkowego ani ekspertyzy technicznej. Szacunki kosztów są orientacyjne.</p>
  </div>`;
}
function copyLetter(){
  const t=document.getElementById('letterBox').textContent;
  navigator.clipboard.writeText(t).then(()=>alert('Pismo skopiowane do schowka.'),
    ()=>alert('Nie udało się skopiować. Zaznacz tekst ręcznie.'));
}
