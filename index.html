{id:'m4', name:'Budynek', icon:'4', title:'Budynek: legalność i stan techniczny',
 lead:'Przy kupnie domu to ta sekcja generuje największe kwoty. Samowola budowlana i wilgoć potrafią kosztować więcej niż sama działka.',
 checks:[

 {id:'b_pozwolenie', src:'wlasne', mode:'man', q:'Czy sprzedający ma komplet dokumentów budowy?',
  why:'Bez dokumentów nie wiesz, czy kupujesz legalny budynek.',
  type:'select', opts:[['komplet','Tak, komplet'],['czesc','Częściowo'],['brak','Brak dokumentów'],['stary','Budynek sprzed 1995 r. — dokumentów nie ma']],
  flag:v=>{
    if(v==='brak')return R('Brak dokumentacji budowlanej','Nie masz jak zweryfikować legalności budynku. Samowola budowlana przechodzi na ciebie razem z nieruchomością, łącznie z ryzykiem nakazu rozbiórki albo kosztownej legalizacji. Sprawdź w powiatowym inspektoracie nadzoru budowlanego (PINB), czy budynek figuruje w rejestrze i czy nie toczy się postępowanie.',30000,200000,'Brak dokumentacji budowlanej i niepotwierdzona legalność budynku.');
    if(v==='czesc')return Y('Niekompletna dokumentacja','Ustal, czego dokładnie brakuje. Brak zawiadomienia o zakończeniu budowy albo pozwolenia na użytkowanie oznacza, że formalnie budynek nie został oddany do użytku, mimo że ktoś w nim mieszka.',3000,30000,'Niekompletna dokumentacja budowlana wymagająca uzupełnienia.');
    if(v==='stary')return Y('Budynek sprzed 1995 roku','Dla starych budynków brak dokumentacji jest częsty i sam w sobie nie oznacza samowoli. Warto jednak potwierdzić w PINB, że nie ma otwartego postępowania.',5000,25000,null);
    if(v==='komplet')return G('Dokumentacja kompletna','');
    return null;},
  help:`<b>Poproś o te dokumenty:</b>
   <ol><li><b>Pozwolenie na budowę</b> (lub zgłoszenie) wraz z projektem budowlanym.</li>
   <li><b>Zawiadomienie o zakończeniu budowy</b> lub <b>pozwolenie na użytkowanie</b>.</li>
   <li><b>Dziennik budowy</b>.</li>
   <li><b>Inwentaryzacja geodezyjna powykonawcza</b> — pokazuje rzeczywiste usytuowanie budynku.</li>
   <li><b>Protokoły odbiorów</b>: kominiarski, gazowy, elektryczny.</li>
   <li><b>Świadectwo charakterystyki energetycznej</b> — sprzedający ma ustawowy obowiązek je przekazać.</li></ol>
   <b>Weryfikacja niezależna:</b> zapytaj w PINB, czy dla tej działki toczy się lub toczyło postępowanie. To informacja publiczna.`},

 {id:'b_samowola', src:'wlasne', mode:'field', q:'Czy stan faktyczny zgadza się z projektem i mapą?',
  why:'Zabudowany taras, przerobiony garaż na pokój albo dobudowana wiata to typowe samowole, o których sprzedający „zapomina".',
  type:'select', opts:[['zgodny','Zgodny'],['drobne','Drobne różnice'],['duze','Istotne różnice / dobudówki'],['?','Nie porównano']],
  flag:v=>{
    if(v==='duze')return R('Rozbieżność z projektem — prawdopodobna samowola','Nadzór budowlany może nakazać rozbiórkę albo wszcząć postępowanie legalizacyjne. Opłata legalizacyjna przy większych obiektach idzie w dziesiątki tysięcy. Odpowiedzialność przechodzi na aktualnego właściciela, więc na ciebie. Żądaj legalizacji przed transakcją albo obniżenia ceny o pełny koszt.',20000,120000,'Rozbieżność między stanem faktycznym a dokumentacją — ryzyko postępowania legalizacyjnego lub nakazu rozbiórki.');
    if(v==='drobne')return Y('Drobne rozbieżności','Altany, wiaty czy przydomowe zadaszenia bywają zwolnione z pozwolenia, ale część wymaga zgłoszenia. Ustal, co dokładnie i czy zostało zgłoszone.',2000,15000,null);
    if(v==='zgodny')return G('Stan zgodny z dokumentacją','');
    return null;},
  help:`<b>Co porównać podczas oględzin:</b>
   <ul><li>Liczba i rozmieszczenie okien względem projektu.</li>
   <li>Czy taras jest zadaszony albo zabudowany (częsta samowola).</li>
   <li>Czy garaż nadal jest garażem.</li>
   <li>Czy poddasze zostało zaadaptowane na mieszkalne (zmiana sposobu użytkowania wymaga zgłoszenia).</li>
   <li>Wiaty, altany, budynki gospodarcze — czy są na mapie zasadniczej.</li>
   <li>Czy budynek zachowuje odległości od granic: 4 m przy ścianie z oknami, 3 m przy ścianie bez okien.</li></ul>
   <b>Szybki test:</b> otwórz zdjęcie satelitarne w Geoportalu i porównaj obrys budynków z mapą ewidencyjną.
   Obiekty widoczne na zdjęciu, a nieobecne na mapie, to kandydaci na samowolę.`},

 {id:'b_wilgoc', src:'wlasne', mode:'field', q:'Czy widać ślady wilgoci, zawilgocenia lub zagrzybienia?',
  why:'Wilgoć podciągająca kapilarnie to najdroższa wada ukryta w starych domach.',
  type:'select', opts:[['nie','Nie ma śladów'],['slady','Pojedyncze ślady'],['duze','Wyraźne zawilgocenie / grzyb'],['?','Nie sprawdzono']],
  flag:v=>{
    if(v==='duze')return R('Wyraźne zawilgocenie budynku','Przyczyną jest zwykle brak lub degradacja izolacji fundamentów. Naprawa oznacza odkopanie fundamentów, wykonanie izolacji, drenaż opaskowy i osuszenie murów, do tego skucie i odtworzenie tynków. Przy grzybie dochodzi dezynfekcja i wymiana zainfekowanych elementów. To poważna kwota, a nie „do odmalowania".',40000,150000,'Zawilgocenie budynku wymagające odtworzenia izolacji przeciwwilgociowej i osuszenia.');
    if(v==='slady')return Y('Ślady wilgoci','Może być lokalna nieszczelność albo początek większego problemu. Warto wezwać specjalistę z miernikiem wilgotności przed decyzją.',8000,40000,'Ślady zawilgocenia wymagające diagnostyki i naprawy.');
    if(v==='nie')return G('Brak śladów wilgoci','');
    return null;},
  help:`<b>Gdzie patrzeć, w tej kolejności:</b>
   <ol><li><b>Piwnica</b>, zwłaszcza narożniki i styk ściany z podłogą. Białe wykwity soli to sygnał.</li>
   <li><b>Dolne 50 cm ścian</b> na parterze — odparzony tynk, odchodząca farba, przebarwienia.</li>
   <li><b>Za meblami i za zasłonami</b> — sprzedający lubi tam chować problem.</li>
   <li><b>Sufity pod łazienkami</b> i wokół kominów.</li>
   <li><b>Zapach</b> — stęchlizna jest wyczuwalna nawet po odświeżeniu ścian.</li></ol>
   <b>Sygnał ostrzegawczy:</b> świeżo pomalowany fragment ściany w starym domu albo intensywny odświeżacz powietrza podczas oględzin.
   <br><br><b>Miernik wilgotności</b> kosztuje ok. 100 zł. Przy zakupie domu za kilkaset tysięcy to najlepiej wydane pieniądze.`},

 {id:'b_pokrycie', src:'wlasne', mode:'field', q:'Z czego jest pokrycie dachu?',
  why:'Materiał określa, ile lat jeszcze posłuży i jakie są koszty w razie wymiany.',
  type:'select', opts:[['ceramika','Dachówka ceramiczna'],['beton','Dachówka betonowa'],['blachodach','Blachodachówka'],
    ['blacha','Blacha na rąbek / trapezowa'],['papa','Papa / gont bitumiczny'],['eternit','Eternit (azbest)'],['?','Nie ustalono']],
  flag:v=>{
    if(v==='eternit')return R('Pokrycie z eternitu','Materiał zawierający azbest. Szczegóły i wycena przy pytaniu o eternit poniżej.',25000,90000,'Pokrycie dachowe zawierające azbest.');
    if(v==='papa')return Y('Papa lub gont bitumiczny','Najkrótsza żywotność ze wszystkich pokryć: zwykle 15–30 lat, przy papie termozgrzewalnej na dachu płaskim bywa mniej. Sprawdź rok wykonania i stan przy kominach, wpustach i obróbkach.',25000,70000,'Pokrycie o krótkiej żywotności, wymagające wymiany w bliskiej perspektywie.');
    if(v==='blachodach')return Y('Blachodachówka','Żywotność zwykle 30–50 lat, zależnie od grubości blachy i jakości powłoki. Rysy i uszkodzenia powłoki prowadzą do korozji. Bywa głośna przy deszczu. Sprawdź stan powłoki przy krawędziach i wkrętach — uszczelki starzeją się szybciej niż blacha.',0,45000,null);
    if(v==='beton')return G('Dachówka betonowa','Trwałość rzędu 30–50 lat, materiał solidny. Z czasem porasta mchem i traci kolor, ale to kwestia estetyki, nie szczelności.');
    if(v==='ceramika')return G('Dachówka ceramiczna','Najtrwalsze z popularnych pokryć, spokojnie 60–100 lat. Ciężka, więc jeśli ją położono, więźba jest odpowiednio mocna.');
    if(v==='blacha')return G('Blacha na rąbek lub trapezowa','Trwałe pokrycie, 40–70 lat przy dobrej jakości materiału i prawidłowym montażu.');
    return null;},
  help:`<b>Jak rozpoznać z ziemi:</b>
   <ul><li><b>Ceramiczna</b> — matowa, ceglasta lub angoba, wyraźnie widoczne pojedyncze elementy, z czasem porasta mchem.</li>
   <li><b>Betonowa</b> — bardziej regularna i grubsza od ceramicznej, często szara lub barwiona w masie.</li>
   <li><b>Blachodachówka</b> — imituje dachówkę, ale w dużych arkuszach; widać regularne linie łączeń i wkręty.</li>
   <li><b>Blacha na rąbek</b> — pionowe wypukłe listwy co kilkadziesiąt centymetrów.</li>
   <li><b>Papa</b> — jednolita ciemna powierzchnia, zwykle na dachu płaskim.</li>
   <li><b>Eternit</b> — faliste szarobure płyty cementowe, często z porostami, widoczne otwory po gwoździach.</li></ul>
   <b>Zapytaj o rok położenia</b> i czy dach był kryty od nowa, czy nowe pokrycie nałożono na stare. Nakładanie zdarza się
   przy blachodachówce kładzionej wprost na eternit — wtedy azbest nadal tam jest, tylko go nie widać.`},

 {id:'b_dach', src:'wlasne', mode:'field', q:'W jakim stanie jest dach i kominy?',
  why:'Materiał to jedno, stan to drugie — nawet ceramika po pięćdziesięciu latach wymaga przeglądu.',
  type:'select', opts:[['dobry','Dobry / niedawno wymieniony'],['sredni','Zużyty, do wymiany za kilka lat'],['zly','Zły — przecieki, ubytki'],['?','Nie oceniono']],
  flag:v=>{
    if(v==='zly')return Y('Dach do wymiany','Wymiana pokrycia wraz z obróbkami, rynnami i ewentualną naprawą więźby to jeden z największych pojedynczych wydatków w starym domu.',35000,120000,'Pokrycie dachowe wymaga wymiany.');
    if(v==='sredni')return Y('Dach zużyty','Policz to jako wydatek w perspektywie kilku lat i uwzględnij w cenie.',20000,70000,'Zużycie pokrycia dachowego skracające okres bezawaryjnej eksploatacji.');
    if(v==='dobry')return G('Dach w dobrym stanie','');
    return null;},
  help:`<b>Z zewnątrz:</b> ubytki dachówek, falowanie połaci (oznaka odkształconej więźby), stan rynien i obróbek blacharskich
   wokół komina, mech na połaci północnej.
   <br><br><b>Od środka, z poddasza:</b> ślady zacieków na deskowaniu i krokwiach, otwory po owadach (spuszczel, kołatek),
   zawilgocona wełna, brak lub uszkodzenie membrany.
   <br><br><b>Zapytaj wprost:</b> „W którym roku wymieniano pokrycie?" i o protokół przeglądu kominiarskiego z ostatniego roku.
   Przegląd jest obowiązkowy raz w roku.`},

 {id:'b_azbest', src:'wlasne', mode:'field', q:'Czy na dachu lub budynkach gospodarczych jest eternit (azbest)?',
  why:'Eternit kładziono masowo do końca lat dziewięćdziesiątych. Utylizacja jest obowiązkowa i kosztowna.',
  type:'select', opts:[['nie','Nie ma'],['dach','Tak, na dachu domu'],['gospodarcze','Tak, na budynku gospodarczym'],['?','Nie sprawdzono']],
  flag:v=>{
    if(v==='dach')return R('Eternit na dachu domu','Azbest wymaga usunięcia przez uprawnioną firmę, z kartą przekazania odpadu i zgłoszeniem. Sam demontaż plus utylizacja to zwykle 60–120 zł za m², do tego dochodzi nowe pokrycie. Przy dachu 150 m² licz kilkadziesiąt tysięcy tylko za usunięcie. Gminy prowadzą programy dofinansowania, ale pokrywają część kosztu i mają kolejki. To najmocniejszy pojedynczy argument negocjacyjny, jaki możesz znaleźć na oględzinach.',25000,90000,'Pokrycie zawierające azbest wymagające usunięcia przez uprawnioną firmę i wymiany dachu.');
    if(v==='gospodarcze')return Y('Eternit na budynku gospodarczym','Mniejsza powierzchnia, ale ten sam reżim prawny: demontaż przez uprawnioną firmę i utylizacja.',8000,25000,'Azbest na budynku gospodarczym wymagający utylizacji.');
    if(v==='nie')return G('Bez azbestu','');
    return null;},
  help:`<b>Jak rozpoznać eternit:</b> faliste lub płaskie płyty cementowe, szarobure, często z porostami i mchem,
   czasem pomalowane farbą. Charakterystyczna jest regularna fala o dużym rozstawie i widoczne otwory na gwoździe z podkładkami.
   <br><br><b>Gdzie szukać:</b> dach domu, ale też garaż, szopa, komórka, altana, a nawet elewacja i podbitka.
   Bywa też pod nowym pokryciem, położonym „na wierzch" bez demontażu starego.
   <br><br><b>Uwaga na rok budowy:</b> w domach z lat sześćdziesiątych do dziewięćdziesiątych to bardzo prawdopodobne.
   Właściciel ma obowiązek zgłaszać wyroby azbestowe do gminy — zapytaj, czy takie zgłoszenie było.`},

 {id:'b_sciany', src:'wlasne', mode:'man', q:'Z czego zbudowane są ściany?',
  why:'Materiał decyduje o cieple, wilgoci i możliwości przeróbek.',
  type:'select', opts:[['dobry','Cegła, pustak, beton komórkowy'],['zuzel','Żużlobeton / gruzobeton'],['drewno','Drewno / szkielet'],['?','Nie ustalono']],
  flag:v=>{
    if(v==='zuzel')return Y('Ściany z żużlobetonu lub gruzobetonu','Popularne od lat pięćdziesiątych do siedemdziesiątych. Materiał słabo izoluje termicznie, chłonie wilgoć i bywa kłopotliwy przy przeróbkach oraz mocowaniu czegokolwiek do ściany. Docieplenie jest konieczne, ale trzeba je zrobić prawidłowo, bo źle dobrana izolacja zamyka wilgoć w ścianie.',30000,90000,'Ściany z materiału o słabych parametrach cieplnych, wymagające docieplenia.');
    if(v==='dobry')return G('Ściany murowane z materiału pełnowartościowego','');
    return null;},
  help:`<b>Jak ustalić:</b> najpewniej z projektu budowlanego. Jeśli go nie ma, zapytaj sprzedającego i sąsiadów —
   domy z jednego okresu w danej okolicy budowano zwykle tak samo.
   <br><br><b>Wskazówka z oględzin:</b> poproś o pozwolenie wywiercenia małego otworu w niewidocznym miejscu.
   Żużlobeton kruszy się i sypie ciemnym, spieczonym materiałem.
   <br><br><b>Rok budowy jako podpowiedź:</b> lata pięćdziesiąte–siedemdziesiąte to duże prawdopodobieństwo żużlobetonu,
   od lat osiemdziesiątych dominuje cegła i pustak, od dwutysięcznych beton komórkowy i keramzyt.`},

 {id:'b_okna', src:'wlasne', mode:'field', q:'Jakie są okna — ile szyb i z czego?',
  why:'Nie pytaj, czy są szczelne, bo każdy sprzedający powie że tak. Zapytaj o typ, bo to fakt do sprawdzenia.',
  type:'select', opts:[['trzy','Trzyszybowe'],['dwa_nowe','Dwuszybowe, po 2005 r.'],['dwa_stare','Dwuszybowe, lata 90.'],
    ['drewno_stare','Drewniane skrzynkowe / jednoramowe'],['?','Nie wiadomo']],
  flag:v=>{
    if(v==='drewno_stare')return Y('Stara stolarka drewniana','Okna skrzynkowe i jednoramowe sprzed lat dziewięćdziesiątych mają współczynnik przenikania ciepła kilkakrotnie gorszy od dzisiejszych. Wymiana wraz z parapetami i obróbką to zwykle 1500–2500 zł za okno. Przy ochronie konserwatorskiej bywa wymagane odtworzenie formy, co podnosi koszt.',25000,70000,'Stolarka okienna w stanie pierwotnym, wymagająca wymiany.');
    if(v==='dwa_stare')return Y('Okna dwuszybowe z lat dziewięćdziesiątych','Nawet plastikowe okna z tamtego okresu mają dziś parametry dalekie od wymagań. Uszczelki po trzydziestu latach są twarde, okucia zużyte, a pakiety szybowe często rozszczelnione. Licz wymianę w perspektywie kilku lat.',20000,55000,'Okna o parametrach cieplnych znacznie poniżej obecnych wymagań.');
    if(v==='dwa_nowe')return Y('Okna dwuszybowe nowszej generacji','Przyzwoity standard, choć poniżej dzisiejszych wymagań dla nowych budynków. Wymiana nie jest pilna.',0,25000,null);
    if(v==='trzy')return G('Okna trzyszybowe','Aktualny standard energetyczny.');
    return null;},
  help:`<b>Jak policzyć szyby bez pytania sprzedającego:</b> przyłóż zapaloną zapalniczkę albo latarkę telefonu do szyby pod kątem
   i policz odbicia płomienia. Dwa odbicia to jedna szyba, cztery to dwuszybowy pakiet, sześć to trzyszybowy.
   Metoda działa zawsze i nie zależy od tego, co ci powiedzą.
   <br><br><b>Sprawdź też datę produkcji</b> — bywa wybita na ramce dystansowej między szybami, widocznej od strony krawędzi.
   <br><br><b>Niezależnie od typu obejrzyj:</b> zaparowanie <i>między</i> szybami (rozszczelniony pakiet, okno do wymiany),
   pleśń na ramach i we wnękach, trudność w domykaniu (osiadła rama), stan uszczelek.
   <br><br><b>Kartka papieru</b> włożona między skrzydło a ramę przy zamkniętym oknie powinna stawiać wyraźny opór przy wyciąganiu.`},

 {id:'b_wentylacja', src:'wlasne', mode:'field', q:'Jak działa wentylacja?',
  why:'Szczelne okna bez sprawnej wentylacji to gwarancja wilgoci i grzyba.',
  type:'select', opts:[['ok','Działa — ciąg wyczuwalny'],['slaba','Słaba, czuć zaduch'],['rekuperacja','Rekuperacja'],['?','Nie sprawdzono']],
  flag:v=>{
    if(v==='slaba')return Y('Niesprawna wentylacja','Klasyczny problem po wymianie okien na szczelne bez zapewnienia nawiewu. Skutkuje wilgocią, pleśnią w narożnikach i za meblami oraz zaduchem. Rozwiązania: nawiewniki w oknach, udrożnienie kanałów, w skrajnym przypadku wentylacja mechaniczna.',3000,25000,'Niesprawna wentylacja grawitacyjna wymagająca doposażenia.');
    if(v==='rekuperacja')return G('Wentylacja mechaniczna z odzyskiem ciepła','Sprawdź rocznik, stan filtrów i czy była serwisowana.');
    if(v==='ok')return G('Wentylacja działa','');
    return null;},
  help:`<b>Test kartką:</b> przyłóż kartkę papieru do kratki wentylacyjnej w łazience i kuchni. Powinna się przykleić i utrzymać.
   Jeśli opada, ciągu nie ma.
   <br><br><b>Sygnały problemu:</b> zaduch przy wejściu do domu, zaparowane lustra długo po prysznicu, pleśń w narożnikach
   i za meblami przy ścianach zewnętrznych, kropelki na oknach rano.
   <br><br><b>Zapytaj o protokół przeglądu kominiarskiego</b> — obejmuje też kanały wentylacyjne.`},

 {id:'b_historia', src:'wlasne', mode:'man', q:'Czy w budynku były zalania, pęknięcia albo naprawy konstrukcyjne?',
  why:'To pytanie zadane wprost często przynosi odpowiedź, której nie znajdziesz na oględzinach.',
  type:'select', opts:[['nie','Nie było'],['drobne','Drobne, naprawione'],['powazne','Poważne'],['?','Nie pytano']],
  flag:v=>{
    if(v==='powazne')return R('Historia poważnych uszkodzeń','Naprawy konstrukcyjne oznaczają, że coś było nie tak z posadowieniem, konstrukcją albo wodą. Poproś o dokumentację naprawy i ekspertyzę, a jeśli ich nie ma, zleć własną opinię konstruktora przed decyzją.',20000,150000,'Historia poważnych uszkodzeń konstrukcyjnych budynku.');
    if(v==='drobne')return Y('Drobne uszkodzenia w przeszłości','Ustal, co dokładnie i czy przyczynę usunięto, czy tylko skutek. Zamalowane pęknięcie potrafi wrócić.',3000,25000,null);
    if(v==='nie')return G('Bez historii uszkodzeń','');
    return null;},
  help:`<b>Zapytaj wprost i osobno o każdą rzecz:</b>
   <ol><li>Czy kiedykolwiek doszło do zalania — z dachu, z instalacji, z gruntu?</li>
   <li>Czy pojawiały się pęknięcia ścian i czy ktoś ustalał przyczynę?</li>
   <li>Czy wykonywano prace przy fundamentach, więźbie albo stropach?</li>
   <li>Kto budował dom i czy zachowały się zdjęcia z budowy?</li></ol>
   <b>Zdjęcia z budowy są cenniejsze, niż się wydaje</b> — pokazują, co jest pod tynkiem i w gruncie.
   <br><br><b>Zapytaj też sąsiadów.</b> Przy zalaniu albo poważnym remoncie cała ulica zwykle o tym wie.`},

 {id:'b_instalacje', src:'wlasne', mode:'field', q:'W jakim stanie są instalacje: elektryczna, wodna, kanalizacyjna?',
  type:'select', opts:[['nowe','Wymienione, nowoczesne'],['czesc','Częściowo wymienione'],['stare','Oryginalne, nienaruszone od lat'],['?','Nie oceniono']],
  flag:v=>{
    if(v==='stare')return Y('Instalacje w stanie pierwotnym','W domach sprzed lat 90. instalacja elektryczna jest zwykle aluminiowa, dwuprzewodowa, bez uziemienia i bez wyłącznika różnicowoprądowego. Wymiana wymaga skucia bruzd w całym domu, więc de facto remontu wykończenia. Instalacja wodna ocynkowana zarasta i wymaga wymiany.',45000,130000,'Instalacje wewnętrzne w stanie pierwotnym, wymagające kompleksowej wymiany.');
    if(v==='czesc')return Y('Instalacje częściowo wymienione','Ustal dokładnie, co i kiedy wymieniono. Częsta sytuacja: wymieniona hydraulika, stara elektryka.',15000,50000,null);
    if(v==='nowe')return G('Instalacje wymienione','Poproś o protokoły pomiarów elektrycznych i dokumentację.');
    return null;},
  help:`<b>Elektryka — szybki test:</b> otwórz skrzynkę rozdzielczą. Korki topikowe zamiast wyłączników nadprądowych
   i brak wyłącznika różnicowoprądowego (dużego, z przyciskiem TEST) oznaczają instalację do wymiany.
   Sprawdź, czy gniazdka mają bolec uziemiający.
   <br><br><b>Hydraulika:</b> odkręć wodę na pełny strumień w najdalszym punkcie i sprawdź ciśnienie.
   Rdzawa woda po dłuższym postoju to znak rur ocynkowanych.
   <br><br><b>Poproś o protokół pomiarów instalacji elektrycznej</b> — powinien być wykonywany co 5 lat.`},

 {id:'b_ogrzewanie', src:'wlasne', mode:'field', q:'Czym ogrzewany jest budynek i ile to kosztuje rocznie?',
  type:'select', opts:[['gaz','Gaz sieciowy'],['pc','Pompa ciepła'],['pellet','Pellet / biomasa'],['wegiel','Węgiel / kocioł stałopalny'],['prad','Prąd (grzejniki, piece akumulacyjne)'],['inne','Inne / mieszane']],
  flag:v=>{
    if(v==='wegiel')return Y('Ogrzewanie węglowe','Wiele gmin i województw ma uchwały antysmogowe nakazujące wymianę kotłów pozaklasowych w określonym terminie. Wymiana na pompę ciepła albo kocioł gazowy to realny wydatek, częściowo pokrywany z programu Czyste Powietrze.',25000,80000,'Źródło ciepła wymagające wymiany ze względu na uchwałę antysmogową.');
    if(v==='prad')return Y('Ogrzewanie elektryczne bezpośrednie','Najdroższe w eksploatacji, jeśli dom nie jest bardzo dobrze ocieplony. Poproś o rachunki za prąd z zimowych miesięcy.',20000,70000,'Wysokie koszty eksploatacyjne ogrzewania elektrycznego.');
    if(v==='gaz')return G('Gaz sieciowy','Wygodne i przewidywalne. Sprawdź wiek kotła i protokół przeglądu.');
    if(v==='pc')return G('Pompa ciepła','Niskie koszty eksploatacji. Sprawdź moc, rocznik i czy dom ma odpowiednią izolację.');
    return null;},
  help:`<b>Poproś o rachunki za ostatnie 12 miesięcy</b> — za gaz, prąd i opał. To jedyny wiarygodny sposób oceny realnych
   kosztów utrzymania. Deklaracje sprzedającego bywają optymistyczne.
   <br><br><b>Sprawdź świadectwo energetyczne</b> — sprzedający ma obowiązek je przekazać przy transakcji.
   Wskaźnik EP powyżej 200 kWh/(m²·rok) oznacza dom energochłonny.
   <br><br><b>Zapytaj o uchwałę antysmogową</b> w gminie.`},

 {id:'b_ekspert', src:'wlasne', mode:'man', q:'Czy planujesz inspekcję techniczną przez niezależnego eksperta?',
  type:'yn', opts:YN,
  flag:v=>v==='nie'?Y('Brak inspekcji technicznej','Przy zakupie domu za kilkaset tysięcy złotych inspekcja kosztuje zwykle 1000–2500 zł i regularnie zwraca się wielokrotnie. Ekspert z kamerą termowizyjną i miernikiem wilgotności zobaczy to, czego ty nie zobaczysz.',0,0,null):(v==='tak'?G('Inspekcja techniczna planowana','Dobra decyzja. Wyniki wykorzystaj jako argument negocjacyjny.'):null),
  help:`<b>Kogo szukać:</b> inspektor budowlany albo rzeczoznawca z uprawnieniami, najlepiej z kamerą termowizyjną i miernikiem wilgotności.
   <br><br><b>Kiedy:</b> po pierwszych oględzinach, przed umową przedwstępną. Jeśli sprzedający odmawia wpuszczenia eksperta,
   to sama w sobie jest odpowiedź.
   <br><br><b>Co dostajesz:</b> raport z listą wad i szacunkiem kosztów naprawy. To najlepszy możliwy dokument negocjacyjny,
   bo mówi liczbami, a nie wrażeniami.`}
]},

/* ---------------- M4b WNĘTRZE ---------------- */
{id:'m4b', name:'Wnętrze', icon:'5', title:'Układ i funkcjonalność',
 lead:'Rzeczy, które trudno zmienić i których nie widać na zdjęciach z ogłoszenia. Zdjęcia robi się obiektywem szerokokątnym — w rzeczywistości wszystko jest mniejsze.',
 checks:[

 {id:'w_uklad', src:'wlasne', mode:'field', q:'Czy układ pomieszczeń działa?',
  why:'Przechodnie pokoje i łazienka przez sypialnię to wady, z którymi mieszka się codziennie.',
  type:'select', opts:[['dobry','Przemyślany'],['dopracowania','Do drobnych zmian'],['zly','Wymaga przebudowy'],['?','Nie oceniono']],
  flag:v=>{
    if(v==='zly')return Y('Układ wymagający przebudowy','Wyburzenia, przesunięcia instalacji i nowe wykończenie. Jeśli ściana jest nośna, dochodzi projekt konstruktora i zgłoszenie albo pozwolenie. Policz to jako pełny remont tej części domu.',30000,120000,'Układ pomieszczeń wymagający przebudowy.');
    if(v==='dopracowania')return Y('Układ do korekt','Drobne zmiany bez ruszania konstrukcji.',5000,30000,null);
    if(v==='dobry')return G('Układ funkcjonalny','');
    return null;},
  help:`<b>Przejdź trasę dnia:</b> od drzwi wejściowych z zakupami do kuchni, z sypialni do łazienki w nocy, z ogrodu do pralni w błocie.
   Tam gdzie trasa jest niewygodna, będzie niewygodna codziennie przez lata.
   <br><br><b>Typowe wady, które trudno naprawić:</b> pokój przechodni, łazienka dostępna tylko przez sypialnię, kuchnia bez okna,
   brak toalety na parterze, wejście prosto do salonu bez przedsionka, schody w środku salonu.
   <br><br><b>Zmierz to, co ważne</b> — taśmą albo aplikacją. Zdjęcia z ogłoszenia robi się obiektywem szerokokątnym
   i pomieszczenia wyglądają na wyraźnie większe niż są.`},

 {id:'w_nosne', src:'wlasne', mode:'man', q:'Czy wiesz, które ściany są nośne?',
  why:'Bez tego nie wiesz, czy planowana zmiana układu jest w ogóle możliwa.',
  type:'yn', opts:YN,
  flag:v=>v==='nie'?Y('Nieznany układ konstrukcyjny','Jeśli planujesz zmiany, poproś o rzuty albo projekt. Bez nich każda przebudowa zaczyna się od ekspertyzy konstruktora. Usunięcie ściany nośnej wymaga projektu i nadproża.',3000,20000,null):(v==='tak'?G('Układ konstrukcyjny znany',''):null),
  help:`<b>Skąd wiedzieć:</b> najpewniej z projektu budowlanego lub rzutów. Poproś o nie przy oględzinach.
   <br><br><b>Orientacyjnie w terenie:</b> ściany nośne są zwykle grubsze (24 cm i więcej), brzmią głucho przy opukaniu,
   biegną przez wszystkie kondygnacje w tym samym miejscu i podpierają strop. Działowe są cieńsze i brzmią pusto.
   To wskazówka, nie podstawa do wyburzania.`},

 {id:'w_swiatlo', src:'wlasne', mode:'field', q:'Czy w pomieszczeniach jest dość światła dziennego?',
  type:'select', opts:[['dobre','Jasno'],['srednie','Przeciętnie'],['ciemno','Ciemno'],['?','Nie oceniono']],
  flag:v=>{
    if(v==='ciemno')return Y('Mało światła dziennego','Trudne do naprawienia bez powiększania otworów okiennych, co przy ścianie nośnej wymaga nadproża i projektu. Sprawdź, czy przyczyną nie są drzewa albo sąsiedni budynek — to akurat bywa do rozwiązania.',10000,50000,'Niedostateczne doświetlenie pomieszczeń.');
    if(v==='dobre')return G('Dobre doświetlenie','');
    return null;},
  help:`<b>Oglądaj przy zgaszonym świetle.</b> Sprzedający często zapalają wszystkie lampy przed wizytą, co całkowicie zmienia odbiór.
   Poproś o zgaszenie i odsłonięcie zasłon.
   <br><br><b>Zwróć uwagę na:</b> okna zacienione przez drzewa albo sąsiedni budynek, głębokie pomieszczenia z jednym oknem,
   wąskie okna w starych domach, ciemny korytarz bez doświetlenia.
   <br><br><b>Zapamiętaj porę wizyty</b> i wróć o innej.`},

 {id:'w_miejsce', src:'wlasne', mode:'field', q:'Czy jest miejsce do pracy i przechowywania?',
  why:'Przy pracy zdalnej brak własnego pokoju jest odczuwalny każdego dnia.',
  type:'select', opts:[['tak','Wystarczy'],['ciasno','Ciasno, ale da się'],['brak','Brak'],['?','Nie oceniono']],
  flag:v=>{
    if(v==='brak')return Y('Brak miejsca do pracy lub przechowywania','Przy pracy zdalnej gabinet to warunek, nie luksus. Sprawdź, czy da się wygospodarować pomieszczenie, zaadaptować poddasze albo dostawić budynek — a potem czy plan miejscowy i wielkość działki na to pozwalają.',10000,80000,'Brak wydzielonego miejsca do pracy i przechowywania.');
    if(v==='ciasno')return Y('Miejsca w sam raz','Bez zapasu na zmianę sytuacji.',0,0,null);
    if(v==='tak')return G('Miejsca wystarczająco','');
    return null;},
  help:`<b>Sprawdź konkretnie:</b> czy jest pomieszczenie, które zamkniesz na czas rozmowy; gdzie postawisz biurko z monitorem;
   czy jest tam zasięg i gniazdko; gdzie trafią rzeczy sezonowe, narzędzia, rowery, opony.
   <br><br><b>Zajrzyj do:</b> garażu, kotłowni, na poddasze i pod schody.
   <br><br><b>Jeśli liczysz na adaptację poddasza,</b> sprawdź wysokość w kalenicy i miejsce na schody.`}
]},

/* ---------------- M5 MEDIA ---------------- */
{id:'m5', name:'Media', icon:'6', title:'Uzbrojenie terenu',
 lead:'Przy istniejącym domu media zwykle są. Pytanie brzmi: jakie, w jakim stanie i ile kosztuje ich utrzymanie.',
 checks:[

 {id:'u_prad', src:'raport', mode:'field', q:'Przyłącze elektryczne',
  type:'select', opts:[['jest3','Jest, trójfazowe (siła)'],['jest1','Jest, jednofazowe'],['brak','Brak przyłącza'],['?','Nie sprawdzone']],
  flag:v=>{
    if(v==='brak')return R('Brak przyłącza elektrycznego','Przy istniejącym domu to sytuacja nietypowa i wymaga wyjaśnienia — możliwe zaległości i odcięcie. Nowe przyłącze to wniosek o warunki przyłączenia, umowa z operatorem i oczekiwanie liczone w miesiącach.',5000,30000,'Brak przyłącza elektrycznego.');
    if(v==='jest1')return Y('Przyłącze jednofazowe','Wystarcza do podstawowego użytkowania, ale wyklucza pompę ciepła, ładowarkę samochodową i mocniejsze narzędzia. Zwiększenie mocy wymaga wniosku do operatora.',2000,8000,'Ograniczona moc przyłączeniowa — konieczna rozbudowa do zasilania trójfazowego.');
    if(v==='jest3')return G('Przyłącze trójfazowe','Wystarczy pod pompę ciepła i ładowarkę do auta.');
    return null;},
  help:`Zajrzyj do skrzynki przyłączeniowej: <b>trzy bezpieczniki główne</b> oznaczają zasilanie trójfazowe, jeden — jednofazowe.
   <br><br><b>Poproś o umowę z operatorem</b> i sprawdź <b>moc przyłączeniową</b> (w kW). Dla domu z pompą ciepła potrzebujesz zwykle minimum 12–14 kW.
   <br><br>Zapytaj też o zaległości. Dług za prąd nie przechodzi na ciebie, ale odcięte przyłącze i tak trzeba przywrócić.`},

 {id:'u_woda', src:'raport', mode:'field', q:'Zaopatrzenie w wodę',
  type:'select', opts:[['siec','Wodociąg sieciowy'],['studnia','Studnia własna'],['brak','Brak'],['?','Nie sprawdzone']],
  flag:v=>{
    if(v==='brak')return R('Brak zaopatrzenia w wodę','Przy istniejącym domu wymaga natychmiastowego wyjaśnienia. Przyłącze wodociągowe to koszt zależny od odległości; studnia głębinowa 15–30 tys. zł bez gwarancji wydajności.',15000,40000,'Brak zaopatrzenia nieruchomości w wodę.');
    if(v==='studnia')return Y('Studnia własna','Brak opłat, ale też brak gwarancji jakości i wydajności. Zleć <b>badanie wody</b> w stacji sanitarno-epidemiologicznej: bakteriologia, azotany, żelazo, mangan. W okolicach rolniczych azotany bywają przekroczone. Studnia może wymagać stacji uzdatniania.',3000,20000,'Zaopatrzenie ze studni własnej — konieczne badanie jakości wody i możliwa stacja uzdatniania.');
    if(v==='siec')return G('Wodociąg sieciowy','Jakość kontrolowana przez dostawcę.');
    return null;},
  help:`<b>Przy studni sprawdź:</b> głębokość, rok wykonania, wydajność, czy jest pozwolenie wodnoprawne przy większym poborze, stan pompy i hydroforu.
   <br><br><b>Badanie wody zleć zanim kupisz</b>, nie po. Kosztuje kilkaset złotych, a wynik potrafi zmienić decyzję.
   <br><br><b>Przy wodociągu</b> poproś o rachunki i sprawdź, czy licznik jest legalizowany.`},

 {id:'u_kanal', src:'raport', mode:'field', q:'Odprowadzenie ścieków',
  type:'select', opts:[['siec','Kanalizacja sieciowa'],['oczyszcz','Przydomowa oczyszczalnia'],['szambo','Zbiornik bezodpływowy (szambo)'],['brak','Brak'],['?','Nie sprawdzone']],
  flag:v=>{
    if(v==='brak')return R('Brak odprowadzenia ścieków','Budynek mieszkalny bez rozwiązanej gospodarki ściekowej nie może być legalnie użytkowany.',15000,45000,'Brak rozwiązanej gospodarki ściekowej.');
    if(v==='szambo')return Y('Zbiornik bezodpływowy','Koszt wywozu to realnie 150–350 zł miesięcznie dla rodziny, czyli 2–4 tys. zł rocznie. Gminy prowadzą obowiązkowe kontrole szczelności zbiorników i umów na wywóz; za brak umowy albo nieszczelny zbiornik grożą kary. Jeśli gmina planuje kanalizację, przyłączenie bywa obowiązkowe.',18000,45000,'Zbiornik bezodpływowy generujący stałe koszty wywozu i ryzyko kontroli szczelności.');
    if(v==='oczyszcz')return Y('Przydomowa oczyszczalnia','Tańsza w eksploatacji od szamba, ale wymaga zgłoszenia w gminie, przeglądów i serwisu. Sprawdź typ (drenaż rozsączający wymaga przepuszczalnego gruntu i niskiego poziomu wód gruntowych), rok montażu i zgłoszenie.',0,15000,null);
    if(v==='siec')return G('Kanalizacja sieciowa','Najwygodniejsze i najtańsze w eksploatacji rozwiązanie.');
    return null;},
  help:`<b>Przy szambie zapytaj:</b> o pojemność, częstotliwość wywozu, umowę z firmą asenizacyjną i rachunki. Policz roczny koszt i wpisz go do negocjacji.
   <br><br><b>Sprawdź w gminie</b>, czy jest plan budowy kanalizacji w tej okolicy. Jeśli tak, przyłączenie może być obowiązkowe.
   <br><br><b>Przy oczyszczalni</b> poproś o zgłoszenie do gminy i protokoły serwisowe.`},

 {id:'u_gaz', src:'raport', mode:'field', q:'Przyłącze gazowe',
  type:'select', opts:[['jest','Jest przyłącze'],['siecblisko','Brak, ale sieć jest w ulicy'],['brak','Brak sieci w okolicy'],['?','Nie sprawdzone']],
  flag:v=>{
    if(v==='brak')return Y('Brak sieci gazowej','Zostają: pompa ciepła, pellet, gaz zbiornikowy albo prąd. Nie jest to wada blokująca, ale zawęża wybór i zwykle podnosi koszt ogrzewania.',0,0,null);
    if(v==='siecblisko')return Y('Sieć w ulicy, brak przyłącza','Przyłączenie to wniosek o warunki, umowa z gazownią i wykonanie przyłącza. Koszt zależny od odległości.',4000,15000,'Brak przyłącza gazowego mimo dostępnej sieci.');
    if(v==='jest')return G('Przyłącze gazowe wykonane','');
    return null;},
  help:`Skrzynka gazowa jest zwykle na ścianie budynku albo w ogrodzeniu. Sprawdź datę ostatniego
   <b>przeglądu szczelności instalacji gazowej</b> — jest obowiązkowy raz w roku.
   <br><br>Jeśli sieci nie ma, zapytaj w gminie o plany rozbudowy.`},

 {id:'u_internet', src:'wlasne', mode:'field', q:'Internet stacjonarny',
  type:'select', opts:[['swiatlo','Światłowód'],['kabel','Kabel / DSL'],['radio','Radiowy / LTE'],['brak','Brak / tylko komórkowy'],['?','Nie sprawdzone']],
  flag:v=>{
    if(v==='brak')return Y('Brak internetu stacjonarnego','Przy pracy zdalnej to realny problem, nie drobiazg. Sprawdź zasięg operatorów komórkowych na miejscu, telefonem, w kilku pomieszczeniach.',2000,10000,'Brak dostępu do internetu stacjonarnego.');
    if(v==='radio')return Y('Internet radiowy / LTE','Działa, ale bywa niestabilny i limitowany. Sprawdź realną prędkość na miejscu.',0,0,null);
    if(v==='swiatlo')return G('Światłowód','');
    return null;},
  help:`Sprawdź dostępność na mapach zasięgu operatorów.
   <br><br><b>Zrób test na miejscu:</b> podczas oględzin włącz test prędkości na telefonie w kilku pomieszczeniach,
   zwłaszcza tam, gdzie planujesz biuro.`},

 {id:'u_przez', src:'raport', mode:'semi', q:'Czy przez działkę przebiegają sieci obce (rury, kable, linie)?',
  type:'yn', opts:YN,
  task:`Sprawdź, czy przez działkę przebiegają sieci uzbrojenia terenu.
1. Otwórz geoportal powiatowy — powiatowe serwisy częściej mają warstwy uzbrojenia niż krajowy.
2. Włącz warstwy sieci uzbrojenia terenu (GESUT): elektroenergetyczna, gazowa, wodociągowa, kanalizacyjna, telekomunikacyjna, ciepłownicza.
3. Sprawdź, czy któraś przecina działkę, i opisz w notatce przebieg: wzdłuż granicy czy przez środek.
4. Jeśli warstw GESUT nie ma w serwisie, napisz to wprost.`,
  manual:`<b>Mapa zasadnicza</b> z powiatowego ośrodka dokumentacji geodezyjnej i kartograficznej (ODGiK) — kilkadziesiąt złotych, pokazuje pełne uzbrojenie podziemne. Wniosek składasz w starostwie, osobiście albo przez portal geodezyjny powiatu.
   <br><br><b>Gestorzy sieci</b> — operator energetyczny, gazownia, wodociągi. Każdy udostępni informację o przebiegu swojej sieci na wniosek, zwykle bezpłatnie.
   <br><br><b>W terenie</b> szukaj żółtych słupków oznaczeniowych gazociągu, studzienek, hydrantów, słupów i skrzynek.
   <br><br><b>Powiąż to z działem III księgi wieczystej.</b> Sieć bez wpisanej służebności przesyłu to osobny problem prawny.`,
  flag:v=>v==='tak'?Y('Sieci przechodzące przez działkę','Wokół infrastruktury obowiązują strefy kontrolowane z zakazem zabudowy i nasadzeń: przy gazociągach zwykle kilka metrów, przy liniach wysokiego napięcia kilkanaście. Ustal dokładny przebieg i szerokość strefy, potem policz, ile użytecznej powierzchni realnie zostaje.',0,0,'Sieci przesyłowe przez działkę ograniczają możliwość zabudowy i zagospodarowania terenu.'):(v==='nie'?G('Brak sieci obcych przez działkę',''):null),
  help:`<b>Jak sprawdzić:</b> zamów <b>mapę zasadniczą</b> w powiatowym ośrodku dokumentacji geodezyjnej i kartograficznej.
   <br><br><b>W terenie:</b> szukaj słupków oznaczeniowych gazociągu (żółte), studzienek, hydrantów, słupów energetycznych i skrzynek.
   <br><br><b>Powiąż to z działem III księgi wieczystej</b> — jeśli sieć jest, a służebności przesyłu nie ma, to osobny problem prawny.`}
]},

/* ---------------- M6 DROGA ---------------- */
{id:'m6', name:'Droga', icon:'7', title:'Dostęp do drogi publicznej',
 lead:'Bez prawnego dostępu do drogi publicznej nie ma pozwolenia na budowę ani rozbudowę. To jedna z niewielu wad, których nie da się szybko naprawić pieniędzmi.',
 checks:[

 {id:'d_typ', src:'raport', mode:'semi', q:'Jaki jest status prawny drogi dojazdowej?',
  type:'select', opts:[['publiczna','Droga publiczna (gminna, powiatowa, krajowa)'],['wewn_udzial','Droga wewnętrzna — mam mieć udział'],['wewn_sluz','Droga wewnętrzna — służebność'],['prywatna','Droga prywatna bez uregulowania'],['?','Nie sprawdzone']],
  task:`Ustal status prawny drogi dojazdowej do tej nieruchomości.
1. Otwórz geoportal (krajowy albo powiatowy) i znajdź działkę drogową przylegającą do nieruchomości.
2. Odczytaj numer tej działki drogowej.
3. Sprawdź w BIP gminy uchwałę o zaliczeniu dróg do kategorii dróg gminnych — poszukaj tego numeru działki albo nazwy ulicy.
4. Sprawdź, czy droga ma nazwę ulicy w bazie adresowej, co bywa wskazówką że jest publiczna.
5. Nie zgaduj na podstawie nawierzchni. Asfalt nie oznacza drogi publicznej.`,
  manual:`<b>To pytanie w większości przypadków wymaga telefonu</b>, bo dane właścicielskie z ewidencji nie są publicznie dostępne przez internet.
   <br><br><b>Wydział geodezji starostwa</b> — podajesz numer działki drogowej i pytasz o właściciela oraz grupę rejestrową. Gmina, powiat albo Skarb Państwa oznacza drogę publiczną, osoba fizyczna lub wspólnota oznacza drogę prywatną.
   <br><br><b>Zarząd dróg gminnych albo powiatowych</b> — potwierdzi kategorię drogi i to, czy jest zaliczona do sieci dróg publicznych uchwałą rady gminy.
   <br><br><b>Księga wieczysta działki drogowej</b>, jeśli znasz jej numer, pokaże właściciela wprost.`,
  flag:v=>{
    if(v==='prywatna')return R('Dojazd przez cudzy grunt bez uregulowania','To najpoważniejsza z możliwych wad prawnych. Właściciel może zablokować przejazd, a ustanowienie służebności drogi koniecznej wymaga postępowania sądowego trwającego nawet kilka lat i wiąże się z wynagrodzeniem. Bez dostępu do drogi publicznej nie uzyskasz pozwolenia na budowę.',15000,60000,'Brak uregulowanego dostępu do drogi publicznej.');
    if(v==='wewn_udzial')return Y('Udział w drodze wewnętrznej','Rozwiązanie akceptowalne, ale sprawdź: czy udział jest wpisany w księdze, kto ponosi koszty utrzymania i odśnieżania, czy droga ma urządzoną nawierzchnię. Gmina nie ma obowiązku utrzymywać drogi wewnętrznej.',0,15000,'Droga wewnętrzna — koszty utrzymania po stronie współwłaścicieli.');
    if(v==='wewn_sluz')return Y('Służebność przez drogę wewnętrzną','Sprawdź w księdze treść wpisu: czy obejmuje przejazd, nie tylko przechód, i czy jest wpisana w księdze nieruchomości <b>obciążonej</b>. Ustne ustalenia z sąsiadem nie mają znaczenia prawnego.',0,10000,null);
    if(v==='publiczna')return G('Dostęp do drogi publicznej','Sytuacja optymalna. Utrzymanie po stronie zarządcy drogi.');
    return null;},
  help:`<b>Jak zweryfikować status drogi:</b>
   <ol><li>W Geoportalu kliknij w działkę drogową obok i sprawdź jej numer.</li>
   <li>Zadzwoń do wydziału geodezji starostwa albo urzędu gminy i zapytaj o <b>właściciela i grupę rejestrową</b> tej działki.</li>
   <li>Sprawdź, czy droga figuruje w <b>uchwale rady gminy o zaliczeniu do kategorii dróg gminnych</b>. Ta uchwała jest w BIP.</li></ol>
   <b>Uwaga:</b> to, że droga jest asfaltowa i jeżdżą po niej wszyscy, nie znaczy, że jest publiczna.`},

 {id:'d_zjazd', src:'wlasne', mode:'man', q:'Czy zjazd z drogi publicznej jest legalny i uzgodniony?',
  why:'Przyleganie do asfaltu nie oznacza prawa wjazdu. Zjazd wymaga zgody zarządcy drogi.',
  type:'select', opts:[['jest','Zjazd istnieje i jest uzgodniony'],['istnieje','Zjazd istnieje, brak dokumentów'],['brak','Zjazdu nie ma'],['row','Zjazd przez rów melioracyjny'],['?','Nie sprawdzone']],
  flag:v=>{
    if(v==='brak')return R('Brak zjazdu z drogi publicznej','Lokalizację zjazdu uzgadnia zarządca drogi i przy drogach krajowych lub wojewódzkich potrafi odmówić ze względów bezpieczeństwa: zła widoczność, bliskość skrzyżowania, łuk drogi. W skrajnym przypadku działka leży przy asfalcie, a i tak nie wjedziesz na nią legalnie.',10000,40000,'Brak uzgodnionej lokalizacji zjazdu z drogi publicznej.');
    if(v==='row')return Y('Zjazd przez rów melioracyjny','Poza zgodą zarządcy drogi potrzebna jest też zgoda wodnoprawna od Wód Polskich na zabudowę rowu przepustem. Dwie procedury zamiast jednej, więc licz kilka miesięcy i koszt wykonania przepustu.',8000,25000,'Zjazd przez rów wymaga zgody wodnoprawnej i wykonania przepustu.');
    if(v==='istnieje')return Y('Zjazd bez dokumentacji','Przy starych siedliskach zjazdy często powstawały bez formalnej decyzji i zwykle nikt tego nie kwestionuje. Problem pojawia się, gdy chcesz go przebudować, poszerzyć albo zrobić drugi.',0,15000,null);
    if(v==='jest')return G('Zjazd uzgodniony','Formalności po stronie dostępu załatwione.');
    return null;},
  help:`<b>Gdzie sprawdzić:</b>
   <ol><li><b>Zarządca drogi</b> (gmina, powiat albo GDDKiA): zapytaj, czy dla tej działki wydano decyzję na lokalizację zjazdu.</li>
   <li><b>Decyzja WZ</b>, jeśli istnieje — lokalizacja zjazdu bywa w niej wskazana.</li>
   <li><b>Sprzedający</b> — poproś o decyzję zjazdową razem z resztą dokumentów.</li></ol>
   <b>Na co patrzeć w terenie:</b> czy między drogą a działką biegnie <b>rów</b>. Jeśli tak, przejazd nad nim wymaga
   przepustu, a ten zgody Wód Polskich, bo rów to urządzenie wodne.
   <br><br><b>Kiedy to szczególnie ważne:</b> droga krajowa lub wojewódzka, zakręt, wzniesienie ograniczające widoczność, bliskie skrzyżowanie.`},

 {id:'d_szer', src:'raport', mode:'field', q:'Jaka jest szerokość drogi dojazdowej?',
  type:'select', opts:[['ok','Powyżej 5 m'],['waska','3–5 m'],['bardzo','Poniżej 3 m'],['?','Nie zmierzone']],
  flag:v=>{
    if(v==='bardzo')return R('Droga węższa niż 3 metry','Poniżej minimum technicznego. Problem nie tylko z pozwoleniem na budowę: nie wjedzie tam śmieciarka, karetka ani wóz strażacki. Dostawa materiałów przy remoncie będzie kosztowna.',0,0,'Szerokość drogi dojazdowej poniżej wymogów technicznych.');
    if(v==='waska')return Y('Droga wąska','Minimum dla ciągu pieszo-jezdnego to zwykle 5 m, dla samej jezdni 3 m. Sprawdź, czy zmieszczą się pojazdy służb i czy jest gdzie się wyminąć.',0,0,null);
    if(v==='ok')return G('Szerokość drogi bez zastrzeżeń','');
    return null;},
  help:`<b>Zmierz na miejscu</b> od granicy do granicy działki drogowej, nie od krawędzi asfaltu.
   <br><br><b>W Geoportalu:</b> narzędzie pomiaru odległości.
   <br><br><b>Sprawdź też praktycznie:</b> czy da się wyminąć z innym autem, czy jest miejsce na zawrócenie,
   jak wygląda dojazd zimą, czy nie ma niskiego wiaduktu albo ostrego zakrętu na trasie dostaw.`},

 {id:'d_utrzym', src:'wlasne', mode:'field', q:'Kto utrzymuje drogę i w jakim jest stanie?',
  type:'select', opts:[['gmina','Gmina — asfalt / utwardzona'],['gmina_grunt','Gmina — droga gruntowa'],['mieszkancy','Mieszkańcy we własnym zakresie'],['?','Nie ustalono']],
  flag:v=>{
    if(v==='mieszkancy')return Y('Droga utrzymywana przez mieszkańców','Koszty odśnieżania, równania i napraw dzielone między sąsiadów, bez formalnego mechanizmu egzekwowania. Bywa źródłem konfliktów. Zapytaj, jak to działa w praktyce i ile kosztuje rocznie.',1000,8000,'Koszty utrzymania drogi po stronie mieszkańców.');
    if(v==='gmina_grunt')return Y('Droga gruntowa gminna','Gmina utrzymuje, ale standard bywa różny. Sprawdź stan po deszczu i zapytaj sąsiadów o odśnieżanie zimą.',0,3000,null);
    if(v==='gmina')return G('Droga utwardzona utrzymywana przez gminę','');
    return null;},
  help:`<b>Zapytaj sąsiadów, nie sprzedającego.</b> To najlepsze źródło informacji o odśnieżaniu, błocie na wiosnę
   i tym, czy gmina reaguje na zgłoszenia.
   <br><br><b>Sprawdź w BIP gminy</b> plany inwestycyjne — może droga jest w planie utwardzenia, co podnosi wartość nieruchomości.`}
]},

/* ---------------- M7 ŚRODOWISKO ---------------- */
{id:'m7', name:'Środowisko', icon:'8', title:'Zagrożenia środowiskowe i ochrona przyrody',
 lead:'Powódź, osuwisko i formy ochrony przyrody. Pierwsze dwa potrafią zablokować ubezpieczenie i kredyt, trzecie ogranicza swobodę inwestowania.',
 checks:[

 {id:'s_powodz', src:'raport', mode:'semi', q:'Czy działka leży na obszarze zagrożenia powodziowego?',
  type:'select', opts:[['nie','Nie'],['q10','Tak — woda 10-letnia (Q10)'],['q100','Tak — woda 100-letnia (Q100)'],['q500','Tak — woda 500-letnia (Q500)'],['?','Nie sprawdzone']],
  task:`Sprawdź, czy nieruchomość leży na obszarze zagrożenia powodziowego.
1. Otwórz Hydroportal: wody.isok.gov.pl/imap_kzgw/?gpmap=gp0
2. Znajdź lokalizację po adresie albo po współrzędnych podanych wyżej.
3. Włącz kolejno warstwy: obszary szczególnego zagrożenia powodzią o prawdopodobieństwie 10 procent (Q10), 1 procent (Q100) oraz obszary o prawdopodobieństwie 0,2 procent (Q500).
4. Sprawdź, czy punkt leży w zasięgu którejkolwiek z nich. Jeśli tak, podaj którą.`,
  manual:`<b>Państwowe Gospodarstwo Wodne Wody Polskie</b> — właściwy zarząd zlewni. Można złożyć wniosek o informację, czy działka leży na obszarze szczególnego zagrożenia powodzią.
   <br><br><b>W gminie</b> zapytaj o studium ochrony przeciwpowodziowej i o to, czy teren był podtapiany. Urzędnicy pamiętają zdarzenia z 1997 i 2010 roku.
   <br><br><b>Najlepsze źródło jest nieformalne:</b> sąsiedzi. Zapytaj wprost, czy woda kiedykolwiek podeszła pod domy i kiedy. Woda opadowa spływająca z pola potrafi zalać dom, który nie leży w żadnej strefie powodziowej, a tego nie pokaże żadna mapa.`,
  flag:v=>{
    if(v==='q10'||v==='q100')return R('Obszar szczególnego zagrożenia powodzią','Na obszarach szczególnego zagrożenia powodzią obowiązują zakazy i ograniczenia w zagospodarowaniu, a odstępstwa wymagają zgody Wód Polskich. Praktyczne konsekwencje: banki bywają niechętne kredytowaniu, ubezpieczyciele odmawiają polisy od powodzi albo mocno podnoszą składkę, a odsprzedaż będzie trudniejsza.',0,0,'Położenie na obszarze szczególnego zagrożenia powodzią — ograniczenia w zabudowie, problemy z ubezpieczeniem i kredytowaniem.');
    if(v==='q500')return Y('Obszar zagrożenia wodą 500-letnią','Ryzyko niskie i zwykle bez zakazów zabudowy, ale ubezpieczyciel może to uwzględnić w składce.',0,0,null);
    if(v==='nie')return G('Poza obszarem zagrożenia powodziowego','');
    return null;},
  help:`<b>Gdzie sprawdzić:</b> Hydroportal (link w pasku wyżej), warstwy <b>Mapy zagrożenia powodziowego</b>.
   <br><br><b>Rozróżnienie, które ma znaczenie prawne:</b> obszary szczególnego zagrożenia powodzią to te o prawdopodobieństwie
   10% (Q10) i 1% (Q100). Tam obowiązują ograniczenia. Q500 (0,2%) ma charakter informacyjny.
   <br><br><b>Sprawdź też lokalnie:</b> zapytaj sąsiadów o powódź z 1997 i 2010 roku oraz o podtopienia po nawalnych deszczach.`},

 {id:'s_osuw', src:'raport', mode:'semi', q:'Czy teren jest zagrożony ruchami masowymi (osuwiska)?',
  type:'yn', opts:YN,
  task:`Sprawdź, czy teren jest zagrożony ruchami masowymi ziemi.
1. Otwórz System Osłony Przeciwosuwiskowej: mapa.osuwiska.pgi.gov.pl
2. Znajdź lokalizację po adresie albo współrzędnych.
3. Sprawdź, czy w pobliżu są oznaczone osuwiska albo tereny zagrożone ruchami masowymi.
4. Ważne: baza SOPO nie obejmuje całego kraju. Jeśli dla tego obszaru nie ma opracowania, napisz to wprost — brak oznaczenia nie znaczy brak ryzyka.`,
  manual:`<b>Starostwo powiatowe, wydział geodezji lub ochrony środowiska</b> — powiat prowadzi rejestr terenów zagrożonych ruchami masowymi ziemi. To rejestr urzędowy, pełniejszy niż SOPO.
   <br><br><b>Państwowy Instytut Geologiczny</b> — można zapytać o dostępność opracowania dla danego obszaru.
   <br><br><b>Objawy, które sprawdzisz sam na miejscu:</b> pofalowana powierzchnia zbocza, pochylone drzewa, pęknięcia w gruncie, przechylone słupy i ogrodzenia, ukośne pęknięcia w ścianach, klinujące się drzwi. Jeden taki objaw na stoku to powód do opinii geologa.`,
  flag:v=>v==='tak'?R('Teren osuwiskowy','Na terenach osuwiskowych zabudowa wymaga dokumentacji geologiczno-inżynierskiej, a często zabezpieczeń, których koszt bywa porównywalny z kosztem budowy. Ubezpieczenie może być odmówione. Przy istniejącym domu sprawdź pęknięcia ścian, przechylone ogrodzenia, pofalowany teren i pochylone drzewa.',50000,250000,'Położenie na terenie zagrożonym ruchami masowymi ziemi.'):(v==='nie'?G('Poza terenami osuwiskowymi',''):null),
  help:`<b>Gdzie sprawdzić:</b> System Osłony Przeciwosuwiskowej SOPO (link w pasku wyżej). Baza jest niekompletna dla części kraju,
   więc brak oznaczenia nie zawsze oznacza brak ryzyka.
   <br><br><b>Objawy w terenie:</b> pofalowana powierzchnia zbocza, pochylone drzewa („pijany las"), pęknięcia w gruncie,
   przechylone słupy i ogrodzenia, ukośne pęknięcia w ścianach budynku, klinujące się drzwi i okna.`},

 {id:'s_natura', src:'raport', mode:'semi', q:'Czy nieruchomość leży w formie ochrony przyrody?',
  type:'select', opts:[['nie','Nie'],['natura','Natura 2000'],['park','Park krajobrazowy'],['obszar','Obszar chronionego krajobrazu'],['rezerwat','Rezerwat / park narodowy / otulina'],['?','Nie sprawdzone']],
  task:`Sprawdź, czy nieruchomość leży w obszarze objętym ochroną przyrody.
1. Otwórz Geoserwis GDOŚ: geoserwis.gdos.gov.pl/mapy
2. Znajdź lokalizację po adresie albo współrzędnych.
3. Włącz warstwy: Natura 2000 (obszary ptasie i siedliskowe), parki krajobrazowe, obszary chronionego krajobrazu, rezerwaty, parki narodowe wraz z otulinami.
4. Podaj nazwę obszaru, jeśli działka w którymś leży.`,
  manual:`<b>Regionalna Dyrekcja Ochrony Środowiska (RDOŚ)</b> właściwa dla województwa — zapytaj telefonicznie albo wnioskiem, czy działka leży w formie ochrony przyrody i jakie obowiązują tam zakazy.
   <br><br><b>Urząd gminy</b> prowadzi rejestr form ochrony ustanowionych lokalnie: użytki ekologiczne, pomniki przyrody, zespoły przyrodniczo-krajobrazowe. Tych często nie ma w geoserwisie.
   <br><br><b>Przeczytaj akt powołujący</b> — uchwałę sejmiku albo rozporządzenie. Konkretne zakazy są tam, nie w opisach ogólnych.`,
  flag:v=>{
    if(v==='rezerwat')return R('Rezerwat lub park narodowy','Najostrzejszy reżim ochronny. Zabudowa i przekształcanie terenu są mocno ograniczone albo wykluczone.',0,0,'Położenie w obszarze o najwyższym reżimie ochrony przyrody.');
    if(v==='natura')return Y('Obszar Natura 2000','Przedsięwzięcia mogące znacząco oddziaływać na obszar wymagają oceny oddziaływania na środowisko. Dla domu jednorodzinnego zwykle wystarcza standardowa procedura, ale rozbudowa czy wycinka drzew bywają utrudnione i wymagają uzgodnienia z RDOŚ.',3000,25000,'Położenie w obszarze Natura 2000 — dodatkowe uzgodnienia środowiskowe.');
    if(v==='park')return Y('Park krajobrazowy','Uchwała powołująca park zawiera zakazy, które potrafią zaskoczyć: ograniczenia wysokości i formy budynków, zakaz zmiany stosunków wodnych, ograniczenia w wycince.',2000,20000,'Ograniczenia wynikające z ochrony parku krajobrazowego.');
    if(v==='obszar')return Y('Obszar chronionego krajobrazu','Najłagodniejsza forma ochrony. Zwykle ograniczenia dotyczą formy architektonicznej i odległości od wód.',0,8000,null);
    if(v==='nie')return G('Poza formami ochrony przyrody','');
    return null;},
  help:`<b>Gdzie sprawdzić:</b> Geoserwis GDOŚ (link w pasku wyżej) — mapa wszystkich form ochrony przyrody w Polsce.
   <br><br><b>Przeczytaj akt powołujący</b> daną formę ochrony (uchwała sejmiku albo rozporządzenie). Tam są konkretne zakazy.
   <br><br><b>Częsty zakaz, który zaskakuje:</b> ograniczenie zabudowy w pasie od brzegu rzek i jezior na obszarach chronionego krajobrazu.`},

 {id:'s_drzewa', src:'wlasne', mode:'field', q:'Czy planujesz wycinkę drzew i czy przekraczają one limity?',

    if(v==='ponizej')return G('Wycinka w granicach zwolnienia','Bez formalności, o ile jesteś osobą fizyczną i wycinka nie ma związku z działalnością gospodarczą.');

  help:`<b>Limity obwodu pnia mierzonego na wysokości 5 cm od ziemi</b> — poniżej nich wycinka bez formalności:

    if(v==='przemysl')return R('Tereny przemysłowe w sąsiedztwie','Plan dopuszcza zabudowę przemysłową obok. Nawet jeśli dziś stoi tam pole, inwestor może postawić halę produkcyjną albo magazyn z ruchem ciężarówek. To trwale wpływa na komfort i wartość nieruchomości.',0,0,'Sąsiedztwo terenów przemysłowych w planie miejscowym.');
    if(v==='uslugi')return Y('Tereny usługowe w sąsiedztwie','Usługi to szerokie pojęcie: od cichego biura po warsztat samochodowy albo lokal gastronomiczny z ogródkiem czynnym do późna. Sprawdź w uchwale, jakie usługi plan dopuszcza.',0,0,null);
    if(v==='rolne')return Y('Tereny rolne w sąsiedztwie','Pole obok oznacza sezonowy hałas maszyn, opryski i zapachy. Przygotowywany projekt „lex rolnik" ma wymagać od kupującego oświadczenia u notariusza o akceptacji uciążliwości rolniczych oraz ograniczyć możliwość dochodzenia roszczeń wobec rolnika. Projekt nie jest jeszcze uchwalony, ale kierunek zmian jest wyraźny.',0,0,null);

   <br><br><b>Sprawdź też wydane pozwolenia na budowę</b> w okolicy — starostwo publikuje wykazy.`},

 {id:'n_sasiedzi', src:'wlasne', mode:'field', q:'Czy rozmawiałeś z sąsiadami?',

  manual:`<b>Starostwo powiatowe, ośrodek dokumentacji geodezyjnej i kartograficznej</b> — prowadzi rejestr cen i wartości nieruchomości. Można zamówić wyciąg za opłatą.
   <br><br><b>Rzeczoznawca majątkowy</b> — operat szacunkowy to koszt rzędu 1000–2000 zł, ale daje dokument, który ma moc dowodową przy negocjacjach i w banku.
   <br><br><b>Sam sprawdzisz orientacyjnie</b> na portalach ogłoszeniowych, pamiętając że to ceny ofertowe, zwykle o kilka do kilkunastu procent wyższe od transakcyjnych.`,
  flag:v=>{
    if(v==='powyzej')return Y('Cena ofertowa powyżej rynku','Masz twardy argument liczbowy. Ceny transakcyjne z RCN pochodzą z aktów notarialnych, to nie są opinie pośrednika. Przygotuj zestawienie trzech–pięciu porównywalnych transakcji i pokaż je przy negocjacji.',0,0,'Cena ofertowa odbiega w górę od cen transakcyjnych porównywalnych nieruchomości w okolicy.');
    if(v==='ponizej')return G('Cena poniżej rynku','Sprawdź, dlaczego. Okazja czy ukryta wada?');

  help:`<b>Jak sprawdzić ceny transakcyjne krok po kroku:</b>
   <ol><li>Wejdź na <a href="https://mapy.geoportal.gov.pl/imap/Imgp_2.html" target="_blank">mapy.geoportal.gov.pl</a>.</li>
   <li>Włącz warstwę <b>Rejestr Cen Nieruchomości</b>.</li>
   <li>Przybliż okolicę i klikaj w oznaczone transakcje.</li>
   <li>Zbierz 3–5 transakcji z ostatnich 12–18 miesięcy, o zbliżonej powierzchni.</li>
   <li>Przelicz na zł/m² powierzchni użytkowej i porównaj z ofertą.</li></ol>
   <b>Uwaga na pułapkę:</b> cena transakcyjna dotyczy całej nieruchomości. Porównuj domy o podobnym standardzie i wieku.`},

 {id:'c_czas', src:'wlasne', mode:'man', q:'Jak długo nieruchomość jest w sprzedaży?',

  help:`<b>Jak sprawdzić:</b> data dodania widnieje w ogłoszeniu na portalu. Sprawdź też, czy ta sama nieruchomość

 {id:'c_negocjacje', src:'wlasne', mode:'man', q:'Czy były już negocjacje i dlaczego nie doszły do skutku?',

function slug(s){return (s||'').toLowerCase()
  .replace(/^(powiat|gmina|miasto)\s+/,'')
  .replace(/[ąàâ]/g,'a').replace(/[ćç]/g,'c').replace(/[ęèé]/g,'e').replace(/ł/g,'l')
  .replace(/ń/g,'n').replace(/[óò]/g,'o').replace(/ś/g,'s').replace(/[źż]/g,'z')
  .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}

function LK(key){
  const p=S.parcel||{}, la=p.lat, lo=p.lon;
  const g=slug(p.commune), pw=slug(p.county);
  const D={
   geoportal:['https://mapy.geoportal.gov.pl/imap/Imgp_2.html','Geoportal krajowy','Działki, ortofoto, NMT, Rejestr Cen Nieruchomości'],
   gmina: g?['https://'+g+'.geoportal-krajowy.pl/dzialki','Geoportal gminny'+(p.commune?' — '+p.commune:''),'Często ma dane, których nie widać w krajowym'] : null,
   powiat: pw?['https://'+pw+'.e-mapa.net/','Geoportal powiatowy'+(p.county?' — '+p.county.replace(/^powiat\s+/i,''):''),'Powiatowa baza EGiB — pełniejsze atrybuty użytków i klas'] : null,
   szukajPow: pw?['https://duckduckgo.com/?q='+encodeURIComponent('geoportal '+(p.county||'')+' ewidencja gruntów działki'),'Znajdź geoportal powiatowy','Gdy powyższy adres nie działa'] : null,
   mpzp: g?['https://duckduckgo.com/?q='+encodeURIComponent('mpzp '+(p.commune||'')+' plan miejscowy mapa'),'Plan miejscowy — '+(p.commune||'gmina'),'Portal planistyczny gminy'] : null,
   bip: g?['https://duckduckgo.com/?q='+encodeURIComponent('BIP '+(p.commune||'')+' plan ogólny gminy uchwała'),'BIP gminy — plan ogólny','Uchwały i postęp prac nad planem ogólnym'] : null,
   ekw:['https://przegladarka-ekw.ms.gov.pl/','Przeglądarka ksiąg wieczystych','Wymaga numeru KW i captcha'],
   isok:['https://wody.isok.gov.pl/imap_kzgw/?gpmap=gp0','Hydroportal — zagrożenie powodziowe','Warstwy Q10, Q100, Q500'],
   sopo:['https://mapa.osuwiska.pgi.gov.pl/','SOPO — osuwiska','System Osłony Przeciwosuwiskowej'],
   gdos:['https://geoserwis.gdos.gov.pl/mapy/','Geoserwis GDOŚ','Natura 2000, parki, rezerwaty'],
   bdl:['https://www.bdl.lasy.gov.pl/portal/mapy','Bank Danych o Lasach','Czy drzewa to formalnie las (Ls)'],
   earth:['https://earth.google.com/web/','Google Earth — zdjęcia historyczne','Cofnij czas o 15 lat'],
   wody:['https://wody.gov.pl/kontakt','Wody Polskie — kontakt','Zgoda wodnoprawna przy zjeździe przez rów'],
   drogi: pw?['https://duckduckgo.com/?q='+encodeURIComponent('zarząd dróg '+(p.county||'')+' zjazd z drogi publicznej wniosek'),'Zarządca drogi','Decyzja lokalizacyjna zjazdu'] : null,
   pinb: pw?['https://duckduckgo.com/?q='+encodeURIComponent('PINB '+(p.county||'')+' nadzór budowlany kontakt'),'Nadzór budowlany (PINB)','Zapytaj o postępowania dla działki'] : null,
   gddkia:['https://www.gov.pl/web/gddkia/mapa-stanu-budowy-drog','Mapa inwestycji drogowych GDDKiA','Planowane drogi i obwodnice'],
   maps: la?['https://www.google.com/maps/@'+la+','+lo+',19z','Google Maps','Street View i zdjęcia satelitarne'] : null,
   street: la?['https://www.google.com/maps/@?api=1&map_action=pano&viewpoint='+la+','+lo,'Street View','Zobacz z poziomu ulicy'] : null,
   osm: la?['https://www.openstreetmap.org/#map=17/'+la+'/'+lo,'OpenStreetMap','Podgląd okolicy'] : null,
   gios:['https://powietrze.gios.gov.pl/pjp/current','Jakość powietrza GIOŚ','Dane ze stacji pomiarowych'],
   oferta: (S.meta&&S.meta.otodom)?[S.meta.otodom,'Ogłoszenie sprzedaży','Opis, zdjęcia, historia ceny'] : null,
   rcn:['https://mapy.geoportal.gov.pl/imap/Imgp_2.html','Rejestr Cen Nieruchomości','Warstwa RCN — ceny transakcyjne z aktów notarialnych']

function linkChips(keys){
  const h=keys.map(k=>LK(k)).filter(Boolean).map(a=>
   `<a class="chip lnk" href="${a[0]}" target="_blank" rel="noopener" title="${esc(a[2])}">${esc(a[1])}</a>`).join('');
  return h?`<div class="chips">${h}</div>`:'';
}
function linkList(keys){
  const h=keys.map(k=>LK(k)).filter(Boolean).map(a=>
   `<a class="linkitem" href="${a[0]}" target="_blank" rel="noopener">
      <div class="t">${esc(a[1])}<span class="d">${esc(a[2])}</span></div><span class="arr">→</span></a>`).join('');
  return h?`<div class="linklist">${h}</div>`:'';
}

function toolbar(mid){
  const p=S.parcel||{};
  const id=p.id||'';
  const val=id||(p.lat?p.lat.toFixed(5)+', '+p.lon.toFixed(5):'');
  if(!val)return `<div class="card tight toolbar"><div class="msg info" style="margin:0">
     Nie wskazałeś jeszcze nieruchomości.
     <button class="btn sm" style="margin-left:8px" onclick="go('start')">Wskaż na mapie</button></div></div>`;
  return `<div class="card tight toolbar">
    <div class="idrow">
      <span class="lbl">${id?'Działka':'Współrzędne'}</span>
      <span class="mono idv">${esc(val)}</span>
      <button class="btn sm sec" onclick="copyId()">Kopiuj</button>
    </div>
    ${linkChips(MODLINKS[mid]||[])}
  </div>`;
}
function copyId(){
  const p=S.parcel||{};
  const t=p.id||(p.lat?p.lat.toFixed(6)+', '+p.lon.toFixed(6):'');
  if(!t)return;
  navigator.clipboard.writeText(t).then(()=>{
    const b=event.target;const o=b.textContent;b.textContent='Skopiowano';
    setTimeout(()=>b.textContent=o,1400);},()=>alert(t));
}
function copyDomains(){
  const d=['mapy.geoportal.gov.pl','e-mapa.net','geoportal-krajowy.pl','wody.isok.gov.pl',
    'mapa.osuwiska.pgi.gov.pl','geoserwis.gdos.gov.pl','przegladarka-ekw.ms.gov.pl','bdl.lasy.gov.pl'].join('\n');
  const btn=event&&event.target;
  navigator.clipboard.writeText(d).then(()=>{
    if(btn){const o=btn.textContent;btn.textContent='Skopiowano';setTimeout(()=>btn.textContent=o,1500);}},()=>alert(d));
}

function go(t){TAB=t;window.scrollTo(0,0);render();}
function tabs(){
  const items=[{id:'start',name:'Start'}]
    .concat(M.map(m=>({id:m.id,name:m.name})))
    .concat([{id:'raport',name:'Raport'}]);
  $('#tabs').innerHTML=items.map(i=>{
    const lv=(i.id!=='start'&&i.id!=='raport')?modFlagLevel(i.id):'none';
    const d=(i.id!=='start'&&i.id!=='raport')?`<span class="dot ${lv}"></span>`:'';
    return `<button class="tab ${TAB===i.id?'on':''}" onclick="go('${i.id}')">${d}${esc(i.name)}</button>`;
  }).join('');
  const on=$('.tab.on'); if(on)on.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
}
function render(){
  tabs();
  if(TAB==='start')viewStart();
  else if(TAB==='raport')viewReport();
  else viewModule(M.find(m=>m.id===TAB));
  paintBar();
  $('#hdTitle').textContent = S.meta.adres? S.meta.adres.slice(0,42) : APP.name;
  $('#hdSub').textContent = APP.name+' v'+APP.ver+' · '+APP.prawo;
}

const BADGE={auto:'<span class="badge b-auto">automat</span>',
  semi:'<span class="badge b-semi">półautomat</span>',
  man:'<span class="badge b-man">dokumenty</span>',
  field:'<span class="badge b-field">w terenie</span>',info:''};

function viewModule(m){
  if(!m)return;
  let h=`<div class="card"><h2>${esc(m.title)}</h2><p class="lead">${esc(m.lead)}</p></div>`;
  h+=toolbar(m.id);
  h+=modPromptCard(m.id);
  if(m.auto==='poi')h+=poiCard();
  h+='<div class="card">';
  m.checks.forEach((c,i)=>{h+=renderCheck(c,i+1);});
  h+='</div>';
  const idx=M.findIndex(x=>x.id===m.id);
  h+=`<div class="row noprint" style="margin:14px 0">
    ${idx>0?`<button class="btn sec" onclick="go('${M[idx-1].id}')">← ${esc(M[idx-1].name)}</button>`:'<div></div>'}
    ${idx<M.length-1?`<button class="btn" onclick="go('${M[idx+1].id}')">${esc(M[idx+1].name)} →</button>`
      :`<button class="btn" onclick="go('raport')">Zobacz raport →</button>`}</div>
    <div class="noprint" style="text-align:center;margin:0 0 8px">
      <button class="btn sm sec" style="color:var(--tx3)" onclick="clearModule('${m.id}')">Wyczyść tę sekcję</button></div>`;
  $('#view').innerHTML=h;
}

function renderCheck(c,n){
  const v=S.a[c.id];
  let body='';
  if(c.type==='select'||c.type==='yn'){
    body='<div class="chips">'+c.opts.map(([val,lab])=>{
      let cls='chip';
      if(v===val){const f=c.flag?c.flag(val):null;
        cls+=' on '+(f?(f.lv==='red'?'r':f.lv==='yellow'?'y':'g'):'');}
      return `<button class="${cls}" onclick="set('${c.id}','${val}')">${esc(lab)}</button>`;
    }).join('')+'</div>';
  } else if(c.type==='text'){
    body=`<input type="text" value="${esc(v||'')}" placeholder="${esc(c.ph||'')}" oninput="setQuiet('${c.id}',this.value)">`;
  }
  const f=(c.flag&&v&&v!=='?')?c.flag(v):null;
  let fl='';
  if(f){
    const ico=f.lv==='red'?'●':f.lv==='yellow'?'▲':'✓';
    const cost=(f.cmin||f.cmax)?`<div class="cost">Szacowany koszt: ${f.cmin?zl(f.cmin)+' – ':'do '}${zl(f.cmax)}</div>`:'';
    fl=`<div class="fl ${f.lv}"><span class="ico">${ico}</span><div><b>${esc(f.t)}</b>${f.w?esc(f.w).replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>').replace(/&lt;i&gt;/g,'<i>').replace(/&lt;\/i&gt;/g,'</i>'):''}${cost}</div></div>`;
  }
  const nt=S.n[c.id]||'';
  const noteBox=c.type!=='info'?`<details class="hlp"><summary>Notatka</summary>
    <textarea placeholder="Co zaobserwowałeś, z kim rozmawiałeś, co ustalić dalej…" oninput="note('${c.id}',this.value)">${esc(nt)}</textarea></details>`:'';

  return `<div class="q">
    <div class="qt"><span class="n">${c.type==='info'?'!':n}</span>
      <span>${esc(c.q)} ${BADGE[c.mode]||''}</span></div>
    ${c.why?`<div class="qw">${esc(c.why)}</div>`:''}
    <div class="qbody">${body}${fl}
      ${c.task?`<details class="hlp"><summary>Prompt dla wtyczki Claude w Chrome</summary>
        <div class="pbox"><div class="ph"><b>Skopiuj i wklej do wtyczki</b>
          <button class="btn sm" onclick="copyPrompt('${c.id}')">Kopiuj</button></div>
          <pre>${esc(promptFor(c))}</pre>
          <div class="hint">Prompt zawiera dane tej działki i wymusza format odpowiedzi.
            Wynik wklejasz w oknie „Wklej wyniki” z nagłówka.</div>
        </div></details>`:''}
      ${c.help?`<details class="hlp" ${c.type==='info'?'open':''}><summary>${c.type==='info'?'Rozwiń':'Jak to sprawdzić samodzielnie'}</summary><div class="help">${c.help}</div></details>`:''}
      ${c.manual?`<details class="hlp"><summary>Gdy automat zawiedzie — droga urzędowa</summary>
        <div class="help mbox">${c.manual}</div></details>`:''}
      ${noteBox}</div></div>`;
}

function poiCard(){
  const p=S.poi;
  if(!S.parcel)return `<div class="card tight"><div class="msg info">Najpierw wskaż nieruchomość w sekcji Start — wtedy przeskanuję okolicę automatycznie.</div></div>`;
  if(p&&p.loading)return `<div class="card tight"><div class="msg info"><span class="spin"></span> Skanuję okolicę w promieniu 3 km…</div></div>`;
  if(!p||p.error)return `<div class="card tight"><div class="msg err">Nie udało się przeskanować okolicy.</div>
    <button class="btn sm" onclick="loadPOI()">Spróbuj ponownie</button></div>`;
  const bad=p.list.filter(x=>x.lv==='red'||x.lv==='yellow');
  const inf=p.list.filter(x=>x.lv==='info');
  const good=p.list.filter(x=>x.lv==='good');
  const grp=(t,arr,e)=>arr.length?`<h3>${t}</h3>`+arr.map(x=>`<div class="poi">
      <span class="dist" style="color:${x.lv==='red'?'#fca5a5':x.lv==='yellow'?'#fcd34d':x.lv==='good'?'#86efac':'#94a3b8'}">${x.dtxt}</span>
      <span class="nm">${esc(x.n)}${x.name?' <span class="tg">· '+esc(x.name)+'</span>':''}<br><span class="tg">${esc(x.w)}</span></span></div>`).join(''):
    `<h3>${t}</h3><div class="msg ok">${e}</div>`;
  return `<div class="card">
    <h2>Skan okolicy <span class="pill">automat · OpenStreetMap</span></h2>
    <p class="lead">Najbliższy obiekt każdego typu w promieniu do 3 km. Dane pochodzą z OpenStreetMap, więc mogą być niekompletne.</p>
    ${grp('Potencjalne uciążliwości',bad,'Nie znalazłem obiektów uciążliwych w zasięgu.')}
    ${grp('Warto wiedzieć',inf,'Brak.')}
    ${grp('Udogodnienia',good,'Brak w zasięgu.')}
    <button class="btn sm sec noprint" style="margin-top:12px" onclick="loadPOI()">Odśwież skan</button>
  </div>`;
}

let LASTMSG='';
function msg(h){LASTMSG=h;const e=$('#findMsg');if(e)e.innerHTML=h;}
function fetchT(url,opt,ms){
  const c=new AbortController(), t=setTimeout(()=>c.abort(),ms||12000);
  return fetch(url,Object.assign({signal:c.signal},opt||{})).finally(()=>clearTimeout(t));
}
function addrVariants(a){
  let s=a.replace(/\b(ul|al|os|pl|ulica|aleja|osiedle|plac)\b\.?\s*/gi,' ')
         .replace(/\s+/g,' ').replace(/\s*,\s*/g,', ').trim();
  const v=[s];
  const noApt=s.replace(/(\d+[a-zA-Z]?)\s*\/\s*\d+[a-zA-Z]?/,'$1');
  if(noApt!==s)v.push(noApt);
  const parts=noApt.split(',').map(x=>x.trim()).filter(Boolean);
  if(parts.length>1)v.push(parts.slice().reverse().join(', '));
  const noNum=noApt.replace(/\s+\d+[a-zA-Z]?(\s*,|$)/,'$1').trim();
  if(noNum&&noNum!==noApt)v.push(noNum);
  return [...new Set(v)].filter(x=>x.length>2);
}
async function geocode(q){
  const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=pl&addressdetails=0&q='
    +encodeURIComponent(q+(/polsk/i.test(q)?'':', Polska'));
  const r=await fetchT(url,{headers:{'Accept':'application/json'}},10000);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  return (j&&j[0])?{lat:+j[0].lat,lon:+j[0].lon,label:j[0].display_name}:null;
}
async function findAddr(){

    ${blokada?`Najczęstsza przyczyna: plik otwarty bezpośrednio z dysku (adres zaczyna się od <span class="mono">file://</span>),
      a przeglądarka blokuje wtedy zapytania sieciowe. Klikanie w mapę i cały audyt działają normalnie.`
      :`Sprawdziłem ${vars.length} ${vars.length===1?'wariant':'warianty'} zapisu. Mniejsze miejscowości i nowe ulice
      często nie mają numeracji w OpenStreetMap.`}
    <br><br><b>Najprostsze wyjście: kliknij w mapę poniżej.</b></div>

    <button class="btn sm" onclick="parseXY()">Ustaw z współrzędnych</button>`);

function parseXY(){

function setLoc(lat,lon,label){

function uldkURL(lat,lon){
  return 'https://uldk.gugik.gov.pl/?request=GetParcelByXY&xy='+lon+','+lat+',4326'
    +'&result=id,voivodeship,county,commune,region,parcel,geom_wkt&srid=4326';
}
async function uldk(lat,lon){
  try{const r=await fetchT(uldkURL(lat,lon),null,12000);
    if(!r.ok)return false;
    return applyUldk(await r.text());
  }catch(e){return false;}
}
function applyUldk(t){
  const lines=t.trim().split('\n').filter(x=>x.trim()!=='');
  const data=lines.find(l=>l.includes('|'))||lines[lines.length-1];
  if(!data)return false;
  const f=data.split('|').map(s=>s.trim());
  const p=S.parcel||{};
  p.id=f[0]||p.id; p.voiv=f[1]||p.voiv; p.county=f[2]||p.county;
  p.commune=f[3]||p.commune; p.region=f[4]||p.region; p.nr=f[5]||p.nr;
  const w=f.find(x=>/POLYGON/i.test(x)); if(w){p.wkt=w;p.area=wktArea(w);}
  S.parcel=p;save();return !!p.id;
}
function wktArea(w){
  try{
    const pts=w.replace(/^[A-Z]+\s*\(+/,'').replace(/\)+$/,'').split(',')
      .map(s=>s.trim().split(/\s+/).map(Number)).filter(a=>a.length>=2&&!isNaN(a[0]));
    if(pts.length<3)return 0;
    const la=pts.reduce((s,p)=>s+p[1],0)/pts.length, k=Math.cos(la*Math.PI/180);
    let A=0;
    for(let i=0;i<pts.length;i++){const j=(i+1)%pts.length;
      A+=(pts[i][0]*k*pts[j][1]-pts[j][0]*k*pts[i][1]);}
    return Math.abs(A/2)*(111320**2);
  }catch(e){return 0;}
}
async function tryUldk(silent){
  const p=S.parcel; if(!p||p.lat==null)return;
  if(!silent)msg('<div class="msg info"><span class="spin"></span> Pobieram dane działki z ULDK…</div>');
  const ok=await uldk(p.lat,p.lon);

  if(!silent)msg(`<div class="msg err"><b>Nie pobrałem danych działki.</b><br>
    Usługa ULDK bywa niedostępna dla przeglądarki. Otwórz link i wklej odpowiedź, albo pomiń — audyt działa bez identyfikatora.</div>

/* ---------- OVERPASS: skan okolicy ---------- */
async function loadPOI(){
  const p=S.parcel; if(!p||!p.lat)return;
  S.poi={loading:true};render();
  const rad=3000;
  const body='[out:json][timeout:40];('+POIDEF.map(d=>d.q+'(around:'+rad+','+p.lat+','+p.lon+');').join('')+');out center tags;';
  const eps=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
  for(const ep of eps){
    try{
      const r=await fetchT(ep,{method:'POST',body:'data='+encodeURIComponent(body),
        headers:{'Content-Type':'application/x-www-form-urlencoded'}},45000);
      if(!r.ok)continue;
      const j=await r.json();
      S.poi=processPOI(j.elements||[],p);save();render();return;
    }catch(e){}
  }
  S.poi={error:true};save();render();
}
function processPOI(els,p){
  const seen={},list=[];
  els.forEach(e=>{
    const la=e.lat||(e.center&&e.center.lat), lo=e.lon||(e.center&&e.center.lon);
    if(la==null)return;
    const tg=e.tags||{};
    const def=POIDEF.find(d=>matchDef(d,tg)); if(!def)return;
    const d=dist(p.lat,p.lon,la,lo);
    if(d>def.r)return;
    if(seen[def.k]&&seen[def.k]<=d)return;
    seen[def.k]=d;
    const i=list.findIndex(x=>x.k===def.k); if(i>=0)list.splice(i,1);
    list.push({k:def.k,n:def.n,lv:def.lv,w:def.w,lat:la,lon:lo,d,
      dtxt:d<1000?Math.round(d/10)*10+' m':(d/1000).toFixed(1)+' km',
      name:tg.name||''});
  });
  list.sort((a,b)=>a.d-b.d);
  return {list,ts:Date.now()};
}
function matchDef(d,tg){
  const m=d.q.match(/\["([^"]+)"(=|~)"([^"]+)"\]/);
  if(!m)return false;
  const key=m[1],op=m[2],val=m[3];
  if(tg[key]==null)return false;
  return op==='='? tg[key]===val : new RegExp(val).test(tg[key]);
}

const FIELD_ORDER=['m4','m4b','m1','m5','m6','m8','m7','m9','m3','m2'];

    .map(c=>({...c,mname:m.name})));
